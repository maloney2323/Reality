name: Business50 Verification Contract
on:
  push:
    branches:
      - feature/business50-vercel-preflight-20261021
  pull_request:
    paths:
      - 'api/business-adversarial-50.js'
      - 'shared/reality-core/**'
      - 'tests/business50-vercel-preflight.test.js'
      - 'tests/verification-contract.test.mjs'
      - '.github/workflows/business50-verification.yml'
jobs:
  verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run benchmark endpoint and contract tests (no paid calls)
        run: node --test tests/business50-vercel-preflight.test.js tests/verification-contract.test.mjs
