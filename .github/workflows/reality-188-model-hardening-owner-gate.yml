name: Reality #188 independent correction — previously approved source and governed v2 holdout
on:
  push:
    branches: [feature/reality-general-capability-engine-20261101]
permissions:
  contents: read
  actions: read
jobs:
  reality_self_correct_against_real_governance_failures:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[prove-188-hardened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: reality-customer-issue188-model-research-41530142180
          run-id: 41530142180
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: reality-customer-issue188-independent-sandbox-41530142180
          run-id: 41530142180
          github-token: ${{ github.token }}
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: reality-owner-exact-source-review-41531760930
          run-id: 41531760930
          github-token: ${{ github.token }}
          path: regression
      - name: Reality generates and independently checks a fresh correction against actual false-completion failures
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_REPAIR_MODEL: ${{ vars.REALITY_REPAIR_MODEL || 'gpt-5.6' }}
        run: |
          node --check scripts/reality-issue188-independent-model-hardening-v1.mjs
          node scripts/reality-issue188-independent-model-hardening-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-188-corrected-model-review-${{ github.run_id }}
          path: artifact/out/
          if-no-files-found: error
          retention-days: 30

  independent_secret_free_correction_acceptance:
    needs: reality_self_correct_against_real_governance_failures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: reality-188-corrected-model-review-${{ github.run_id }}
          path: candidate
      - name: Independent sandbox replays original frozen, blind holdout and five historical anti-regression cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-issue188-independent-hardened-verification-v1.mjs
          node scripts/reality-issue188-independent-hardened-verification-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-188-owner-hardened-independent-acceptance-${{ github.run_id }}
          path: artifact/out/reality-issue188-independent-hardened-verification.json
          if-no-files-found: error
          retention-days: 30
