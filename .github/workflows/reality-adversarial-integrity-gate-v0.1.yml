name: Reality Adversarial Integrity Gate v0.1

on:
  push:
    branches:
      - universe-cognition-engine-v0.1
      - main
    paths:
      - 'src/reality-universe-dryfire-persistence-v0.1.js'
      - 'src/reality-universe-bitemporal-ledger-v0.1.js'
      - 'test/run-reality-recursive-dryfire-v0.1.mjs'
      - '.github/workflows/reality-adversarial-integrity-gate-v0.1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/reality-universe-dryfire-persistence-v0.1.js'
      - 'src/reality-universe-bitemporal-ledger-v0.1.js'
      - 'test/run-reality-recursive-dryfire-v0.1.mjs'
      - '.github/workflows/reality-adversarial-integrity-gate-v0.1.yml'
  workflow_dispatch:

jobs:
  adversarial-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4
      - name: Run adversarial integrity suite
        run: node --experimental-default-type=module test/run-reality-recursive-dryfire-v0.1.mjs
      - name: Require all three adversarial vectors
        run: |
          node --experimental-default-type=module test/run-reality-recursive-dryfire-v0.1.mjs > /tmp/reality-integrity.json
          node -e "const r=require('fs').readFileSync('/tmp/reality-integrity.json','utf8'); if(!r.includes('adversarial_hash_chain_sever') || !r.includes('adversarial_orphaned_lineage') || !r.includes('adversarial_temporal_paradox')) process.exit(1)"
