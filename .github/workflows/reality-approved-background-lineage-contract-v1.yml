name: Reality — Original #178 approved background worker lineage contract
on:
  push:
    branches: [feature/reality-background-continuation-20261031]
    paths:
      - 'src/reality-personal-unfinished-work-v0.1.js'
      - 'src/reality-live-approved-install-to-settlement-v1.0.js'
      - 'test/reality-final-settlement-call-contract-v1.test.js'
      - 'test/reality-live-approved-install-to-settlement-v1.0.test.js'
      - 'test/reality-approved-repair-background-worker-v1.test.js'
      - 'test/reality-personal-unfinished-work-v0.1.test.js'
      - 'scripts/reality-approved-repair-background-worker-v1.mjs'
      - 'src/reality-exact-approved-worker-scope-v1.js'
      - 'test/reality-exact-approved-worker-scope-v1.test.js'
      - 'test/reality-general-signed-worker-contract-v1.test.js'
      - 'supabase/migrations/20261101_reality_general_signed_worker_scope_v4.sql'
      - 'supabase/migrations/20261101_reality_signed_pending_repair_wake_readback_v1.sql'
      - 'supabase/functions/reality-governed-approved-scheduler/signed-generic-v4.ts'
      - 'supabase/functions/reality-approved-worker-oidc-lease/signed-general-v3.ts'
      - 'supabase/migrations/20261031_reality_exact_approved_worker_scope_readback_v1.sql'
      - 'src/reality-governed-installed-acceptance-wakeup-v1.js'
      - 'test/reality-governed-installed-acceptance-wakeup-v1.test.js'
      - 'src/reality-general-installed-work-verifier-v1.0.js'
      - 'test/reality-general-installed-work-verifier-v1.0.test.js'
      - 'test/reality-preexisting-isolated-source-reconciliation-v1.test.js'
      - 'test/reality-ancestor-acceptance-equivalence-v1.test.js'
      - 'test/reality-unattended-full-loop-dry-run-v1.test.js'
      - 'src/reality-original-loop-completion-proof-v1.0.js'
      - '.github/workflows/reality-approved-background-lineage-contract-v1.yml'
permissions:
  contents: read
jobs:
  validate-same-original-work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify historical same-work recovery and approved-worker contracts
        run: |
          set -euo pipefail
          node --check src/reality-personal-unfinished-work-v0.1.js
          node --check scripts/reality-approved-repair-background-worker-v1.mjs
          node --check src/reality-governed-installed-acceptance-wakeup-v1.js
          node --test test/reality-personal-unfinished-work-v0.1.test.js
          node --test test/reality-approved-repair-background-worker-v1.test.js
          node --check src/reality-exact-approved-worker-scope-v1.js
          node --test test/reality-exact-approved-worker-scope-v1.test.js
          node --test test/reality-general-signed-worker-contract-v1.test.js
          node --test test/reality-governed-installed-acceptance-wakeup-v1.test.js
          node --test test/reality-general-installed-work-verifier-v1.0.test.js
          node --test test/reality-preexisting-isolated-source-reconciliation-v1.test.js
          node --test test/reality-ancestor-acceptance-equivalence-v1.test.js
          node --test test/reality-live-approved-install-to-settlement-v1.0.test.js
          node --test test/reality-final-settlement-call-contract-v1.test.js
          node --test test/reality-unattended-full-loop-dry-run-v1.test.js
      - name: Keep candidate inert until independently authorized
        run: echo 'Only isolated source contracts were tested. No installation, owner approval, original work mutation, or settlement.'

  wake-existing-owner-approved-work:
    name: Governed CI completion → signed scheduler
    needs: [validate-same-original-work]
    if: ${{ needs.validate-same-original-work.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch exact default-branch signed approval poll
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = 'maloney2323/Reality'
          # The untrusted feature-branch code and tests have already exited;
          # this isolated job receives only the built-in ephemeral token.
          # Dispatch is observation only; no approval, install or settlement.
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${REPO}/actions/workflows/reality-governed-approved-scheduler-v1.yml/dispatches")"
          if [ "$code" != 204 ]; then
            echo "::error::Governed scheduler did not accept CI completion: HTTP $code"
            exit 1
          fi
          echo 'REALITY_GOVERNED_CI_WAKE {"status":"SCHEDULER_DISPATCH_ACCEPTED","approval_created":false,"installation_performed":false,"production_changed":false}'
