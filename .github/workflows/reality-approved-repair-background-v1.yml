name: Reality — Owner-approved background install and original-job settlement
on:
  push:
    branches:
      - feature/reality-background-continuation-20261031
    paths:
      - 'reality-approved-continuations/*.json'
  workflow_dispatch:
    inputs:
      reservation_id:
        description: Exact previously approved reservation
        required: true
        type: string
      original_work_id:
        description: Original customer work identity
        required: true
        type: string
      candidate_hash:
        description: Independently verified upgrade artifact SHA256
        required: true
        type: string
      issue_number:
        description: Original issue number
        required: true
        type: string
      install_branch:
        description: Isolated preview install branch
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: reality-owner-approved-background-continuation
  cancel-in-progress: false
jobs:
  continue-original-approved-work:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only exact signed-off execution branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fail closed if built-in GitHub identity or ephemeral job token is unavailable
        env:
          REALITY_BUILDER_DISPATCH_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for name in REALITY_BUILDER_DISPATCH_GITHUB_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Signed GitHub runtime prerequisite unavailable: $name"
              exit 1
            fi
          done
      - name: Run only previously consumed exact owner approval
        env:
          REALITY_BUILDER_DISPATCH_GITHUB_TOKEN: ${{ github.token }}
          REALITY_BACKGROUND_REPAIR_WORKER_ENABLED: 'true'
          REALITY_UNIVERSE_PERSISTENCE_ENABLED: 'true'
          REALITY_CONTINUOUS_RELIABILITY_ENABLED: 'true'
          VERCEL_ENV: preview
          REALITY_PERSONAL_CHAT_EXPECTED_PROJECT_REF: hvkfreoagbrphwghjajw
          REALITY_PERSONAL_CHAT_SUPABASE_URL: https://hvkfreoagbrphwghjajw.supabase.co
          REALITY_RELIABILITY_BENCHMARK_PROJECT_REF: hvkfreoagbrphwghjajw
          REALITY_RELIABILITY_ALLOWED_BENCHMARK_REF: hvkfreoagbrphwghjajw
          REALITY_RELIABILITY_BENCHMARK_SUPABASE_URL: https://hvkfreoagbrphwghjajw.supabase.co
        run: |
          set -euo pipefail
          node --check scripts/reality-approved-repair-background-worker-v1.mjs
          node scripts/reality-approved-repair-background-worker-v1.mjs
