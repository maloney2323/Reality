name: Reality Same Astra All Fifty — One Time
# The user explicitly requested all original 50 cases and unchanged frozen scoring.
# Initial exact-50 workflow was dispatched by its one-time push.
# No subsequent code push may cause another paid run.
on:
  workflow_dispatch:
    inputs:
      approve_another_exact_fifty_calls:
        description: 'Requires explicit separate approval YES_EXACT_RUN'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: reality-astra-all50-original-test-20261021
  cancel-in-progress: false
jobs:
  original-fifty-all-attempted:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      B50_GOVERNED_MODE: paid_fifty
      B50_GOVERNED_CASE: FULL_FIFTY
      B50_GOVERNED_PAID_APPROVED: ${{ inputs.approve_another_exact_fifty_calls }}
      B50_GOVERNED_MAX_PROVIDER_CALLS: "50"
      B50_GOVERNED_RECEIPT_PATH: artifacts/reality-business50-all50-original-test-20261021.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove frozen corpus has not changed
        run: |
          echo 'a8a989203915d8614d73eda08ffe24e8cec040e19c6654cb83e6785ea5d3d81c  benchmarks/business50/business-adversarial-50-six-sector-v0.1.js' | sha256sum -c -
          node --test benchmarks/business50/reality-governed-preflight.test.js
      - name: Prove all 50 API calls and all 50 grades with synthetic no-network gateway
        run: node benchmarks/business50/reality-governed-all50-mock-preflight.mjs
      - name: Check provider key exists before any paid call
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then echo 'OPENAI_KEY_NOT_CONFIGURED'; exit 2; fi
      - name: Execute exact 50 Astra model attempts and apply Reality governance
        run: node benchmarks/business50/reality-governed-astra-all50.mjs
      - name: Show strict final results with unchanged denominator
        if: always()
        run: |
          if [ -f artifacts/reality-business50-all50-original-test-20261021.json ]; then
            node --input-type=module <<'JS'
            import {readFileSync} from 'node:fs';
            const r=JSON.parse(readFileSync('artifacts/reality-business50-all50-original-test-20261021.json','utf8'));
            const s=r.summary||{};
            console.log(JSON.stringify({
              run_id:r.run_id,original_openai_baseline:'36/50',
              all_cases:r.records?.length,
              actual_api_attempts:s.provider_calls,
              raw_model_passes:s.raw_model_passed,
              strict_reality_passes:s.strict_final_passed,
              strict_reality_failures:s.strict_final_failed,
              strict_reality_percent:s.strict_final_percent,
              withheld:s.withheld,without_policy:s.unclassified,not_completed:s.unresolved,
              same_frozen_rubric:true,governance_not_blind:r.independent_source_classification_proven===false,
              hallucination_rate:r.verified_hallucination_rate,
              drift_rate:r.verified_drift_rate,
              run_receipt_sha256:r.receipt_sha256
            }));
            if(r.records?.length!==50||s.provider_calls!==50||!s.all_50_cases_attempted||
              s.strict_final_passed+s.strict_final_failed!==50)
              throw Error('NOT_A_COMPLETE_FAIR_50_CASE_RUN');
            JS
          fi
      - name: Preserve original provider results, gate decisions and complete case ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-astra-all50-exact-test-20261021
          path: artifacts/reality-business50-all50-original-test-20261021.json
          if-no-files-found: warn
          retention-days: 30
