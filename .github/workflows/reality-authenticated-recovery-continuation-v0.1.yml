name: Reality Authenticated Recovery Continuation v0.1
on:
  push:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
    paths:
      - 'src/reality-real-recovery-coordinator-v0.1.js'
      - 'api/reality/personal-recovery-loop.js'
      - 'test/reality-real-recovery-coordinator-v0.1.test.js'
      - 'index.html'
      - '.github/workflows/reality-authenticated-recovery-continuation-v0.1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/reality-real-recovery-coordinator-v0.1.test.js test/reality-recovery-v1-linkage.test.js test/reality-personal-recovery-checkpoint-v0.1.test.js
