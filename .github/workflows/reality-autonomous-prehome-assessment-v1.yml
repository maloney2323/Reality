name: Reality automatic pre-home upgrade assessments — preview
on:
  push:
    branches:
      - feature/reality-prehome-market-value-assessments-20261103
  pull_request:
    branches:
      - feature/reality-general-capability-engine-20261101
permissions:
  contents: read
jobs:
  prehome-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify automatic value review and customer UI
        run: |
          node --test test/reality-autonomous-prehome-assessments-v1.test.js
          node --test test/reality-simple-customer-home-v1.test.js
          node --test test/reality-market-research-restoration-v1.test.js
          node --test test/reality-home-owner-authorizations-v1.test.js
          node --test test/reality-market-handoff-chat-v1.test.js
