name: Reality autonomous real-source correction — original customer receipt
on:
  push:
    branches: [feature/reality-live-general-repair-bridge-20261031]
    paths:
      - 'reality-repair-jobs/*.json'
permissions: {contents: read}
jobs:
  generate_1:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Actual model proposes repair (no installation authority)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REALITY_REPAIR_MODEL: ${{ vars.REALITY_REPAIR_MODEL || 'gpt-5.6' }}
        run: node scripts/reality-autonomous-source-repair-v1.mjs generate 1
      - uses: actions/upload-artifact@v4
        with:
          name: reality-repair-candidate-1
          path: artifact/candidate.json
          if-no-files-found: error
          retention-days: 14
  verify_1:
    needs: generate_1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    outputs:
      passed: ${{ steps.read_receipt.outputs.passed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: reality-repair-candidate-1, path: candidate}
      - name: Validate bytes and stage source only (no execution here)
        run: node scripts/reality-autonomous-source-repair-v1.mjs prepare
      - name: Run frozen original acceptance in separate secret-free offline Docker
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory=512m --cpus=1 --user 65534:65534 -v "$PWD:/work:ro" -w /work node:22 node --test test/reality-frozen-regressions/reality-general-execution-receipt-v1.test.js > sandbox.log 2>&1
          echo "$?" > sandbox-exit-code
          set -e
      - name: Produce provider-independent, source-bound test receipt
        run: node scripts/reality-autonomous-source-repair-v1.mjs receipt 1 "$(cat sandbox-exit-code)"
      - id: read_receipt
        run: echo "passed=$(node -p 'JSON.parse(require("fs").readFileSync("artifact/verification.json","utf8")).passed')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: reality-repair-verification-1
          path: |
            artifact/verification.json
            sandbox.log
          if-no-files-found: error
          retention-days: 14
  generate_2:
    needs: verify_1
    if: needs.verify_1.outputs.passed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: reality-repair-candidate-1, path: prior}
      - uses: actions/download-artifact@v4
        with: {name: reality-repair-verification-1, path: prior}
      - name: Actual model proposes repair (no installation authority)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REALITY_REPAIR_MODEL: ${{ vars.REALITY_REPAIR_MODEL || 'gpt-5.6' }}
        run: node scripts/reality-autonomous-source-repair-v1.mjs generate 2
      - uses: actions/upload-artifact@v4
        with:
          name: reality-repair-candidate-2
          path: artifact/candidate.json
          if-no-files-found: error
          retention-days: 14
  verify_2:
    needs: generate_2
    runs-on: ubuntu-latest
    timeout-minutes: 9
    outputs:
      passed: ${{ steps.read_receipt.outputs.passed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: reality-repair-candidate-2, path: candidate}
      - name: Validate bytes and stage source only (no execution here)
        run: node scripts/reality-autonomous-source-repair-v1.mjs prepare
      - name: Run frozen original acceptance in separate secret-free offline Docker
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory=512m --cpus=1 --user 65534:65534 -v "$PWD:/work:ro" -w /work node:22 node --test test/reality-frozen-regressions/reality-general-execution-receipt-v1.test.js > sandbox.log 2>&1
          echo "$?" > sandbox-exit-code
          set -e
      - name: Produce provider-independent, source-bound test receipt
        run: node scripts/reality-autonomous-source-repair-v1.mjs receipt 2 "$(cat sandbox-exit-code)"
      - id: read_receipt
        run: echo "passed=$(node -p 'JSON.parse(require("fs").readFileSync("artifact/verification.json","utf8")).passed')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: reality-repair-verification-2
          path: |
            artifact/verification.json
            sandbox.log
          if-no-files-found: error
          retention-days: 14
  generate_3:
    needs: verify_2
    if: needs.verify_2.outputs.passed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: reality-repair-candidate-2, path: prior}
      - uses: actions/download-artifact@v4
        with: {name: reality-repair-verification-2, path: prior}
      - name: Actual model proposes repair (no installation authority)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REALITY_REPAIR_MODEL: ${{ vars.REALITY_REPAIR_MODEL || 'gpt-5.6' }}
        run: node scripts/reality-autonomous-source-repair-v1.mjs generate 3
      - uses: actions/upload-artifact@v4
        with:
          name: reality-repair-candidate-3
          path: artifact/candidate.json
          if-no-files-found: error
          retention-days: 14
  verify_3:
    needs: generate_3
    runs-on: ubuntu-latest
    timeout-minutes: 9
    outputs:
      passed: ${{ steps.read_receipt.outputs.passed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: reality-repair-candidate-3, path: candidate}
      - name: Validate bytes and stage source only (no execution here)
        run: node scripts/reality-autonomous-source-repair-v1.mjs prepare
      - name: Run frozen original acceptance in separate secret-free offline Docker
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory=512m --cpus=1 --user 65534:65534 -v "$PWD:/work:ro" -w /work node:22 node --test test/reality-frozen-regressions/reality-general-execution-receipt-v1.test.js > sandbox.log 2>&1
          echo "$?" > sandbox-exit-code
          set -e
      - name: Produce provider-independent, source-bound test receipt
        run: node scripts/reality-autonomous-source-repair-v1.mjs receipt 3 "$(cat sandbox-exit-code)"
      - id: read_receipt
        run: echo "passed=$(node -p 'JSON.parse(require("fs").readFileSync("artifact/verification.json","utf8")).passed')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: reality-repair-verification-3
          path: |
            artifact/verification.json
            sandbox.log
          if-no-files-found: error
          retention-days: 14
  evidence_summary:
    if: always()
    needs: [verify_1, verify_2, verify_3]
    runs-on: ubuntu-latest
    steps:
      - name: Record actual model and sandbox attempt states
        run: |
          echo 'Attempt 1: ${{ needs.verify_1.outputs.passed }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Attempt 2: ${{ needs.verify_2.outputs.passed }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Attempt 3: ${{ needs.verify_3.outputs.passed }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified candidate is NOT an installed capability, owner approval, resumed job or settlement.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All generated candidates remain isolated artifacts. Production unchanged.' >> "$GITHUB_STEP_SUMMARY"
