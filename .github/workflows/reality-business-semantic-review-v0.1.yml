name: Reality Semantic Review — Real Take Intelligence Business Evidence
on:
  push:
    branches:
      - experiment/reality-semantic-detection-unified-20261024
    paths:
      - '.github/workflows/reality-business-semantic-review-v0.1.yml'
      - 'scripts/run-reality-business-semantic-review-v0.1.mjs'
      - 'src/reality-semantic-review-v0.1.js'
      - 'src/reality-live-intelligence-orchestration-v0.1.js'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  no-provider-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify source and integration syntax
        run: |
          node --check scripts/run-reality-business-semantic-review-v0.1.mjs
          node --check src/reality-semantic-review-v0.1.js
          node --check src/reality-live-intelligence-orchestration-v0.1.js
      - name: Prove semantic review and re-review without API spending
        run: |
          node --test test/reality-unified-semantic-review-v0.1.test.js
  bounded-real-business-proof:
    needs: no-provider-preflight
    if: contains(github.event.head_commit.message, '[live-business-semantic-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      REALITY_REAL_BUSINESS_CASES: '2,5'
      REALITY_SEMANTIC_REVIEW_MODEL: 'gpt-4.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Targeted real-business deployment and PR truth questions
        run: node scripts/run-reality-business-semantic-review-v0.1.mjs
      - name: Preserve first model output, semantic candidates and Reality final answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-real-business-unified-semantic-review
          path: benchmark-results/reality-business-semantic-review-v0.1.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Scope disclosure
        if: always()
        run: |
          echo 'Real read-only GitHub source records; real OpenAI calls inside Reality.'
          echo 'In-memory persistence simulation; no actual Supabase/customer data/actions.'
          echo 'NOT an independent accuracy certification or competitor comparison.'
