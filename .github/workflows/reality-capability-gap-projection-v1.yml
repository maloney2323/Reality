name: Reality Capability Gap Projection v1

on:
  push:
    branches:
      - capability-gap-projection-v1
  pull_request:
    branches:
      - main

jobs:
  capability-gap-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run invariant tests
        run: npm test -- --test-name-pattern='operational-situation|capability-gap-projection'
