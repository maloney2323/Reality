name: Reality Capability Gap Runtime v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/reality/capability-gap-runtime.js'
      - 'src/reality-autonomous-closure-orchestrator-v0.1.js'
      - 'src/reality-capability-gap-projection-v1.js'
      - 'src/reality-autonomous-capability-loop-v0.1.js'
      - 'test/capability-gap-runtime-v1.test.js'

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/capability-gap-runtime-v1.test.js
      - name: Invoke live Vercel runtime
        env:
          RUNTIME_URL: https://reality-git-main-maloney2323-5310s-projects.vercel.app/api/reality/capability-gap-runtime
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "$RUNTIME_URL" -H 'content-type: application/json' -d '{}')"
          echo "$response"
          node --input-type=module -e '
            const result = JSON.parse(process.argv[1]);
            if (result.ok !== true) throw new Error("RUNTIME_NOT_OK");
            if (result.state !== "REACTIVATED") throw new Error("RUNTIME_STATE_NOT_REACTIVATED");
            if (result.production_graph_write_permitted !== false) throw new Error("PRODUCTION_WRITE_NOT_BLOCKED");
            if (result.external_execution !== false) throw new Error("EXTERNAL_EXECUTION_OCCURRED");
            if (result.verification?.frozen_regression !== true) throw new Error("FROZEN_REGRESSION_NOT_VERIFIED");
            if (result.verification?.isolated_verification !== true) throw new Error("ISOLATED_VERIFICATION_NOT_VERIFIED");
            if (!result.verification?.capability_signature_present) throw new Error("CAPABILITY_SIGNATURE_MISSING");
            if (result.registration_scope !== "IN_MEMORY_RUNTIME_PROBE") throw new Error("UNEXPECTED_REGISTRATION_SCOPE");
            if (result.reactivation_work_item_id !== "runtime-proof-work-item") throw new Error("WORK_ID_NOT_REACTIVATED");
          ' "$response"
