name: Reality Capability Engine — value report and tradeoff integrity
on:
  push:
    branches: [feature/reality-general-capability-engine-20261101]
    paths:
      - 'src/reality-capability-value-report-v1.js'
      - 'test/reality-capability-value-report-v1.test.js'
      - 'api/reality/personal-qualified-capabilities.js'
      - '.github/workflows/reality-capability-value-report-v1.yml'
permissions:
  contents: read
jobs:
  verify-owner-value-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax, trust boundary, real receipt projection and portfolio tests
        run: |
          node --check src/reality-capability-value-report-v1.js
          node --check api/reality/personal-qualified-capabilities.js
          node --test test/reality-capability-value-report-v1.test.js
