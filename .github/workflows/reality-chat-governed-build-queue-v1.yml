name: Reality — Owner Chat Governed Build Queue Boundary
on:
  push:
    branches:
      - reality/connect/owner-chat-foundational-build-worker-20261029
  pull_request:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
permissions:
  contents: read
jobs:
  verify-durable-owner-scoped-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run signed-in chat-to-durable-builder-queue tests
        run: |
          set -euo pipefail
          node --check api/reality/personal-governed-build.js
          node --check src/reality-governed-build-chat-connection-v1.0.js
          node --test test/reality-governed-build-chat-connection-v1.0.test.js
          node --test test/reality-personal-governed-self-improvement-v0.1.test.js
          node --test test/reality-foundational-build-loop-v1.0.test.js
          node --test test/reality-foundational-constitutional-adapters-v1.0.test.js
