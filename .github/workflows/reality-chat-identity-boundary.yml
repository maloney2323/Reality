name: Reality Chat Identity Boundary
on:
  pull_request:
    paths:
      - 'api/chat.js'
      - 'src/reality-base44-principal-v0.1.js'
      - 'test/reality-base44-principal-v0.1.test.js'
      - 'tests/chat-base44-identity-boundary.test.js'
      - '.github/workflows/reality-chat-identity-boundary.yml'
  workflow_dispatch:
jobs:
  identity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/reality-base44-principal-v0.1.test.js tests/chat-base44-identity-boundary.test.js
