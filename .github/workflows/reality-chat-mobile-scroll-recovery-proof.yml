name: Reality mobile Chat scroll and saved message recovery
on:
  push:
    branches: [reality/native263-temporal-chat-proof-20261113]
    paths:
      - index.html
      - reality-chat-conversation-export-v1.js
      - reality-chat-fullscreen-v2.css
      - reality-chat-workspace-v1.js
      - test/reality-chat-scroll-and-saved-turn-recovery-v1.test.js
      - .github/workflows/reality-chat-mobile-scroll-recovery-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-owner-chat-mobile-and-save-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check chat UI scripts
        run: |
          node --check reality-chat-conversation-export-v1.js
          node --check reality-chat-workspace-v1.js
          node --check reality-chat-request-status-v1.js
      - name: Independently run mobile scroll and saved-message proof
        run: |
          node --test test/reality-chat-scroll-and-saved-turn-recovery-v1.test.js test/reality-chat-fullscreen-v2.test.js test/reality-chat-automated-shift-and-export-v1.test.js test/reality-chat-send-nonblocking-v1.test.js
      - name: No new shift, message, installation, or production change
        run: echo 'Chat UI and authenticated readback tests only'
