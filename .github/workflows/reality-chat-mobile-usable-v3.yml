name: Reality Chat — mobile full-screen usability
on:
  push:
    branches: ['reality/**']
    paths:
      - 'index.html'
      - 'reality-chat-mobile-usable-v3.css'
      - 'reality-chat-workspace-v1.js'
      - 'reality-chat-operational-incident-briefing-v1.js'
      - 'reality-chat-direct-work-handoff-v1.js'
      - 'test/reality-chat-mobile-usable-v3.test.js'
      - 'test/reality-chat-fullscreen-v2.test.js'
      - 'test/reality-chat-scroll-and-saved-turn-recovery-v1.test.js'
      - '.github/workflows/reality-chat-mobile-usable-v3.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['reality/**']
    paths:
      - 'index.html'
      - 'reality-chat-mobile-usable-v3.css'
      - 'reality-chat-workspace-v1.js'
      - 'reality-chat-operational-incident-briefing-v1.js'
      - 'reality-chat-direct-work-handoff-v1.js'
      - 'test/reality-chat-mobile-usable-v3.test.js'
      - 'test/reality-chat-fullscreen-v2.test.js'
      - 'test/reality-chat-scroll-and-saved-turn-recovery-v1.test.js'
      - '.github/workflows/reality-chat-mobile-usable-v3.yml'
permissions:
  contents: read
jobs:
  signed-chat-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact branch without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate exact page scripts and mobile Chat regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check reality-chat-workspace-v1.js
          node --check reality-chat-operational-incident-briefing-v1.js
          node --check reality-chat-direct-work-handoff-v1.js
          node --test \
            test/reality-chat-mobile-usable-v3.test.js \
            test/reality-chat-fullscreen-v2.test.js \
            test/reality-chat-workspace-v1.test.js \
            test/reality-chat-premium-design1-v1.test.js \
            test/reality-unified-shell-v1.test.js \
            test/reality-chat-direct-work-handoff-v1.test.js \
            test/reality-owner-operational-incident-chat-v1.test.js \
            test/reality-chat-scroll-and-saved-turn-recovery-v1.test.js
