name: Reality signed Chat original stale-release CI reconciliation
on:
  pull_request:
    paths:
      - 'supabase/functions/reality-chat-new-development-broker-v1/index.ts'
      - 'test/reality-chat-staged-ci-frozen-release-reconciliation-v1.test.js'
  workflow_dispatch:
jobs:
  staged-original-reconciliation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/reality-chat-staged-ci-frozen-release-reconciliation-v1.test.js test/reality-qualified-chat-original-exact-approval-v1.test.js
