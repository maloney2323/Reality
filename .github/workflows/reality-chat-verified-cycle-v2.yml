name: Reality Chat verified-cycle UI v2
on:
  push:
    branches:
      - fix/reality-chat-fullscreen-verified-cycle-20261105
  pull_request:
    paths:
      - 'index.html'
      - 'reality-chat-verified-cycle-v2.js'
      - 'reality-chat-fullscreen-v2.css'
      - 'test/reality-chat-fullscreen-v2.test.js'
      - 'test/reality-chat-premium-design1-v1.test.js'
      - 'test/reality-chat-session-continuity-v2.test.js'
      - 'test/reality-chat-live-response-v1.test.js'
      - 'test/reality-provider-timeout-v1.test.js'
      - 'test/reality-chat-send-nonblocking-v1.test.js'
      - 'src/reality-model-gateway-v0.1.js'
      - 'src/reality-semantic-review-v0.1.js'
      - 'src/reality-universe-postgres-persistence-v0.1.js'
      - 'reality-chat-request-status-v1.js'
      - 'reality-chat-recover-unanswered-v1.js'
      - 'api/reality/personal-chat-intake.js'
      - 'src/reality-private-chat-store-v0.1.js'
      - 'test/reality-personal-chat-durable-intake-v1.test.js'
      - 'test/reality-chat-exact-reply-readback-v1.test.js'
      - 'test/reality-chat-recover-unanswered-v1.test.js'
      - 'test/reality-chat-proportional-readonly-v1.test.js'
      - 'src/reality-chat-self-visibility-v1.js'
      - 'test/reality-chat-self-visibility-v1.test.js'
      - 'src/reality-chat-universe-cognitive-projection-v1.js'
      - 'test/reality-chat-universe-cognitive-projection-v1.test.js'
      - 'test/reality-chat-owner-epoch-fast-readonly-v1.test.js'
      - 'src/reality-chat-proportional-readonly-v1.js'
      - 'supabase/migrations/20261115020000_indexed_governed_wake_health_readback_v1.sql'
      - 'api/reality/personal-chat.js'
      - 'src/reality-private-chat-auth-v0.1.js'
      - 'reality-chat-workspace-v1.js'
      - '.github/workflows/reality-chat-verified-cycle-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Verify Chat presentation and existing governed contracts
        run: |
          node --check reality-chat-workspace-v1.js
          node --check reality-chat-verified-cycle-v2.js
          node --test test/reality-chat-fullscreen-v2.test.js
          node --test test/reality-chat-premium-design1-v1.test.js
          node --test test/reality-chat-session-continuity-v2.test.js
          node --check reality-chat-request-status-v1.js
          node --test test/reality-chat-live-response-v1.test.js
          node --test test/reality-provider-timeout-v1.test.js
          node --test test/reality-chat-send-nonblocking-v1.test.js
          node --test test/reality-personal-chat-durable-intake-v1.test.js
          node --test test/reality-chat-exact-reply-readback-v1.test.js
          node --test test/reality-chat-recover-unanswered-v1.test.js
          node --test test/reality-chat-proportional-readonly-v1.test.js
          node --test test/reality-chat-self-visibility-v1.test.js
          node --test test/reality-chat-universe-cognitive-projection-v1.test.js
          node --test test/reality-chat-owner-epoch-fast-readonly-v1.test.js
          node --check src/reality-chat-universe-cognitive-projection-v1.js
          node --check src/reality-chat-self-visibility-v1.js
          node --check api/reality/personal-chat.js
          node --check src/reality-chat-proportional-readonly-v1.js
          node --check api/reality/personal-chat-intake.js
          node --check src/reality-private-chat-store-v0.1.js
          node --test test/reality-model-gateway-v0.1.test.js
          node --test test/reality-unified-semantic-review-v0.1.test.js
          node --test test/reality-universe-postgres-continuity-v0.2.test.js
          node --test test/reality-chat-workspace-v1.test.js
          node --test test/reality-chat-page-shift-brief-v1.test.js
          node --test test/reality-business-chat.test.js
          node --test test/reality-business-chat-v2.test.js
          node --test test/reality-private-chat-preview-v0.1.test.js
