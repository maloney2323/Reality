name: Reality full-page Chat workspace — foundation-preserving UI
on:
  push:
    branches: [feature/reality-full-chat-workspace-20261105]
    paths:
      - 'index.html'
      - 'reality-chat-workspace-v1.js'
      - 'reality-chat-workspace-v1.css'
      - 'test/reality-chat-workspace-v1.test.js'
      - '.github/workflows/reality-chat-workspace-v1.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'reality-chat-workspace-v1.js'
      - 'reality-chat-workspace-v1.css'
      - 'test/reality-chat-workspace-v1.test.js'
      - '.github/workflows/reality-chat-workspace-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-chat-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Validate standalone UI and original Reality integration
        run: |
          node --check reality-chat-workspace-v1.js
          node --test test/reality-chat-workspace-v1.test.js
          node --test test/reality-chat-page-shift-brief-v1.test.js
          node --test test/reality-business-chat.test.js
          node --test test/reality-business-chat-v2.test.js
          node --test test/reality-private-chat-preview-v0.1.test.js
      - name: State boundaries accurately
        run: |
          echo 'Only index.html and optional CSS/DOM presentation are changed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No new model or worker governance. Existing Reality Chat auth, Continuity, exact approvals and receipt endpoints remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests are not a verified deployed preview or a completed self-development job.' >> "$GITHUB_STEP_SUMMARY"
