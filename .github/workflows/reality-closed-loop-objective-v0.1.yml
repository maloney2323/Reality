name: Reality Closed-Loop Objective v0.1
on:
  push:
    branches:
      - closed-loop-objective-v0.1
    paths:
      - 'src/reality-closed-loop-objective-v0.1.js'
      - 'test/run-reality-closed-loop-objective-v0.1.mjs'
      - '.github/workflows/reality-closed-loop-objective-v0.1.yml'
  workflow_dispatch:
jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4
      - name: Run closed-loop test
        run: node --experimental-default-type=module test/run-reality-closed-loop-objective-v0.1.mjs
