name: Reality Closed-Loop Runtime v0.1
on:
  push:
    branches: [closed-loop-objective-v0.1]
    paths:
      - 'src/reality-closed-loop-*.js'
      - 'test/run-reality-closed-loop-runtime-v0.1.mjs'
      - '.github/workflows/reality-closed-loop-runtime-v0.1.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-default-type=module test/run-reality-closed-loop-runtime-v0.1.mjs