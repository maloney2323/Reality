name: Reality — Closed-loop worker wiring, owner approval, and no browser execution
on:
  push:
    branches: [feature/reality-closed-loop-worker-20261031]
permissions:
  contents: read
jobs:
  verify-background-owner-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify parser, one-click authority, no unsolicited promotion
        run: |
          set -euo pipefail
          node --check src/reality-approved-repair-github-wakeup-v1.0.js
          node --check src/reality-live-approved-install-to-settlement-v1.0.js
          node --check api/reality/personal-real-repair-install.js
          node --check scripts/reality-approved-repair-background-worker-v1.mjs
          node --check src/reality-original-repair-worker-handoff-v1.0.js
          node --check scripts/reality-source-bound-model-ticket-worker-v1.mjs
          node --check scripts/reality-autonomous-source-repair-v1.mjs
          node --check scripts/reality-stage-source-bound-candidate-review-v1.mjs
          node --check src/reality-governed-build-github-dispatch-v1.0.js
          node --check src/reality-general-installed-work-verifier-v1.0.js
          node --test test/reality-live-approved-install-to-settlement-v1.0.test.js
          node --test test/reality-approved-repair-background-worker-v1.test.js
          node --test test/reality-original-repair-worker-handoff-v1.0.test.js
          node --test test/reality-source-bound-generation-ticket-v1.test.js
          node --test test/reality-governed-build-chat-connection-v1.0.test.js
          node --test test/reality-governed-build-github-dispatch-v1.0.test.js
          node --test test/reality-general-installed-work-verifier-v1.0.test.js
          node --test test/reality-real-repair-opportunity-intake-v1.0.test.js
          node --test test/reality-governed-self-improvement-spine-v1.0.test.js
      - name: Do not claim live loop from tests
        run: |
          echo 'Code tests do not prove model generation, live installation, or durable original job settlement.'
