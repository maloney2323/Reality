name: Reality Cognitive Evolution Benchmarks

on:
  push:
    paths:
      - 'src/reality-cognitive-evolution-v0.1.js'
      - 'src/reality-cognitive-research-engine-v0.1.js'
      - 'src/reality-capability-gap-detector-v0.1.js'
      - 'src/reality-adversarial-critique-v0.1.js'
      - 'src/reality-capability-evolution-ledger-v0.1.js'
      - 'src/reality-governed-cognitive-loop-v0.1.js'
      - 'src/reality-intelligence-orchestrator-v0.1.js'
      - 'api/worldline-proof.js'
      - 'test/reality-cognitive-evolution-v0.1.test.js'
      - 'test/run-reality-cognitive-evolution-v0.1.mjs'
      - 'test/reality-cognitive-research-engine-v0.1.test.js'
      - 'test/run-reality-cognitive-research-engine-v0.1.mjs'
      - 'test/reality-intelligence-primitives-v0.1.test.js'
      - 'test/run-reality-intelligence-primitives-v0.1.mjs'
      - 'test/reality-governed-cognitive-loop-v0.1.test.js'
      - 'test/run-reality-governed-cognitive-loop-v0.1.mjs'
      - 'test/reality-intelligence-orchestrator-v0.1.test.js'
      - 'test/run-reality-intelligence-orchestrator-v0.1.mjs'
      - '.github/workflows/reality-cognitive-evolution.yml'
  workflow_dispatch:

jobs:
  cognitive-evolution-v01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4
      - name: Run Cognitive Evolution v0.1
        run: node --experimental-default-type=module test/run-reality-cognitive-evolution-v0.1.mjs

  intelligence-primitives-v01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4
      - name: Run Intelligence Primitives v0.1
        run: node --experimental-default-type=module test/run-reality-intelligence-primitives-v0.1.mjs

  governed-cognitive-loop-v01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4
      - name: Run Governed Cognitive Loop v0.1
        run: node --experimental-default-type=module test/run-reality-governed-cognitive-loop-v0.1.mjs

  intelligence-orchestrator-v01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4
      - name: Run Intelligence Orchestrator v0.1
        run: node --experimental-default-type=module test/run-reality-intelligence-orchestrator-v0.1.mjs

  cognitive-research-engine-v01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4
      - name: Run Cognitive Research Engine v0.1
        run: node --experimental-default-type=module test/run-reality-cognitive-research-engine-v0.1.mjs

  builder-worldline-proof-v01:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live runtime identity and deterministic proof
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 https://reality-git-main-maloney2323-5310s-projects.vercel.app/api/worldline-proof)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            const expected = process.argv[2];
            if (body.proof !== "REALITY-WORLDLINE-PROOF-V0.1") process.exit(2);
            if (body.runtime_commit_sha !== expected) process.exit(3);
            if (!body.runtime_deployment_id) process.exit(4);
            console.log(JSON.stringify(body));
          ' "$body" "$EXPECTED_SHA"
