name: Reality Continuity Discovery v1.0

on:
  push:
    paths:
      - 'src/reality-continuity-discovery-v1.0.js'
      - 'test/reality-continuity-discovery-v1.0.test.js'
      - '.github/workflows/reality-continuity-discovery-v1.0.yml'
  pull_request:
    paths:
      - 'src/reality-continuity-discovery-v1.0.js'
      - 'test/reality-continuity-discovery-v1.0.test.js'
      - '.github/workflows/reality-continuity-discovery-v1.0.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/reality-continuity-discovery-v1.0.test.js
