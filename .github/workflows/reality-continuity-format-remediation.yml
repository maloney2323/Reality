name: Reality independent Continuity format remediation
on:
  pull_request:
  push:
    branches:
      - 'repair/**'
      - 'reality/**'
permissions:
  contents: read
jobs:
  verify:
    name: verify-format-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounds and unchanged authority
        run: node --test test/reality-shift-investigation-remediation-v1.test.js test/reality-signed-chat-review-incident-observation-v1.test.js test/reality-signed-chat-recovery-syntax-verifier-v1.test.js test/reality-signed-chat-recovery-structural-splice-v1.test.js test/reality-signed-model-rejection-reentry-v1.test.js test/reality-signed-chat-full-goal-adapter-v1.test.js
