name: Reality Continuous Integrity Spine Contract v0.1
on:
  push:
    branches:
      - foundation/continuous-integrity-spine-contract-v01-20261022
    paths:
      - src/reality-continuous-integrity-spine-v0.1.js
      - test/reality-continuous-integrity-spine-v0.1.test.js
      - docs/reality-continuous-integrity-spine-v0.1.md
      - .github/workflows/reality-continuous-integrity-spine-v0.1.yml
  pull_request:
    paths:
      - src/reality-continuous-integrity-spine-v0.1.js
      - test/reality-continuous-integrity-spine-v0.1.test.js
      - docs/reality-continuous-integrity-spine-v0.1.md
      - .github/workflows/reality-continuous-integrity-spine-v0.1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify continuity-linked integrity trace and existing detector regressions
        run: |
          node --test test/reality-continuous-integrity-spine-v0.1.test.js test/reality-epistemic-difference-detector-v0.1.test.js test/reality-continuous-continuity-v1.0.test.js test/reality-verified-layer-handoff-v0.1.test.js test/reality-signal-interpretation-v0.2.test.js
      - name: Explain test scope
        run: |
          echo "These are synthetic contract tests only."
          echo "No model calls, source admission, production publish gate or verified customer ROI."
