name: Reality continuous qualification inbox contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/*continuous_evidence_qualification_inbox_v1.sql'
      - 'supabase/migrations/*continuous_qualification_owner_fair_priority_v1.sql'
      - 'supabase/migrations/*continuity_qualification_governed_routes_v1.sql'
      - 'supabase/migrations/*continuity_routes_owner_chat_readback_v1.sql'
      - 'test/reality-continuity-governed-routes-v1.test.js'
      - 'supabase/migrations/*owner_operational_continuity_qualification_projection_v1.sql'
      - 'test/reality-continuity-operational-view-v1.test.js'
      - 'supabase/migrations/*qualified_chat_original_exact_approval_bridge_v1.sql'
      - 'supabase/migrations/*qualified_chat_original_continuity_return_v1.sql'
      - 'supabase/migrations/*qualified_chat_independent_original_readback_v1.sql'
      - 'api/reality/personal-qualified-chat-original-approval.js'
      - 'test/reality-qualified-chat-original-exact-approval-v1.test.js'
      - 'test/reality-multi-original-acceptance-v1.test.js'
      - 'supabase/migrations/*business_original_source_executor_contract_v1.sql'
      - 'api/reality/personal-business-original-admission-contract.js'
      - 'test/reality-business-original-source-executor-contract-v1.test.js'
      - 'supabase/migrations/*signed_internal_repo_business_source_probe_v1.sql'
      - 'src/reality-signed-internal-business-source-readback-v1.js'
      - 'api/reality/personal-internal-business-provider-proof.js'
      - 'test/reality-signed-internal-business-source-readback-v1.test.js'
      - 'supabase/migrations/*owner_multi_original_shift_preflight_v1.sql'
      - 'api/reality/personal-multi-original-shift-preflight.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'api/reality/personal-continuous-qualification.js'
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'reality-chat-continuous-qualification-v1.js'
      - 'index.html'
      - 'test/reality-continuous-qualification-inbox-v1.test.js'
  workflow_dispatch:
jobs:
  continuous-qualification-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify owner multi-original readback endpoint syntax
        run: node --check api/reality/personal-multi-original-shift-preflight.js && node --check api/reality/personal-business-original-admission-contract.js && node --check api/reality/personal-internal-business-provider-proof.js && node --check src/reality-signed-internal-business-source-readback-v1.js
      - name: Syntax check qualified Chat owner approval transport and UI
        run: node --check api/reality/personal-qualified-chat-original-approval.js && node --check reality-chat-continuous-qualification-v1.js
      - name: Independently test continuous qualification source and authority boundaries
        run: node --test test/reality-continuous-qualification-inbox-v1.test.js test/reality-continuity-governed-routes-v1.test.js test/reality-continuity-operational-view-v1.test.js test/reality-qualified-chat-original-exact-approval-v1.test.js test/reality-multi-original-acceptance-v1.test.js test/reality-business-original-source-executor-contract-v1.test.js test/reality-signed-internal-business-source-readback-v1.test.js
