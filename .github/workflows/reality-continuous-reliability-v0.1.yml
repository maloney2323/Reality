      - 'src/reality-market-proof-gauntlet-v0.1.js'
      - 'test/reality-continuity-runtime-v0.1.test.js'
      - '.github/workflows/reality-continuous-reliability-v0.1.yml'
  pull_request:
    paths:
      - 'src/reality-continuous-reliability-v0.1.js'
      - 'src/reality-reliability-db-boundary-v0.1.js'
      - 'src/reality-reliability-private-replay-v0.1.js'
