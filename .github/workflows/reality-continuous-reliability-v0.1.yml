jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Continuous reliability and continuity tests
        run: node --test test/reality-full-loop-sandbox-proof-v0.1.test.js test/reality-business-proof-scoring-v0.1.test.js test/reality-market-100-turn-endurance-v0.1.test.js test/reality-market-proof-gauntlet-v0.1.test.js test/reality-continuous-reliability-v0.1.test.js test/reality-continuity-runtime-v0.1.test.js test/reality-drift-recovery-v0.1.test.js test/reality-live-intelligence-orchestration-v0.1.test.js
