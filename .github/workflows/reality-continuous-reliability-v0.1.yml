name: Reality Continuous Reliability v0.1
on:
  push:
    branches:
      - feature/reality-drift-live-continuity-v1-20261024
    paths:
      - 'src/reality-continuous-reliability-v0.1.js'
      - 'src/reality-continuity-spine-runtime-v0.1.js'
      - 'src/reality-live-intelligence-orchestration-v0.1.js'
      - 'test/reality-continuous-reliability-v0.1.test.js'
      - '.github/workflows/reality-continuous-reliability-v0.1.yml'
  pull_request:
    paths:
      - 'src/reality-continuous-reliability-v0.1.js'
      - 'src/reality-continuity-spine-runtime-v0.1.js'
      - 'src/reality-live-intelligence-orchestration-v0.1.js'
      - 'test/reality-continuous-reliability-v0.1.test.js'
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Continuous reliability and continuity tests
        run: node --test test/reality-continuous-reliability-v0.1.test.js test/reality-continuity-runtime-v0.1.test.js test/reality-drift-recovery-v0.1.test.js test/reality-live-intelligence-orchestration-v0.1.test.js
