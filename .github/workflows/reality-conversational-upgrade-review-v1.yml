name: Reality conversational owner upgrade review — Preview
on:
  push:
    branches:
      - feature/reality-upgrade-approval-in-conversation-20261103
  pull_request:
    branches:
      - feature/reality-general-capability-engine-20261101
permissions:
  contents: read
jobs:
  chat-approval-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify owner evidence dialogue and existing exact authorization
        run: |
          node --check api/reality/personal-chat.js
          node --check src/reality-verified-repair-chat-context-v1.js
          node --test test/reality-conversational-upgrade-review-v1.test.js
          node --test test/reality-market-stage-chat-context-v1.test.js
          node --test test/reality-market-handoff-chat-v1.test.js
          node --test test/reality-simple-customer-home-v1.test.js
          node --test test/reality-verified-budget-gap-owner-review-v1.test.js
          node --test test/reality-home-owner-authorizations-v1.test.js
