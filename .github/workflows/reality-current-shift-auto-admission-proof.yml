name: Reality current shift governed auto-admission frozen contract
on:
  push:
    branches: [reality/native263-temporal-chat-proof-20261113]
    paths:
      - src/reality-governed-auto-trigger-v1.0.js
      - src/reality-current-shift-auto-admission-handoff-v1.js
      - api/reality/governed-employee-shift-worker.js
      - supabase/migrations/20261113_current_shift_qualified_original_auto_admission_v1.sql
      - test/reality-frozen-regressions/reality-current-shift-auto-admission-v1.test.js
      - .github/workflows/reality-current-shift-auto-admission-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-shift-frozen-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen current shift auto-admission acceptance
        run: node --test test/reality-frozen-regressions/reality-current-shift-auto-admission-v1.test.js
      - name: No independent customer-job settlement or installation
        run: echo 'Passing acceptance is NOT a final job receipt or install approval'
