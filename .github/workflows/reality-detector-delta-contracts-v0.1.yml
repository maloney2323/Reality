name: Reality Evidence Axes and Delta Contracts v0.1
on:
  push:
    branches:
      - experiment/reality-detector-delta-contracts-20261024
    paths:
      - '.github/workflows/reality-detector-delta-contracts-v0.1.yml'
      - 'src/reality-cognition-evidence-contracts-v0.1.js'
      - 'test/reality-cognition-evidence-contracts-v0.1.test.js'
      - 'docs/reality-detector-delta-contracts-v0.1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-provider-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Parse candidate contracts
        run: |
          node --check src/reality-cognition-evidence-contracts-v0.1.js
          node --check test/reality-cognition-evidence-contracts-v0.1.test.js
      - name: Verify original Turn 16 and 21 evidence, and state delta fallback
        run: |
          node --test test/reality-cognition-evidence-contracts-v0.1.test.js \
            test/reality-alignment-invariant-contract-v0.1.test.js \
            test/reality-selective-cognitive-alignment-v0.2.test.js \
            test/reality-construction-25turn-dual-v1.test.js
      - name: State non-claims
        run: |
          echo 'NO paid model calls or independent blinded evaluation.'
          echo 'A candidate finding is not a verified model drift error.'
          echo 'No new production gate, no automation, no authorization changes.'
          echo 'No demonstrated caching or token-cost benefit.'
