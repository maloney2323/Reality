name: OpenAI Drift Hallucination 50 — ONE TIME RAW BASELINE
# ONE-TIME APPROVED PAID RUN. No workflow_dispatch or schedule. No reruns.
# Head commit message must be exact to proceed. New push of any other kind
# cannot restart this paid evaluation.
on:
  push:
    branches:
      - fix/governed-verification-and-context-boundary-20261021
    paths:
      - '.github/workflows/reality-dh50-openai-baseline-once.yml'
permissions:
  contents: read
concurrency:
  group: reality-dh50-openai-baseline-fresh-one-time-20261021
  cancel-in-progress: false
jobs:
  exact-fifty-new-openai-responses:
    if: github.event.head_commit.message == 'AUTHORIZE ONE-TIME OPENAI DH50 BASELINE 50'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DH50_EXACT_APPROVAL: YES_FIFTY_FRESH_OPENAI_CALLS
      DH50_MAX_PROVIDER_CALLS: '50'
      DH50_RESULT_PATH: artifacts/dh50/openai-raw-fresh-50-20261021.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove no prompts or scoring expectations were changed
        run: |
          echo 'd07b05de5821a02b973c52dcf7597c70b505c2c739859f1a4d3668ae01d5d61b  benchmarks/dh50/REALITY-DH50-SEQUENTIAL-V1-frozen-public-prompts.md' | sha256sum -c -
          node benchmarks/dh50/run-openai-raw-fifty-once.mjs --verify
      - name: Ensure API credential is configured
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'NO_OPENAI_API_KEY_IN_GITHUB_ACTIONS_SECRETS'
            exit 2
          fi
      - name: Exactly 50 paid GPT-6 Astra checkpoints in one continuous chat
        run: node benchmarks/dh50/run-openai-raw-fifty-once.mjs --run
      - name: Summary without accessing the sealed grading key
        if: always()
        run: |
          if test -f artifacts/dh50/openai-raw-fresh-50-20261021.json; then
            node --input-type=module -e "import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('artifacts/dh50/openai-raw-fresh-50-20261021.json'));console.log(JSON.stringify({run_id:r.run_id,records:r.records.length,provider_calls:r.provider_calls_attempted,responses:r.summary?.responses_received,unresolved:r.summary?.failed_or_unresolved,scoring_not_yet_performed:true,live_score:null}));"
          else
            echo 'NO_PROVIDER_REQUEST_OR_NO_ARCHIVE_CREATED'
          fi
      - name: Preserve raw evidence and continuity receipts even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-raw-dh50-fresh-50-20261021
          path: artifacts/dh50/openai-raw-fresh-50-20261021.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
