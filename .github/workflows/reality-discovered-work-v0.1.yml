name: Reality Discovered Work v0.1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  discovered-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/reality-discovered-work-v0.1.test.js
