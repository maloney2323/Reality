name: Reality Disposition Escalation Integrity
on:
  pull_request:
    paths:
      - 'src/reality-disposition-escalation-contract-v0.1.js'
      - 'src/reality-governed-disposition-generation-v0.1.js'
      - 'src/reality-typed-evidence-findings-v0.1*'
      - 'src/reality-source-scope-uncertainty-v0.1*'
      - 'src/reality-evidence-bound-decision-v0.1*'
      - 'src/reality-statement-integrity-v0.1*'
      - 'test/reality-disposition-escalation-contract.test.js'
      - 'test/reality-governed-disposition-generation.test.js'
      - '.github/workflows/reality-disposition-escalation-integrity.yml'
  workflow_dispatch:
jobs:
  disposition-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signed policy, model generation, and output-narrative integrity tests
        run: node --test src/reality-statement-integrity-v0.1.test.js test/reality-disposition-escalation-contract.test.js test/reality-governed-disposition-generation.test.js
      - name: Thirty-two source, uncertainty and typed decision security scenarios
        run: node --test src/reality-typed-evidence-findings-v0.1.test.js src/reality-source-scope-uncertainty-v0.1.test.js src/reality-evidence-bound-decision-v0.1.test.js
      - name: Check contract syntax
        run: |
          node --check src/reality-disposition-escalation-contract-v0.1.js
          node --check src/reality-governed-disposition-generation-v0.1.js
