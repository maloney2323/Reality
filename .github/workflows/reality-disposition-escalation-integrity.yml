name: Reality Disposition Escalation Integrity
on:
  pull_request:
    paths:
      - 'src/reality-disposition-escalation-contract-v0.1.js'
      - 'test/reality-disposition-escalation-contract.test.js'
      - '.github/workflows/reality-disposition-escalation-integrity.yml'
  workflow_dispatch:
jobs:
  disposition-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Twelve held-apart development scenarios and adversarial signer tests
        run: node --test test/reality-disposition-escalation-contract.test.js
      - name: Check contract syntax
        run: node --check src/reality-disposition-escalation-contract-v0.1.js
