name: Reality Durable Adversarial Workday — Safe Preflight
on:
  push:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax of adversarial real-provider durable benchmark
        run: |
          node --check scripts/run-reality-live-durable-adversarial-v1.mjs
          node --check src/reality-live-intelligence-orchestration-v0.1.js
          node --check src/reality-reliability-claim-extraction-v0.1.js
      - name: Test source arbitration, typed epistemic intake and Continuity locally
        run: |
          node --test test/reality-benchmark-run-scope-v0.1.test.js test/reality-benchmark-report-page-v0.1.test.js test/reality-cleaner-drift-handoff.test.js test/reality-active-path-audit-regression.test.js test/reality-adversarial-negative-external-action-regression.test.js \
            test/reality-source-review-adjudication-v0.1.test.js \
            test/reality-unified-semantic-review-v0.1.test.js \
            test/reality-signal-typed-epistemic-intake-v1.1.test.js \
            test/reality-continuity-runtime-v0.1.test.js \
            test/reality-repair-the-loop-v0.1.test.js \
            test/reality-live-intelligence-orchestration-v0.1.test.js
      - name: No paid calls in this workflow
        if: always()
        run: echo 'This GitHub workflow verifies code only; no OpenAI or Supabase credentials required.'

