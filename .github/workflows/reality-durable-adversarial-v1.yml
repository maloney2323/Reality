name: Reality Durable Adversarial Business Workday — Offline Safety Gate
on:
  push:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-cost-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse live runner and regression existing source, continuity, semantic review
        run: |
          node --check scripts/run-reality-live-durable-adversarial-v1.mjs
          node --check scripts/run-reality-12turn-authentic-continuity-v1.mjs
          node --check scripts/run-reality-provenance-live-replay-v0.1.mjs
          node --check scripts/run-reality-structured-provenance-recheck-v0.1.mjs
          node --check scripts/run-reality-canonical-live-smoke-v0.1.mjs
          node --check scripts/run-reality-cold-chain-independent-v0.1.mjs
          node --check scripts/run-reality-authentic-conversation-regression-v0.1.mjs
          node --check scripts/run-reality-live-conversation-regression-20261025.mjs
          node --check src/reality-live-intelligence-orchestration-v0.1.js
          node --check src/reality-source-review-adjudication-v0.1.js
          node --test test/reality-benchmark-run-scope-v0.1.test.js test/reality-authenticated-conversation-history-v0.1.test.js test/reality-live-history-api-v0.1.test.js test/reality-private-chat-preview-v0.1.test.js test/reality-cognition-continuity-handoff-v0.1.test.js test/reality-unified-epistemic-pipeline-v0.1.test.js test/reality-user-goal-trajectory-v0.1.test.js test/reality-conversation-provenance-handoff-v0.1.test.js test/reality-provenance-review-contract-v0.1.test.js test/reality-benchmark-report-page-v0.1.test.js test/reality-source-review-adjudication-v0.1.test.js \
            test/reality-unified-semantic-review-v0.1.test.js \
            test/reality-continuity-runtime-v0.1.test.js \
            test/reality-signal-typed-epistemic-intake-v1.1.test.js
      - name: Mandatory scope declaration
        if: always()
        run: |
          echo 'The CI contract does not invoke an LLM or the database.'
          echo 'The separate live test is only allowed in Vercel Preview using the existing secret.'
          echo 'The 16 adversarial conversational messages are synthetic; GitHub provider statuses are real.'
