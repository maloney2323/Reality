      - api/reality/personal-capabilities.js
      - reality-capability-workspace-v1.js
      - reality-capability-workspace-v1.css
      - reality-home-command-v1.js
      - supabase/migrations/20261117_standing_routine_discovery_delegation_v1.sql
      - supabase/migrations/20261117_standing_discovery_existing_worker_cron_v1.sql
      - api/reality/personal-employee-inquiry.js
      - supabase/migrations/20261117_dynamic_employee_temporal_inquiries_v1.sql
      - api/reality/governed-employee-shift-worker.js
      - api/reality/personal-time-horizon.js
      - src/reality-governed-shift-boundary-v1.js
      - api/reality/personal-employee-work-audit.js
      - api/reality/personal-employee-roster.js
      - reality-home-employee-brief-v1.js
      - reality-employee-work-audit-ui-v1.js
      - index.html
      - test/reality-employee-responsibility-audit-v1.test.js
      - test/reality-employee-time-inquiry-context-v1.test.js
      - test/reality-dynamic-employee-inquiry-worker-v1.test.js
      - test/reality-standing-capability-autonomy-v1.test.js
      - test/reality-capability-role-schedule-v1.test.js
      - test/reality-worker-self-recovery-v1.test.js
      - test/reality-past-present-future-time-map-v1.test.js
      - test/reality-home-live-employees-v1.test.js
      - src/reality-active-weekly-source-investigator-v1.js
      - api/reality/governed-employee-shift-worker.js
      - supabase/migrations/20261113_worker_active_weekly_investigations_v1.sql
      - test/reality-active-weekly-source-investigator-v1.test.js
      - .github/workflows/reality-employee-responsibility-audit-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-audit-without-business-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check the new owner audit boundary and Home buttons
        run: |
          node --check src/reality-employee-responsibility-audit-v1.js
          node --check src/reality-employee-time-inquiry-context-v1.js
          node --check src/reality-dynamic-employee-inquiry-worker-v1.js
          node --check src/reality-standing-employee-discovery-v1.js
          node --check src/reality-capability-role-schedule-worker-v1.js
          node --check api/reality/personal-capabilities.js
          node --check reality-capability-workspace-v1.js
          node --check api/reality/personal-employee-inquiry.js
          node --check api/reality/personal-time-horizon.js
          node --check api/reality/personal-employee-work-audit.js
          node --check reality-employee-work-audit-ui-v1.js
          node --check src/reality-active-weekly-source-investigator-v1.js
          node --check api/reality/governed-employee-shift-worker.js
          node --check api/reality/personal-employee-roster.js
          node --check reality-home-employee-brief-v1.js
      - name: Run the actual isolated employee-audit acceptance tests
        run: |
          node --test test/reality-employee-responsibility-audit-v1.test.js test/reality-home-live-employees-v1.test.js test/reality-active-weekly-source-investigator-v1.test.js test/reality-employee-time-inquiry-context-v1.test.js test/reality-past-present-future-time-map-v1.test.js test/reality-dynamic-employee-inquiry-worker-v1.test.js test/reality-standing-capability-autonomy-v1.test.js test/reality-capability-role-schedule-v1.test.js test/reality-worker-self-recovery-v1.test.js
      - name: No new shift, installation or production effect
        run: |
          echo 'Read-only responsibility audit proof; no secrets or provider mutations'
