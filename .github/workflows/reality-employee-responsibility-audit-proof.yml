name: Reality employee responsibility audit isolated proof
on:
  push:
    branches: [reality/native263-temporal-chat-proof-20261113, reality/chat-direct-work-handoff-20261115]
    paths:
      - src/reality-employee-responsibility-audit-v1.js
      - src/reality-employee-time-inquiry-context-v1.js
      - src/reality-dynamic-employee-inquiry-worker-v1.js
      - src/reality-standing-employee-discovery-v1.js
      - src/reality-capability-role-schedule-worker-v1.js
      - supabase/migrations/20261117_restore_signed_worker_cron_scope_v1.sql
      - supabase/migrations/20261117_owner_worker_self_observation_and_recovery_v1.sql
      - supabase/migrations/20261117_worker_failure_summary_reconciliation_v2.sql
      - supabase/migrations/20261117_owner_worker_cron_readback_access_v1.sql
      - supabase/migrations/20261117_owner_capability_employee_schedule_v1.sql
      - supabase/migrations/20261117_existing_worker_capability_schedule_wake_v1.sql
