name: Reality Epistemic Governance v1.0
on:
  push:
    branches: [main]
    paths:
      - 'src/reality-epistemic-friction-v1.0.js'
      - 'src/reality-constitutional-learning-v1.0.js'
      - 'test/reality-epistemic-friction-v1.0.test.js'
      - 'test/reality-constitutional-learning-v1.0.test.js'
jobs:
  epistemic-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/reality-epistemic-friction-v1.0.test.js
      - run: node test/reality-constitutional-learning-v1.0.test.js
