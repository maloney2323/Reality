name: Reality existing Actions worker credential compatibility (read only)
on:
  push:
    branches: [feature/reality-background-continuation-20261031]
    paths: ['.github/workflows/reality-existing-worker-credentials-v1.yml']
permissions:
  contents: read
jobs:
  verify-existing-worker-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report only whether an existing credential is available
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REALITY_UNIVERSE_PERSISTENCE_KEY: ${{ secrets.REALITY_UNIVERSE_PERSISTENCE_KEY }}
          REALITY_GITHUB_TOKEN: ${{ secrets.REALITY_GITHUB_TOKEN }}
          REALITY_BUILDER_DISPATCH_GITHUB_TOKEN: ${{ secrets.REALITY_BUILDER_DISPATCH_GITHUB_TOKEN }}
          REALITY_PERSONAL_CHAT_PUBLISHABLE_KEY: ${{ secrets.REALITY_PERSONAL_CHAT_PUBLISHABLE_KEY }}
          REALITY_CHAT_RECEIPT_HMAC_KEY: ${{ secrets.REALITY_CHAT_RECEIPT_HMAC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for k in SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN REALITY_UNIVERSE_PERSISTENCE_KEY REALITY_GITHUB_TOKEN REALITY_BUILDER_DISPATCH_GITHUB_TOKEN REALITY_PERSONAL_CHAT_PUBLISHABLE_KEY REALITY_CHAT_RECEIPT_HMAC_KEY GITHUB_TOKEN; do
            if [ -n "${!k:-}" ]; then
              echo "AVAILABLE $k"
            else
              echo "UNAVAILABLE $k"
            fi
          done
          echo 'Preflight only: no connection attempted, no owner grant or installation.'
