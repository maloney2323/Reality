name: Reality Final Loop Engine lifecycle acceptance
on:
  push:
    paths:
      - 'src/reality-shift-unified-execution-controller-v1.js'
      - 'test/reality-final-loop-engine-v1.test.js'
      - 'test/reality-unified-shift-execution-controller-v1.test.js'
      - '.github/workflows/reality-final-loop-engine-v1-ci.yml'
  pull_request:
    paths:
      - 'src/reality-shift-unified-execution-controller-v1.js'
      - 'test/reality-final-loop-engine-v1.test.js'
      - 'test/reality-unified-shift-execution-controller-v1.test.js'
      - '.github/workflows/reality-final-loop-engine-v1-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-loop-lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check complete controller and acceptance syntax
        run: |
          node --check src/reality-shift-unified-execution-controller-v1.js
          node --check test/reality-unified-shift-execution-controller-v1.test.js
          node --check test/reality-final-loop-engine-v1.test.js
      - name: Run existing controller and new Final Loop Engine invariants
        run: |
          node --test test/reality-unified-shift-execution-controller-v1.test.js
          node --test test/reality-final-loop-engine-v1.test.js
