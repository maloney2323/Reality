name: Reality Finale - Current Base Exact Model Candidate Retest
on:
  push:
    branches:
      - review/reality-finale-current-base-20261028
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-current-base-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 40716279333
          name: reality-finale-second-real-model-correction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: finale-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 40715822942
          name: reality-finale-real-red-gap
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: finale-evidence
      - name: Verify exact original independent model source and work identity
        run: |
          set -euo pipefail
          sha256sum src/reality-extensions/construction-estimate-approval-gate.mjs
          echo "c0f0fc86cd2ed11fe7e8c01484ebaf1b698143028c9c81ff323c6b7f8cd857ae  src/reality-extensions/construction-estimate-approval-gate.mjs" | sha256sum --check -
          cmp finale-candidate/candidate.mjs src/reality-extensions/construction-estimate-approval-gate.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const prev=JSON.parse(fs.readFileSync('finale-candidate/generation.json','utf8'));
          const red=JSON.parse(fs.readFileSync('finale-evidence/baseline.json','utf8'));
          assert.equal(red.original_work_id,'work:8f71513a2c1955569e84c0e9af0962ec');
          assert.equal(prev.original_work_id,red.original_work_id);
          assert.equal(prev.first_verified_failure,'FROZEN_INVALID_ESTIMATE_MUST_THROW_NOT_RETURN_OBJECT');
          assert.equal(prev.candidate_sha256,'c0f0fc86cd2ed11fe7e8c01484ebaf1b698143028c9c81ff323c6b7f8cd857ae');
          assert.equal(prev.owner_authorized_install,false);
          console.log('CURRENT_BASE_CANDIDATE_EXACT_MODEL_SOURCE_CONFIRMED');
          JS
      - name: Independently run frozen and 21 holdout tests without network or secrets
        run: |
          set -euo pipefail
          timeout 110s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -v "${{ github.workspace }}:/repo:ro" \
            -v "${{ github.workspace }}/finale-evidence:/evidence:ro" \
            -v "${{ github.workspace }}/finale-candidate:/work:ro" \
            -w /repo node:22-alpine \
            sh -c 'node --test test/reality-finale-estimate-approval-gate.test.mjs && node scripts/reality-finale-independent-holdout-v0.1.mjs' \
            > finale-current-base-verification.log
          cat finale-current-base-verification.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reality-finale-current-base-exact-candidate
          path: finale-current-base-verification.log
          retention-days: 14