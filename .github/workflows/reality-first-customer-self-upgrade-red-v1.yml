name: Reality — First Customer Self-Upgrade Gap (RED to GREEN)
on:
  push:
    branches:
      - proof/first-self-upgrade-red-contract-20261029
  pull_request:
    branches:
      - feature/preview-governed-build-end-to-end-entry-20261029
permissions:
  contents: read
jobs:
  frozen-customer-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Independently check the constitutional baseline
        run: node --test test/reality-governed-self-improvement-spine-v1.0.test.js
      - name: Frozen customer acceptance — expected RED until Reality installs the missing source
        run: node --test test/reality-frozen-regressions/first-reality-ci-evidence-gap.test.js
