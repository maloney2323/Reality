name: Reality — First Provider Gap to Model Handoff (no install)
on:
  push:
    branches:
      - feature/first-real-gap-to-generation-handoff-20261029
      - feature/first178-live-single-claim-execution-20261029
  pull_request:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
permissions:
  contents: read
  actions: read
jobs:
  trusted-gap-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify trusted provider handoff syntax
        run: node --check src/reality-first-gap-handoff-v0.1.js
      - name: Verify first real gap, integrity, and fail-closed owner scope
        run: node --test test/reality-first-gap-handoff-v0.1.test.js
      - name: Verify immutable test source is included in model task data
        run: |
          node --check src/reality-foundational-verified-regression-context-v1.0.js
          node --test test/reality-foundational-verified-regression-context-v1.0.test.js
      - name: Verify same-ledger constitutional checkpoint and resumption identity
        run: |
          node --check src/reality-first-178-constitutional-continuity-checkpoint-v0.1.js
          node --test test/reality-first-178-constitutional-continuity-checkpoint-v0.1.test.js
      - name: Verify exact owner job #178 admission and approval boundaries
        run: |
          node --check src/reality-personal-first-upgrade-178-v0.1.js
          node --check api/reality/personal-first-upgrade-178.js
          node --test test/reality-personal-first-upgrade-178-v0.1.test.js
      - name: Verify the actual pinned #178 failure from live GitHub Actions
        env:
          GH_PROVIDER_READ_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-first-178-real-provider-readback-v0.1.mjs
          node scripts/reality-first-178-real-provider-readback-v0.1.mjs
      - name: Verify public Github pinned source needs no credential
        run: |
          node --input-type=module -e '
          import {observeFirstGapFromGithub} from "./src/reality-first-gap-handoff-v0.1.js";
          const scope={owner_id:"CI_OWNER",goal_id:"CI_GOAL",original_work_id:"work:"+"f".repeat(32),
           original_issue_number:178,continuity_root_id:"CI_ROOT",worldline_id:"CI_WORLD",
           goal_transition_receipt_ref:"CI_RECEIPT",goal_evidence_ref:"CI_GOAL_SOURCE",
           environment:"ISOLATED_PREVIEW",user_confirmed:true,owner_session_verified:true,goal_current_verified:true};
          const r=await observeFirstGapFromGithub({scope,apiToken:null});
          if(r.status!=="INDEPENDENT_CI_MISSING_CAPABILITY_OBSERVED"||r.installation_authorized!==false)
            throw Error("PUBLIC_PINNED_EVIDENCE_UNVERIFIED");
          console.log("FIRST178_PUBLIC_GITHUB_SOURCE_READBACK_VERIFIED");
          '
      - name: Verify atomic single-use owner #178 constitutional execution handoff
        run: |
          node --check src/reality-first178-constitutional-executor-v0.1.js
          node --check api/reality/personal-first-upgrade-178-execute.js
          node --test test/reality-first178-constitutional-executor-v0.1.test.js
      - name: Preserve constitutional baseline
        run: node --test test/reality-governed-self-improvement-spine-v1.0.test.js
