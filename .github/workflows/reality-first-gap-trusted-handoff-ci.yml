name: Reality — First Provider Gap to Model Handoff (no install)
on:
  push:
    branches:
      - feature/first-real-gap-to-generation-handoff-20261029
      - feature/first178-live-single-claim-execution-20261029
  pull_request:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
permissions:
  contents: read
  actions: read
jobs:
  trusted-gap-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify trusted provider handoff syntax
        run: node --check src/reality-first-gap-handoff-v0.1.js
      - name: Verify first real gap, integrity, and fail-closed owner scope
        run: node --test test/reality-first-gap-handoff-v0.1.test.js
      - name: Reject malformed model candidates before constitutional admission
        run: |
          node --check src/reality-foundational-model-provider-v1.0.js
          node --test test/reality-foundational-model-strict-candidate-v1.0.test.js
      - name: Verify immutable test source is included in model task data
        run: |
          node --check src/reality-foundational-verified-regression-context-v1.0.js
          node --test test/reality-foundational-verified-regression-context-v1.0.test.js
      - name: Verify same-ledger constitutional checkpoint and resumption identity
        run: |
          node --check src/reality-first-178-constitutional-continuity-checkpoint-v0.1.js
          node --test test/reality-first-178-constitutional-continuity-checkpoint-v0.1.test.js
      - name: Verify Vercel Sandbox v3 real cmdId and independent provider receipts
        run: |
          node --check src/reality-foundational-vercel-sandbox-adapter-v1.0.js
          node --test test/reality-foundational-vercel-sandbox-adapter-v1.0.test.js
      - name: Verify exact owner job #178 admission and approval boundaries
        run: |
          node --check src/reality-personal-first-upgrade-178-v0.1.js
          node --check api/reality/personal-first-upgrade-178.js
          node --test test/reality-personal-first-upgrade-178-v0.1.test.js
      - name: Verify the actual pinned #178 failure from live GitHub Actions
        env:
          GH_PROVIDER_READ_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-first-178-real-provider-readback-v0.1.mjs
          node scripts/reality-first-178-real-provider-readback-v0.1.mjs
      - name: Verify one-click owner admission and exactly-once constitutional continuation
        run: |
          node --check src/reality-first178-single-action-v0.1.js
          node --check api/reality/personal-first-upgrade-178-run.js
          node --test test/reality-first178-single-action-v0.1.test.js
      - name: Prove one exact owner approval drives real provider install, original resumption and settlement
        run: |
          node --check src/reality-first178-approved-completion-v0.1.js
          node --test test/reality-first178-approved-completion-v0.1.test.js
      - name: Execute ORIGINAL frozen #178 acceptance against installed model-authored source
        run: |
          if [ -f src/reality-extensions/reality-ci-failure-evidence.mjs ]; then
            test -f test/reality-frozen-regressions/first-reality-ci-evidence-gap.test.js
            node --test test/reality-frozen-regressions/first-reality-ci-evidence-gap.test.js
          else
            echo "Original #178 uninstalled; frozen acceptance requires exact owner-authorized source."
          fi
      - name: Verify exact owner-approved isolated GitHub install and frozen CI readback
        run: |
          node --check src/reality-first178-isolated-github-install-v0.1.js
          node --test test/reality-first178-isolated-github-install-v0.1.test.js
      - name: Preserve constitutional baseline
        run: node --test test/reality-governed-self-improvement-spine-v1.0.test.js
