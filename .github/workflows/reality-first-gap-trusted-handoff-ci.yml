name: Reality — First Provider Gap to Model Handoff (no install)
on:
  push:
    branches:
      - feature/first-real-gap-to-generation-handoff-20261029
  pull_request:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
permissions:
  contents: read
jobs:
  trusted-gap-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify trusted provider handoff syntax
        run: node --check src/reality-first-gap-handoff-v0.1.js
      - name: Verify first real gap, integrity, and fail-closed owner scope
        run: node --test test/reality-first-gap-handoff-v0.1.test.js
      - name: Verify exact owner job #178 admission and approval boundaries
        run: |
          node --check src/reality-personal-first-upgrade-178-v0.1.js
          node --check api/reality/personal-first-upgrade-178.js
          node --test test/reality-personal-first-upgrade-178-v0.1.test.js
      - name: Preserve constitutional baseline
        run: node --test test/reality-governed-self-improvement-spine-v1.0.test.js
