name: Reality Foundation Continuity and Verified Retry v0.1
on:
  pull_request:
    paths:
      - "src/reality-authenticated-chat-continuity-v0.1.js"
      - "src/reality-original-work-retry-v0.1.js"
      - "src/reality-verified-layer-handoff-v0.1.js"
      - "src/reality-model-gateway-v0.1.js"
      - "test/reality-signal-source-to-model-v0.1.test.js"
      - "src/reality-live-intelligence-orchestration-v0.1.js"
      - "src/reality-cognitive-runtime-v1.0.js"
      - "src/reality-cognition-context-selection-v0.1.js"
      - "src/reality-live-epistemic-diagnostics-v0.1.js"
      - "test/reality-live-epistemic-diagnostics-v0.1.test.js"
      - "src/reality-native-universe-v1.0.js"
      - "test/reality-cognition-context-selection-v0.1.test.js"
      - "src/reality-native-universe-persistence-v1.0.js"
      - "src/reality-universe-source-inventory-v0.1.js"
      - "test/reality-universe-source-inventory-v0.1.test.js"
      - "src/reality-continuity-recovery-outbox-v0.1.js"
      - "test/reality-continuity-recovery-outbox-v0.1.test.js"
      - "src/reality-trusted-observation-admission-v0.1.js"
      - "test/reality-trusted-observation-admission-v0.1.test.js"
      - "src/reality-autonomous-closure-orchestrator-v0.1.js"
      - "src/reality-continuous-continuity-v1.0.js"
      - "api/chat.js"
      - "api/reality/intelligence.js"
      - "test/reality-authenticated-chat-continuity-v0.1.test.js"
      - "test/reality-original-work-retry-v0.1.test.js"
      - ".github/workflows/reality-foundation-continuity-and-retry-v0.1.yml"
      - "test/reality-verified-layer-handoff-v0.1.test.js"
      - "test/reality-six-layer-integration-v0.1.test.js"
      - "test/reality-persistence-integrity-v0.1.test.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify authenticated continuity and end-to-end original work retry (mock provider only)
        run: node --test test/reality-authenticated-chat-continuity-v0.1.test.js test/reality-original-work-retry-v0.1.test.js test/reality-verified-layer-handoff-v0.1.test.js test/reality-governed-fragmented-signal-cleaner-v0.1.test.js test/reality-trusted-observation-admission-v0.1.test.js test/reality-continuous-continuity-v1.0.test.js test/reality-continuity-recovery-outbox-v0.1.test.js
      - name: Check complete supplied view and bounded cognitive recall
        run: node --test test/reality-cognition-context-selection-v0.1.test.js
      - name: Verify passive native discrepancies reach ordinary cognition
        run: node --test test/reality-live-epistemic-diagnostics-v0.1.test.js
      - name: Check legacy + canonical Universe identities without rewriting history
        run: node --test test/reality-universe-source-inventory-v0.1.test.js
      - name: Verify lossless source text reaches intelligence despite cleaner transformations
        run: node --test test/reality-signal-source-to-model-v0.1.test.js
      - name: Prove immutable concurrent writes and readback receipts
        run: node --test test/reality-persistence-integrity-v0.1.test.js
      - name: Enforce six-layer end-to-end contracts and negative controls
        run: node --test test/reality-six-layer-integration-v0.1.test.js
      - name: Preserve pre-existing capability gap runtime contract
        run: node --test test/capability-gap-runtime-v1.test.js

      - name: Keep live orchestration state machine and existing semantics working
        run: node --test test/reality-live-intelligence-orchestration-v0.1.test.js
