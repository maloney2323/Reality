name: Reality — Foundational Generation and Isolated Sandbox
on:
  push:
    branches:
      - reality/architecture/foundational-generation-sandbox-v1-20261029
    paths:
      - 'src/reality-foundational-build-loop-v1.0.js'
      - 'src/reality-foundational-model-provider-v1.0.js'
      - 'src/reality-foundational-sandbox-adapter-v1.0.js'
      - 'src/reality-foundational-constitutional-adapters-v1.0.js'
      - 'src/reality-governed-self-improvement-driver-v1.0.js'
      - 'test/reality-foundational-constitutional-adapters-v1.0.test.js'
      - 'test/reality-foundational-build-loop-v1.0.test.js'
      - 'docs/reality-foundational-generation-sandbox-v1.md'
      - '.github/workflows/reality-foundational-generation-sandbox-v1.yml'
  pull_request:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
permissions:
  contents: read
jobs:
  verify-generation-sandbox-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Source syntax and adversarial generation/sandbox contract
        run: |
          set -euo pipefail
          node --check src/reality-foundational-build-loop-v1.0.js
          node --check src/reality-foundational-model-provider-v1.0.js
          node --check src/reality-foundational-sandbox-adapter-v1.0.js
          node --check src/reality-foundational-constitutional-adapters-v1.0.js
          node --test test/reality-foundational-build-loop-v1.0.test.js
          node --test test/reality-foundational-constitutional-adapters-v1.0.test.js
      - name: Existing constitutional spine and authenticated chat discovery
        run: |
          set -euo pipefail
          node --test test/reality-governed-self-improvement-spine-v1.0.test.js
          node --test test/reality-personal-governed-self-improvement-v0.1.test.js
          node --test test/reality-personal-unfinished-work-v0.1.test.js
