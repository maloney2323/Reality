name: Reality Full Closed Loop Live OpenAI 25 Turn Proof
on:
  push:
    branches:
      - feature/closed-loop-real-llm-universe-v1-20261023
    paths:
      - .github/workflows/reality-full-closed-loop-live-25-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  closed-loop-real-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REALITY_LOOP_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JS source and runner syntax
        run: |
          node --check src/reality-universe-closed-loop-v1.0.js
          node --check scripts/run-reality-25-live-closed-loop-v1.mjs
      - name: Core source-grounded uncertainty admission, bounded repair and continuity checks
        run: |
          node --test \
            test/reality-universe-closed-loop-v1.0.test.js \
            test/reality-universe-correction-verifier-v1.0.test.js \
            test/reality-universe-ignorance-manifest-v1.0.test.js \
            test/reality-universe-ignorance-durable-reconciliation-v1.0.test.js \
            test/reality-universe-persistence-contract-v1.0.test.js \
            test/reality-typed-claim-evidence-v1.0.test.js \
            test/reality-intelligence-spine-v1.0.test.js
      - name: 25 fresh real Mini baseline turns and a closed-loop Reality correction run
        run: node scripts/run-reality-25-live-closed-loop-v1.mjs
      - name: Upload source-preserved evidence and mobile visual benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-real-openai-25turn-full-closed-loop
          path: |
            benchmark-results/reality-25-live-closed-loop.json
            benchmark-results/reality-25-live-closed-loop.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Boundary claim
        run: |
          echo 'No customer persistence, authorized business execution, or independently complete semantic audit.'
          echo 'Malformed LLM claim extraction is treated as unknown evidence and tested for safe recovery.'
          echo 'No synthetic model errors in the scored live run.'
