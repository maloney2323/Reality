name: Reality capability gap category intake — owner evidence
on:
  push:
    branches:
      - feature/reality-evidence-bound-capability-category-intake-20261103
  pull_request:
    branches:
      - feature/reality-general-capability-engine-20261101
permissions:
  contents: read
jobs:
  gap-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate no new authority or synthetic verified gap
        run: |
          node --check api/reality/personal-gap-intake.js
          node --test test/reality-evidence-bound-gap-category-intake-v1.test.js
          node --test test/reality-simple-customer-home-v1.test.js
          node --test test/reality-market-research-restoration-v1.test.js
          node --test test/reality-upgrade-discovery-category-v0.1.test.js
          node --test test/reality-autonomous-prehome-assessments-v1.test.js
          node --test test/reality-home-owner-authorizations-v1.test.js
          node --test test/reality-market-handoff-chat-v1.test.js
