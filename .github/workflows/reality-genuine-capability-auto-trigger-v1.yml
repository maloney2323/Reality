      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Independently verify the original live GitHub provider run and specific successful jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const repo='maloney2323/Reality', runId=41390537103;
          const get=async(path)=>{
            const r=await fetch('https://api.github.com/repos/'+repo+path,{
              headers:{authorization:'Bearer '+process.env.GH_TOKEN,
                accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'}});
            assert.equal(r.status,200,'Provider readback required: '+path);
            return r.json();
          };
          const run=await get('/actions/runs/'+runId);
          const jobs=await get('/actions/runs/'+runId+'/jobs?per_page=100');
          const artifacts=await get('/actions/runs/'+runId+'/artifacts?per_page=100');
          assert.equal(run.id,runId);
          assert.equal(run.status,'completed');
          assert.equal(run.conclusion,'failure'); // Never alter provider's actual conclusion.
          assert.equal(run.head_repository.full_name,repo);
          assert.equal(jobs.jobs.filter(j=>j.name==='resume_original_job'&&j.conclusion==='success').length,1);
          assert.equal(jobs.jobs.filter(j=>j.name==='record_independent_original_settlement'&&j.conclusion==='success').length,1);
          assert.ok(jobs.jobs.some(j=>j.conclusion==='failure'));
          assert.ok(artifacts.artifacts.some(a=>
            a.name==='reality-original-final-settlement-'+runId&&
            !a.expired&&/^sha256:[a-f0-9]{64}$/.test(a.digest||'')));
          console.log('REALITY_201_LIVE_PROVIDER_HOLDOUT',JSON.stringify({
            run_id:runId,conclusion:run.conclusion,
            resume_job:'success',independent_settlement_job:'success',
            unrelated_failure_present:true,
            verified_artifact_present:true,
            production_change_claimed:false}));
          NODE
      - name: Independently test proposed corrected source in secret-free offline sandbox
        shell: bash
        run: |
          set -euo pipefail
          test ! -f src/reality-extensions/reality-continuity-settlement-reconciler.mjs
          mkdir -p src/reality-extensions test/reality-extensions
          cp evidence/reality-201-corrected-candidate/reality-continuity-settlement-reconciler.mjs src/reality-extensions/reality-continuity-settlement-reconciler.mjs
          cp evidence/reality-201-corrected-candidate/reality-continuity-settlement-reconciler.test.js test/reality-extensions/reality-continuity-settlement-reconciler.test.js
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 512m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "${PWD}:/work:ro" -w /work node:22 \
            node --test --test-reporter=tap \
              test/reality-frozen-regressions/reality-continuity-settlement-reconciler-v1.test.js \
              test/reality-extensions/reality-continuity-settlement-reconciler.test.js \
              test/reality-201-provider-backed-relationship-holdout-v1.test.js | tee /tmp/reality-201-corrected-holdout.tap

      - name: Publish immutable corrected holdout evidence receipt without installation
        if: success()
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const tap=fs.readFileSync('/tmp/reality-201-corrected-holdout.tap','utf8');
          const count=(key)=>Number([...tap.matchAll(new RegExp('^# '+key+' (\\d+)$','gm'))].at(-1)?.[1]||0);
          assert.equal(count('tests'),19);
          assert.equal(count('pass'),19);
          assert.equal(count('fail'),0);
          const sha=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const candidate='evidence/reality-201-corrected-candidate/reality-continuity-settlement-reconciler.mjs';
          const frozen='test/reality-frozen-regressions/reality-continuity-settlement-reconciler-v1.test.js';
          const receipt={
            schema:'reality-201-independent-corrected-holdout-v1',
            original_repair_work_id:'work:d90acd41ed1b1116ee74086846d61d42',
            unchanged_frozen_sha256:sha(frozen),
            corrected_source_sha256:sha(candidate),
            corrected_source_path:candidate,
            real_provider_run_id:41390537103,
            independent_live_provider_jobs_verified:true,
            original_frozen_and_candidate_holdout_tests:19,
            passed:19,failed:0,
            source:'GITHUB_SIGNED_WORKFLOW_PROVIDER_READBACK_AND_NETWORK_DISABLED_DOCKER',
            github_run_id:process.env.GITHUB_RUN_ID,
            github_source_sha:process.env.GITHUB_SHA,
            corrected_candidate_qualified_in_database:false,
            installation_authorized:false,
            universe_settlement_recorded:false,
            production_changed:false
          };
          fs.mkdirSync('artifact/out',{recursive:true});
          fs.writeFileSync('artifact/out/reality-201-corrected-holdout.json',JSON.stringify(receipt,null,2)+'\\n');
          console.log('REALITY_201_CORRECTED_HOLDOUT_PROOF',JSON.stringify(receipt));
          NODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reality-201-independent-corrected-holdout-${{ github.run_id }}
          path: artifact/out/reality-201-corrected-holdout.json
          if-no-files-found: error
          retention-days: 30

  requalify_201_model_candidate:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[requalify-201]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Retrieve earlier genuine model response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh run download 41728570367 --repo maloney2323/Reality --name reality-uninstalled-model-proposal-41728570367 --dir previous
          test -s previous/genuine-capability-model-proposal.json
      - name: Reality proposes fresh corrected source without installation
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_REPAIR_MODEL: ${{ vars.REALITY_REPAIR_MODEL || 'gpt-5.6' }}
        run: node scripts/reality-201-model-requalify-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-201-model-correction-${{ github.run_id }}
          path: artifact/genuine-capability-model-proposal.json
          if-no-files-found: error
          retention-days: 14

  verify_201_new_model_candidate:
    needs: requalify_201_model_candidate
    if: needs.requalify_201_model_candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: reality-201-model-correction-${{ github.run_id }}
          path: candidate
      - name: Verify frozen contract in isolated Docker
        run: node scripts/reality-genuine-sandbox-verify-v1.mjs
      - name: Hold out historical provider evidence in isolated Docker
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 --memory 512m --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,size=16m -v "${PWD}:/work:ro" -w /work node:22 node --test test/reality-201-provider-backed-relationship-holdout-v1.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: reality-201-new-model-verification-${{ github.run_id }}
          path: artifact/genuine-capability-sandbox-verification.json
          if-no-files-found: error
          retention-days: 14

  durably_requalify_201_candidate:
    needs: verify_201_new_model_candidate
    if: needs.verify_201_new_model_candidate.result == 'success'
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: reality-201-model-correction-${{ github.run_id }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: reality-201-new-model-verification-${{ github.run_id }}
          path: proof
      - name: Verify signed provider results and atomically supersede previous qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reality-201-record-model-requalification-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-201-durable-qualified-for-owner-review-${{ github.run_id }}
          path: artifact/out/reality-201-durable-requalification.json
          if-no-files-found: error
          retention-days: 30
