name: Reality governed automatic capability discovery — original frozen failures
on:
  push:
    branches: [feature/reality-general-capability-engine-20261101]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  detect-real-frozen-capability-deficits:
    outputs:
      build_ready: ${{ steps.eligibility.outputs.build_ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Assert detector never grants owner or installation authority
        run: |
          node --check src/reality-genuine-auto-detect-v1.js
          node --check scripts/reality-genuine-auto-trigger-v1.mjs
          node --test test/reality-genuine-auto-trigger-v1.test.js
      - name: Discover actual missing capabilities from frozen customer acceptance tests
        run: node scripts/reality-genuine-auto-trigger-v1.mjs
      - name: Persist source-hashed discovery observations for independent owner-gap admission
        uses: actions/upload-artifact@v4
        with:
          name: reality-auto-capability-discovery-${{ github.run_id }}
          path: artifact/genuine-capability-auto-trigger.json
          if-no-files-found: error
          retention-days: 14
      - name: Signed automatic owner-evidence admission into the existing durable queue
        if: github.event_name == 'push'
        run: node scripts/reality-genuine-auto-admit-v1.mjs
      - name: Wake frozen-test worker for the admitted original job
        if: github.event_name == 'push'
        run: node scripts/reality-genuine-frozen-worker-claim-v1.mjs
      - name: Reconcile signed original frozen failure in isolated Docker
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-frozen-reconcile-v1.mjs
          node scripts/reality-genuine-frozen-reconcile-v1.mjs
      - name: Save original-job queue receipt for Reality capability engine
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: reality-capability-queue-${{ github.run_id }}
          path: artifact/genuine-capability-admitted-queue.json
          if-no-files-found: error
          retention-days: 7
      - name: Only request OpenAI if a real original job still needs a capability
        id: eligibility
        if: github.event_name == 'push'
        run: |
          node -e "const fs=require('node:fs');const q=JSON.parse(fs.readFileSync('artifact/genuine-capability-admitted-queue.json'));const ready=[...(q.queued||[]),...(q.previously_claimed||[])].some(x=>['PENDING_FROZEN_REPRODUCTION','LEASED_FOR_INDEPENDENT_REPRODUCTION','FROZEN_REPRODUCED_AWAITING_CANDIDATE'].includes(x.queue_phase));fs.appendFileSync(process.env.GITHUB_OUTPUT,'build_ready='+ready+'\\n');"
      - name: Show exact authorization boundary
        if: github.event_name == 'push'
        run: |
          echo 'Queue admission verifies signed GitHub identity, original customer goal, provider failure and frozen source.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No model output authorizes installation. Owner approval is a separate action.' >> "$GITHUB_STEP_SUMMARY"
      - name: Do not silently convert an observation into an authorized queue claim
        run: |
          echo 'A failing frozen test is an unverified discovery candidate, not owner-approved work.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing Reality Continuity, independent provider, owner-goal and atomic queue gates remain mandatory.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No install, model-generated capability or original job settlement claimed.' >> "$GITHUB_STEP_SUMMARY"

  generate_missing_capability:
    needs: detect-real-frozen-capability-deficits
    if: ${{ github.event_name == 'push' && needs['detect-real-frozen-capability-deficits'].outputs.build_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: reality-capability-queue-${{ github.run_id }}
          path: artifact
      - name: Reality proposes the original missing capability using OpenAI
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_REPAIR_MODEL: ${{ vars.REALITY_REPAIR_MODEL || 'gpt-5.6' }}
        run: |
          node --check scripts/reality-genuine-openai-propose-v1.mjs
          node scripts/reality-genuine-openai-propose-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-uninstalled-model-proposal-${{ github.run_id }}
          path: artifact/genuine-capability-model-proposal.json
          if-no-files-found: error
          retention-days: 7

  verify_missing_capability:
    needs: generate_missing_capability
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: reality-uninstalled-model-proposal-${{ github.run_id }}
          path: candidate
      - name: Independently run original frozen acceptance and candidate tests
        run: |
          node --check scripts/reality-genuine-sandbox-verify-v1.mjs
          node scripts/reality-genuine-sandbox-verify-v1.mjs
      - name: Preserve independent verifier evidence, whether passed or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-independent-candidate-proof-${{ github.run_id }}
          path: artifact/genuine-capability-sandbox-verification.json
          if-no-files-found: warn
          retention-days: 7

  correct_failed_capability:
    needs: verify_missing_capability
    if: ${{ always() && needs.verify_missing_capability.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: reality-uninstalled-model-proposal-${{ github.run_id }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: reality-independent-candidate-proof-${{ github.run_id }}
          path: failed
      - name: Reality uses independently failed tests to correct its capability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_REPAIR_MODEL: ${{ vars.REALITY_REPAIR_MODEL || 'gpt-5.6' }}
        run: |
          node --check scripts/reality-genuine-openai-correct-v1.mjs
          node scripts/reality-genuine-openai-correct-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-corrected-candidate-${{ github.run_id }}
          path: artifact/genuine-capability-model-proposal.json
          if-no-files-found: error
          retention-days: 7

  verify_corrected_capability:
    needs: correct_failed_capability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: reality-corrected-candidate-${{ github.run_id }}
          path: candidate
      - name: Independently verify OpenAI's corrected capability
        run: |
          node --check scripts/reality-genuine-sandbox-verify-v1.mjs
          node scripts/reality-genuine-sandbox-verify-v1.mjs
      - name: Preserve corrected independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-corrected-independent-proof-${{ github.run_id }}
          path: artifact/genuine-capability-sandbox-verification.json
          if-no-files-found: warn
          retention-days: 7

  qualify_verified_capability:
    needs: verify_missing_capability
    if: needs.verify_missing_capability.result == 'success'
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: reality-capability-queue-${{ github.run_id }}
          path: admission
      - uses: actions/download-artifact@v4
        with:
          name: reality-uninstalled-model-proposal-${{ github.run_id }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: reality-independent-candidate-proof-${{ github.run_id }}
          path: proof
      - name: Reality records signed owner-reviewable capability after independent GREEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-qualify-v1.mjs
          node scripts/reality-genuine-qualify-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-owner-review-receipt-${{ github.run_id }}
          path: artifact/genuine-capability-owner-review.json
          if-no-files-found: error
          retention-days: 7

  activate_owner_approved_preview:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      installed: ${{ steps.isolated_install.outputs.installed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Only after exact owner approval install on new isolated branch
        id: isolated_install
        env:
          REALITY_INSTALL_JOB_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-install-approved-preview-v1.mjs
          node scripts/reality-genuine-install-approved-preview-v1.mjs
      - name: Retain owner-approved installed-source proof
        if: steps.isolated_install.outputs.installed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reality-owner-approved-isolated-install-${{ github.run_id }}
          path: artifact/reality-owner-approved-preview-install.json
          if-no-files-found: error
          retention-days: 14

  monitor_owner_approved_preview:
    needs: activate_owner_approved_preview
    if: ${{ needs.activate_owner_approved_preview.outputs.installed == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: reality-owner-approved-isolated-install-${{ github.run_id }}
          path: artifact/install
      - name: Independently reobserve installed bytes and monitor five sandbox activations
        env:
          REALITY_INSTALL_READ_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-monitor-installed-preview-v1.mjs
          node scripts/reality-genuine-monitor-installed-preview-v1.mjs
      - name: Preserve independent activation and quarantine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-approved-preview-activation-proof-${{ github.run_id }}
          path: artifact/out/reality-independent-installed-preview-activation.json
          if-no-files-found: warn
          retention-days: 14

  record_owner_approved_activation:
    needs: monitor_owner_approved_preview
    if: ${{ needs.monitor_owner_approved_preview.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: reality-owner-approved-isolated-install-${{ github.run_id }}
          path: artifact/install
      - uses: actions/download-artifact@v4
        with:
          name: reality-approved-preview-activation-proof-${{ github.run_id }}
          path: artifact/monitor
      - name: Independently reconcile preview activation and monitor into original Continuity
        env:
          REALITY_INSTALL_READ_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-record-activation-v1.mjs
          node scripts/reality-genuine-record-activation-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-durable-owner-activation-${{ github.run_id }}
          path: artifact/out/reality-durable-preview-activation.json
          if-no-files-found: error
          retention-days: 14

  recover_consumed_preview_install:
    if: github.event_name == 'push'
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      recovered: ${{ steps.complete.outputs.recovered }}
      installer_run_id: ${{ steps.scope.outputs.installer_run_id }}
      installer_source_sha: ${{ steps.scope.outputs.installer_source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Resolve already-consumed owner approval without a new installation
        id: scope
        env:
          REALITY_INSTALL_READ_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-recovery-prepare-v1.mjs
          node scripts/reality-genuine-recovery-prepare-v1.mjs
      - name: Retrieve immutable artifact from original successful installation
        if: steps.scope.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_RUN: ${{ steps.scope.outputs.installer_run_id }}
        run: |
          mkdir -p artifact/install
          gh run download "$INSTALL_RUN" --repo maloney2323/Reality --name "reality-owner-approved-isolated-install-$INSTALL_RUN" --dir artifact/install
      - name: Independently monitor installed original capability without reinstallation
        if: steps.scope.outputs.recover == 'true'
        env:
          REALITY_INSTALL_READ_TOKEN: ${{ github.token }}
          REALITY_RECOVERY_SOURCE_SHA: ${{ steps.scope.outputs.installer_source_sha }}
          REALITY_RECOVERY_INSTALL_RUN_ID: ${{ steps.scope.outputs.installer_run_id }}
        run: |
          node --check scripts/reality-genuine-monitor-installed-preview-v1.mjs
          node scripts/reality-genuine-monitor-installed-preview-v1.mjs
      - name: Preserve new independent recovery monitor receipt
        if: steps.scope.outputs.recover == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-recovery-activation-${{ github.run_id }}
          path: artifact/out/reality-independent-installed-preview-activation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Confirm monitoring has independently completed
        id: complete
        if: steps.scope.outputs.recover == 'true'
        run: echo "recovered=true" >> "$GITHUB_OUTPUT"

  record_consumed_preview_recovery:
    needs: recover_consumed_preview_install
    if: needs.recover_consumed_preview_install.outputs.recovered == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Re-read original exact approved install evidence
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_RUN: ${{ needs.recover_consumed_preview_install.outputs.installer_run_id }}
        run: |
          mkdir -p artifact/install
          gh run download "$INSTALL_RUN" --repo maloney2323/Reality --name "reality-owner-approved-isolated-install-$INSTALL_RUN" --dir artifact/install
      - uses: actions/download-artifact@v4
        with:
          name: reality-recovery-activation-${{ github.run_id }}
          path: artifact/monitor
      - name: Reconcile two independently verified runs into existing original job
        env:
          REALITY_INSTALL_READ_TOKEN: ${{ github.token }}
          REALITY_RECOVERY_MODE: 'true'
          REALITY_RECOVERY_INSTALL_RUN_ID: ${{ needs.recover_consumed_preview_install.outputs.installer_run_id }}
          REALITY_RECOVERY_SOURCE_SHA: ${{ needs.recover_consumed_preview_install.outputs.installer_source_sha }}
        run: |
          node --check scripts/reality-genuine-record-activation-v1.mjs
          node scripts/reality-genuine-record-activation-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-durable-recovered-activation-${{ github.run_id }}
          path: artifact/out/reality-durable-preview-activation.json
          if-no-files-found: error
          retention-days: 14

  resume_original_job:
    needs: [record_owner_approved_activation]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.record_owner_approved_activation.result == 'success' || needs.record_owner_approved_activation.result == 'skipped') }}
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      performed: ${{ steps.resume.outputs.performed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute original frozen acceptance against installed source
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-original-resume-v1.mjs
          node scripts/reality-genuine-original-resume-v1.mjs
      - name: Preserve original provider work proof
        if: steps.resume.outputs.performed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reality-original-resumption-${{ github.run_id }}
          path: artifact/out/reality-original-resumption.json
          if-no-files-found: error
          retention-days: 14

  record_independent_original_settlement:
    needs: resume_original_job
    if: ${{ needs.resume_original_job.result == 'success' && needs.resume_original_job.outputs.performed == 'true' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: reality-original-resumption-${{ github.run_id }}
          path: artifact/resume
      - name: Independently verify original provider outcome and write final settlement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-genuine-original-settle-v1.mjs
          node scripts/reality-genuine-original-settle-v1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reality-original-final-settlement-${{ github.run_id }}
          path: artifact/out/reality-original-final-settlement.json
          if-no-files-found: error
          retention-days: 14

  independently_measure_production_readiness:
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read signed independent readiness evidence and enforce no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-independent-production-readiness-v1.mjs
          node scripts/reality-independent-production-readiness-v1.mjs
      - name: Retain immutable readiness report, including missing evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-independent-production-readiness-${{ github.run_id }}
          path: artifact/out/reality-production-readiness.json
          if-no-files-found: error
          retention-days: 30

  independently_attest_owner_repair_issues:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Independently verify issue and frozen provider source, then store signed witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check scripts/reality-signed-owner-issue-witness-v1.mjs
          node scripts/reality-signed-owner-issue-witness-v1.mjs
      - name: Preserve signed provider evidence without granting owner authority
        uses: actions/upload-artifact@v4
        with:
          name: reality-signed-owner-issue-witnesses-${{ github.run_id }}
          path: artifact/out/reality-owner-issue-witnesses.json
          if-no-files-found: error
          retention-days: 14
