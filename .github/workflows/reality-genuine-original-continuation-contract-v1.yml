name: Reality genuine original continuation contract
on:
  push:
    branches: [feature/reality-general-capability-engine-20261101]
    paths:
      - 'src/reality-genuine-original-continuation-v1.mjs'
      - 'test/reality-genuine-original-continuation-v1.test.js'
      - '.github/workflows/reality-genuine-original-continuation-contract-v1.yml'
permissions:
  contents: read
jobs:
  check_governed_continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Never confuse acceptance rules with live provider settlement
        run: |
          node --check src/reality-genuine-original-continuation-v1.mjs
          node --test test/reality-genuine-original-continuation-v1.test.js
