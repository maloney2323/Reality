name: Reality genuine capability — signed worker verification
on:
  push:
    branches: [feature/reality-genuine-capability-worker-20261101]
    paths:
      - 'scripts/reality-genuine-capability-worker-v1.mjs'
      - 'test/reality-genuine-capability-worker-v1.test.js'
      - 'supabase/functions/reality-genuine-capability-wake/index.ts'
      - 'supabase/migrations/20261101_genuine_capability_wake_readback_v1.sql'
      - '.github/workflows/reality-genuine-worker-contract-v1.yml'
permissions:
  contents: read
jobs:
  security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Prove no owner approval, source install or claim
        run: |
          node --check scripts/reality-genuine-capability-worker-v1.mjs
          node --test test/reality-genuine-capability-worker-v1.test.js
