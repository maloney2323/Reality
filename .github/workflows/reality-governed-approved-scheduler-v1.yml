# Minimal default-branch scheduler: no app code, source installation, or DB
# credentials. Supabase independently verifies our signed GitHub Actions OIDC.
# ONLY an existing signed-owner approval can be dispatched to the isolated job.
name: Reality — Governed auto-wake of previously approved work
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Reality — Original #178 approved background worker lineage contract"]
    types: [completed]
    branches: [feature/reality-background-continuation-20261031]
  push:
    branches: [main]
    paths:
      - '.github/workflows/reality-governed-approved-scheduler-v1.yml'
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: reality-governed-approved-wake-main
  cancel-in-progress: false
jobs:
  wake-only-previously-approved-original-work:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'feature/reality-background-continuation-20261031' &&
       github.event.workflow_run.head_repository.full_name == 'maloney2323/Reality' &&
       github.event.workflow_run.path == '.github/workflows/reality-approved-background-lineage-contract-v1.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll exact signed owner approval and wake isolated worker if authorized
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const project='hvkfreoagbrphwghjajw';
          const repo='maloney2323/Reality';
          const worker='reality-approved-repair-background-v1.yml';
          const workerBranch='feature/reality-background-continuation-20261031';
          const installBranches=new Set([
            'feature/reality-closed-loop-worker-20261031',
            'feature/reality-home-repair-chat-20261031',
          ]);
          // No historic work ID or artifact can be a scheduler authority.
          assert.ok(['push','schedule','workflow_dispatch','workflow_run']
            .includes(process.env.GITHUB_EVENT_NAME),
            'only signed, allowlisted wake event may ask Supabase for an existing approval');
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_REF,'refs/heads/main');
          assert.ok(/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA||''));
          assert.ok(process.env.ACTIONS_ID_TOKEN_REQUEST_URL&&
            process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,
            'signed GitHub OIDC identity must be available');
          const issuer=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          issuer.searchParams.set('audience','reality-governed-approved-scheduler-v1');
          const proof=await fetch(issuer,{method:'GET',cache:'no-store',redirect:'error',
            headers:{authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          assert.equal(proof.status,200,'GitHub signed identity mint must succeed');
          const token=(await proof.json())?.value;
          assert.ok(typeof token==='string'&&token.length>300);
          const response=await fetch(
            'https://'+project+'.supabase.co/functions/v1/reality-governed-approved-scheduler',
            {method:'POST',cache:'no-store',redirect:'error',
             headers:{authorization:'Bearer '+token,'content-type':'application/json'},
             body:JSON.stringify({action:'poll'})});
          const result=await response.json().catch(()=>null);
          assert.equal(response.status,200,'Exact signed scheduler identity and provider readback required');
          assert.equal(result?.ok,true);
          assert.equal(result.github_oidc_verified,true);
          assert.equal(result.isolated_supabase_readback_verified,true);
          assert.equal(result.service_credential_returned,false);
          assert.equal(result.owner_approval_used,false);
          assert.equal(result.installation_performed,false);
          assert.equal(result.production_changed,false);
          assert.equal(result.repository_commit,process.env.GITHUB_SHA);
          assert.ok(Array.isArray(result.pending_approvals)&&
            result.pending_approvals.length<=5);
          if(result.pending_approvals.length===0){
            assert.equal(result.status,'NO_APPROVED_WORK');
            console.log('REALITY_GOVERNED_AUTO_WAKE',JSON.stringify({
             status:'NO_APPROVED_WORK',customer_button_required:false,
             install_performed:false,production_changed:false}));
            process.exit(0);
          }
          assert.equal(result.status,'PREVIOUSLY_OWNER_APPROVED_WORK_OBSERVED');
          const seen=new Set();
          for(const item of result.pending_approvals){
           assert.deepEqual(Object.keys(item).sort(),
            ['candidate_hash','install_branch','issue_number','original_work_id','reservation_id']);
           assert.match(item.reservation_id,/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i);
           assert.match(item.original_work_id,/^work:[0-9a-f]{32}$/);
           assert.match(item.candidate_hash,/^[0-9a-f]{64}$/);
           assert.ok(Number.isSafeInteger(item.issue_number)&&
            item.issue_number>=1&&item.issue_number<=100000);
           assert.ok(installBranches.has(item.install_branch),
            'only supported isolated preview installation branches may be dispatched');
           assert.ok(!seen.has(item.reservation_id),
            'a single owner approval must not be dispatched twice in one poll');
           seen.add(item.reservation_id);
           const dispatched=await fetch('https://api.github.com/repos/'+repo+
             '/actions/workflows/'+worker+'/dispatches',{
             method:'POST',redirect:'error',cache:'no-store',
             headers:{accept:'application/vnd.github+json',
              authorization:'Bearer '+process.env.GH_TOKEN,
              'x-github-api-version':'2022-11-28',
              'user-agent':'Reality-governed-approved-wake-v1',
              'content-type':'application/json'},
             body:JSON.stringify({ref:workerBranch,inputs:{
              reservation_id:item.reservation_id,
              original_work_id:item.original_work_id,
              candidate_hash:item.candidate_hash,
              issue_number:String(item.issue_number),
              install_branch:item.install_branch}})});
           assert.equal(dispatched.status,204,
             'GitHub Actions accepted exact isolated worker workflow_dispatch');
           console.log('REALITY_GOVERNED_AUTO_WAKE',JSON.stringify({
            status:'SIGNED_OWNER_APPROVED_WORKER_DISPATCHED',
            reservation_id:item.reservation_id,original_work_id:item.original_work_id,
            dispatched_branch:workerBranch,owner_approval_created:false,
            installation_performed:false,production_changed:false}));
          }
          NODE
      - name: Poll exact genuine capability owner approvals and wake isolated worker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const repo='maloney2323/Reality';
          const project='hvkfreoagbrphwghjajw';
          const worker='reality-genuine-capability-auto-trigger-v1.yml';
          const branch='feature/reality-general-capability-engine-20261101';
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_REF,'refs/heads/main');
          assert.ok(['schedule','push','workflow_dispatch','workflow_run'].includes(process.env.GITHUB_EVENT_NAME));
          const issuer=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          issuer.searchParams.set('audience','reality-governed-approved-scheduler-v1');
          const issued=await fetch(issuer,{method:'GET',cache:'no-store',redirect:'error',
           headers:{authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          assert.equal(issued.status,200);
          const jwt=(await issued.json()).value;
          assert.ok(typeof jwt==='string'&&jwt.length>300);
          const response=await fetch('https://'+project+'.supabase.co/functions/v1/reality-governed-approved-scheduler',{
            method:'POST',cache:'no-store',redirect:'error',
            headers:{authorization:'Bearer '+jwt,'content-type':'application/json'},
            body:JSON.stringify({action:'poll'})});
          assert.equal(response.status,200,'signed database approval readback required');
          const result=await response.json();
          assert.equal(result?.ok,true);
          assert.equal(result?.github_oidc_verified,true);
          assert.equal(result?.isolated_supabase_readback_verified,true);
          assert.equal(result?.service_credential_returned,false);
          assert.equal(result?.owner_approval_used,false);
          assert.equal(result?.installation_performed,false);
          assert.equal(result?.production_changed,false);
          assert.equal(result?.repository_commit,process.env.GITHUB_SHA);
          const pending=result?.genuine_pending_approvals;
          assert.ok(Array.isArray(pending)&&pending.length<=3);
          const seen=new Set();
          for(const a of pending){
            assert.deepEqual(Object.keys(a).sort(),[
              'approval_id','artifact_sha256','original_work_id','trigger_id']);
            assert.match(a.approval_id,/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i);
            assert.match(a.trigger_id,/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i);
            assert.match(a.artifact_sha256,/^[a-f0-9]{64}$/);
            assert.match(a.original_work_id,/^work:[a-f0-9]{32}$/);
            assert.ok(!seen.has(a.approval_id));
            seen.add(a.approval_id);
          }
          if(!pending.length){
            console.log('REALITY_GENUINE_APPROVAL_WAKE',JSON.stringify({
              status:'NO_APPROVED_GENUINE_WORK',
              production_changed:false,worker_execution_started:false}));
            process.exit(0);
          }
          // One dispatch wakes the signed worker, which independently chooses
          // and atomically reserves only an existing exact owner approval.
          // No model, issue text, or scheduler input provides authority.
          const dispatched=await fetch('https://api.github.com/repos/'+repo+
            '/actions/workflows/'+worker+'/dispatches',{
             method:'POST',redirect:'error',cache:'no-store',
             headers:{accept:'application/vnd.github+json',
              authorization:'Bearer '+process.env.GH_TOKEN,
              'x-github-api-version':'2022-11-28',
              'user-agent':'Reality-signed-genuine-approved-wake-v1',
              'content-type':'application/json'},
             body:JSON.stringify({ref:branch})});
          assert.equal(dispatched.status,204,
            'GitHub must accept isolated worker dispatch');
          console.log('REALITY_GENUINE_APPROVAL_WAKE',JSON.stringify({
            status:'SIGNED_APPROVED_ISOLATED_WORKER_DISPATCHED',
            pending_approved_count:pending.length,
            installation_performed:false,production_changed:false}));
          NODE

