permissions:
  contents: read
  actions: read
jobs:
  governed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact owner-authorized bounded upgrade candidate and independent GitHub readback
        run: |
          node --check scripts/reality-live-upgrade-autorepair-v0.1.mjs
          node --check scripts/reality-live-upgrade-original-pilot-reactivation-v0.1.mjs
          node --check src/reality-historical-upgrade-proof-intake-v0.1.js
          node --check src/reality-independent-upgrade-ci-readback-v0.1.js
          node --check src/reality-upgrade-base-readiness-v0.1.js
          node --check src/reality-owner-bound-upgrade-closure-v0.1.js
          node --check src/reality-owner-upgrade-draft-continuity-v0.1.js
          node --check src/reality-owner-upgrade-github-install-readback-v0.1.js
          node --check src/reality-owner-upgrade-github-install-v0.1.js
          node --check src/reality-owner-upgrade-github-live-ports-v0.1.js
          node --check src/reality-owner-upgrade-original-github-work-v0.1.js
          node --check src/reality-owner-upgrade-install-continuation-v0.1.js
          node --check src/reality-owner-autonomous-upgrade-loop-v0.1.js
          node --check src/reality-recovery-continuation-probe-v0.1.js
          node --check src/reality-original-repair-runtime-capability-readback-v0.1.js
          node --check src/reality-real-recovery-coordinator-v0.1.js
          node --check api/reality/personal-autonomous-upgrade-loop.js
          node --check src/reality-owner-upgrade-original-job-settlement-v0.1.js
          node --check src/reality-original-job-acceptance-v0.1.js
          node --check src/reality-personal-unfinished-work-v0.1.js
          node --check src/reality-owner-repair-acceptance-v0.1.js
          node --check api/reality/personal-repair-owner-acceptance.js
          node --check src/reality-owner-upgrade-stage-authority-v0.1.js
          node --check src/reality-owner-upgrade-isolated-runtime-readback-v0.1.js
          node --check src/reality-owner-upgrade-runtime-registry-v0.1.js
          node --check src/reality-owner-upgrade-fresh-goal-v0.1.js
          node --check api/reality/personal-upgrade-proof-import.js
          node --test test/reality-governed-github-upgrade-provider-v0.1.test.js test/reality-recovery-v1-linkage.test.js test/reality-governed-autonomous-upgrade-orchestrator-v0.1.test.js test/reality-governed-upgrade-execution-dispatch-v0.1.test.js test/reality-upgrade-discovery-v0.1.test.js test/reality-upgrade-discovery-category-v0.1.test.js test/reality-upgrade-evidence-warrant-v0.1.test.js test/reality-historical-upgrade-proof-intake-v0.1.test.js test/reality-independent-upgrade-ci-readback-v0.1.test.js test/reality-owner-bound-upgrade-closure-v0.1.test.js test/reality-owner-upgrade-draft-continuity-v0.1.test.js test/reality-owner-upgrade-github-install-readback-v0.1.test.js test/reality-owner-upgrade-github-install-v0.1.test.js test/reality-owner-upgrade-github-live-ports-v0.1.test.js test/reality-owner-upgrade-original-job-settlement-v0.1.test.js test/reality-owner-upgrade-stage-authority-v0.1.test.js test/reality-owner-upgrade-isolated-runtime-readback-v0.1.test.js test/reality-owner-upgrade-runtime-registry-v0.1.test.js test/reality-owner-upgrade-fresh-goal-v0.1.test.js test/reality-original-job-acceptance-v0.1.test.js test/reality-personal-unfinished-work-v0.1.test.js test/reality-owner-repair-acceptance-v0.1.test.js test/reality-owner-upgrade-original-github-work-v0.1.test.js test/reality-owner-upgrade-install-continuation-v0.1.test.js test/reality-owner-autonomous-upgrade-loop-v0.1.test.js test/reality-recovery-continuation-probe-v0.1.test.js test/reality-original-repair-runtime-capability-readback-v0.1.test.js

      - name: Independently re-read pinned real GitHub self-correction artifact (read only)
        env:
          REALITY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import {loadRealGitHubPilotProof} from './src/reality-historical-upgrade-proof-intake-v0.1.js';
          const proof=await loadRealGitHubPilotProof();
          if(proof.total_passed!==15||proof.customer_original_work_id!==null||
             proof.github_execution_authorized!==false||proof.original_job_completed!==false)
            throw Error('LIVE_UPGRADE_PROOF_RECHECK_NOT_SAFE');
          console.log(JSON.stringify({state:'PINNED_REAL_PROOF_INDEPENDENTLY_REOBSERVED',
            run_url:proof.run_url,candidate_sha256:proof.corrected_source_sha256,
            historical_pilot_only:true,owner_warrant_signed:false,
            github_write_authorized:false,original_job_completed:false}));
          JS

      - name: Obtain exact independently proven model correction (developer only)
        uses: actions/download-artifact@v4
        with:
          name: reality-model-self-correction-independent-proof
          repository: maloney2323/Reality
          run-id: 40617479444
          github-token: ${{ github.token }}
          path: verified-developer-pilot

      - name: Run original developer construction work with corrected model tool in isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -f src/reality-extensions/construction-update-parser.mjs
          test -s verified-developer-pilot/candidate.mjs
          test -s verified-developer-pilot/independent-proof.json
          timeout 75s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -v "${{ github.workspace }}/verified-developer-pilot:/work:ro" \
            -v "${{ github.workspace }}/scripts:/tools:ro" \
            node:22-alpine node /tools/reality-live-upgrade-original-pilot-reactivation-v0.1.mjs \
            > verified-developer-pilot/developer-job-reactivation-proof.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('verified-developer-pilot/developer-job-reactivation-proof.json','utf8'));
          if(x.state!=='MODEL_CORRECTED_CAPABILITY_REACTIVATED_IN_ISOLATED_DEVELOPER_SANDBOX'||
             x.isolated_original_job_cases?.length!==2||
             x.developer_original_job_reexecuted_and_verified!==true||
             x.original_customer_work_id!==null||
             x.customer_capability_installed!==false||
             x.original_customer_job_completed!==false||
             x.github_write_authorized!==false)
           throw Error('DEVELOPER_REACTIVATION_EVIDENCE_INVALID');
          console.log(JSON.stringify(x));
          JS

      - name: Preserve independently executed developer original-job evidence
        uses: actions/upload-artifact@v4
        with:
          name: reality-original-developer-job-reactivation-evidence
          path: verified-developer-pilot/developer-job-reactivation-proof.json
          retention-days: 14

      - name: Independently observe live preview-base workflow readiness without mutation
        env:
          GH_READ_ONLY_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import {assertUpgradeBaseReady} from './src/reality-upgrade-base-readiness-v0.1.js';
          const root='https://api.github.com/repos/maloney2323/Reality';
          const headers={
            Accept:'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'Reality-Upgrader-Base-Readiness-Proof',
            Authorization:'Bearer '+process.env.GH_READ_ONLY_TOKEN,
          };
          const get=async path=>{
            const prefix='/repos/maloney2323/Reality';
            const relative=path.startsWith(prefix+'/')?path.slice(prefix.length):path;
            if(!relative.startsWith('/')||relative.includes('..'))
              throw Error('UNTRUSTED_GITHUB_READ_PATH');
            const response=await fetch(root+relative,{method:'GET',headers,redirect:'error'});
            if(!response.ok){
              console.error('PINNED_BASE_READ_HTTP_STATUS='+response.status+' SOURCE='+path.split('?')[0].replace(/[^a-zA-Z0-9\/._-]/g,'').slice(0,160));
              throw Error('GITHUB_READ_'+response.status);
            }
            return response.json();
          };
          const base='experiment/reality-live-durable-adversarial-20261025';
          const ref=await get('/git/ref/heads/'+base);
          if(ref.ref!=='refs/heads/'+base||
             !/^[a-f0-9]{40}$/.test(String(ref.object?.sha||'')))
            throw Error('UNVERIFIED_GITHUB_PREVIEW_BASE');
          try{
            const observed=await assertUpgradeBaseReady({
              providerGet:get,baseCommitSha:ref.object.sha,
            });
            console.log(JSON.stringify({state:'REAL_PREVIEW_BASE_CI_READY',
              base_sha:ref.object.sha,required_checks:observed.workflows.length,
              github_write_performed:false,capability_installed:false}));
          }catch(error){
            console.error('LIVE_BASE_READ_DIAGNOSIS='+String(error?.message||error).slice(0,110));
            if(!['UPGRADE_BASE_REQUIRED_CI_WORKFLOW_UNAVAILABLE',
               'UPGRADE_BASE_REQUIRED_CI_TRIGGER_MISSING'].includes(error.message))
              throw error;
            console.log(JSON.stringify({state:'REAL_PREVIEW_BASE_CI_BLOCKED',
              reason:error.message,pinned_base_sha:ref.object.sha,
              upgrade_dispatch_allowed:false,owner_reservation_consumed:false,
              github_write_performed:false,capability_installed:false}));
            throw Error('LIVE_UPGRADE_BASE_NOT_READY');
          }
          JS

  real-model-pilot-synthesis:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[run-model-pilot]')
    needs: governed-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ask configured OpenAI model to GENERATE a missing capability, no fallback
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_OPENAI_MODEL: ${{ vars.REALITY_OPENAI_MODEL }}
          REALITY_PILOT_OUTPUT: pilot
        run: node scripts/reality-live-self-upgrade-pilot-v0.1.mjs
      - name: Require actual source from real model and exact SHA
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('pilot/generation-evidence.json','utf8'));
          if(!p.model_generated||!p.model_response_id||!fs.existsSync('pilot/candidate.mjs')){
            console.error('REAL_MODEL_NOT_GENERATED: '+p.status+' '+(p.blocker||''));
            process.exit(13);
          }
          const sha=createHash('sha256').update(fs.readFileSync('pilot/candidate.mjs')).digest('hex');
          if(p.source_sha256!==sha)throw Error('GENERATION_SOURCE_HASH_CHANGED');
          console.log('REAL_MODEL_CANDIDATE_SHA256='+sha);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-real-model-candidate-provenance
          path: pilot/
          retention-days: 14

  real-model-pilot-independent-sandbox:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[run-model-pilot]')
    needs: real-model-pilot-synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: reality-real-model-candidate-provenance
          path: pilot
      - name: Check model candidate matches its recorded hash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('pilot/generation-evidence.json','utf8'));
          const sha=createHash('sha256').update(fs.readFileSync('pilot/candidate.mjs')).digest('hex');
          if(p.model_generated!==true||p.source_sha256!==sha)
            throw Error('GENERATION_ARTIFACT_NOT_AUTHENTICATED');
          JS
      - name: Isolated container tests with zero network or secrets
        run: |
          set -euo pipefail
          timeout 70s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
