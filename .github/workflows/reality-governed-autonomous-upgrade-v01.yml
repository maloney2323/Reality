             digest(fs.readFileSync('repaired/original-candidate.mjs'))!==a.previous_candidate_sha256||
             a.previous_candidate_sha256===a.corrected_candidate_sha256)
            throw Error('AUTONOMOUS_REPAIR_CANDIDATE_BYTES_NOT_ATTESTED');
