name: Governed Autonomous Self-Upgrading Provider v0.1
# Live model pilot trigger: bounded single attempt; separate no-secret holdout.
on:
  push:
    branches:
      - feature/governed-autonomous-self-upgrading-v01-20261027
    paths:
      - 'scripts/reality-live-self-upgrade-pilot-v0.1.mjs'
      - 'scripts/reality-live-upgrade-independent-grader-v0.1.mjs'
      - 'scripts/reality-live-upgrade-evaluate-one-v0.1.mjs'
      - 'src/reality-governed-github-upgrade-provider-v0.1.js'
      - 'src/reality-upgrade-evidence-warrant-v0.1.js'
      - 'src/reality-warranted-upgrade-candidate-loader-v0.1.js'
      - 'test/reality-upgrade-evidence-warrant-v0.1.test.js'
      - 'src/reality-upgrade-discovery-v0.1.js'
      - 'src/reality-real-recovery-coordinator-v0.1.js'
      - 'test/reality-upgrade-discovery-v0.1.test.js'
      - 'test/reality-upgrade-discovery-category-v0.1.test.js'
      - 'index.html'
      - 'src/reality-governed-upgrade-execution-dispatch-v0.1.js'
      - 'test/reality-governed-upgrade-execution-dispatch-v0.1.test.js'
      - 'src/reality-governed-work-runtime-v0.1.js'
      - 'src/reality-governed-autonomous-upgrade-orchestrator-v0.1.js'
      - 'test/reality-governed-autonomous-upgrade-orchestrator-v0.1.test.js'
      - 'test/reality-governed-github-upgrade-provider-v0.1.test.js'
      - '.github/workflows/reality-governed-autonomous-upgrade-v01.yml'
  pull_request:
    paths:
      - 'scripts/reality-live-self-upgrade-pilot-v0.1.mjs'
      - 'scripts/reality-live-upgrade-independent-grader-v0.1.mjs'
      - 'scripts/reality-live-upgrade-evaluate-one-v0.1.mjs'
      - 'src/reality-governed-github-upgrade-provider-v0.1.js'
      - 'src/reality-upgrade-evidence-warrant-v0.1.js'
      - 'src/reality-warranted-upgrade-candidate-loader-v0.1.js'
      - 'test/reality-upgrade-evidence-warrant-v0.1.test.js'
      - 'src/reality-upgrade-discovery-v0.1.js'
      - 'src/reality-real-recovery-coordinator-v0.1.js'
      - 'test/reality-upgrade-discovery-v0.1.test.js'
      - 'test/reality-upgrade-discovery-category-v0.1.test.js'
      - 'index.html'
      - 'src/reality-governed-upgrade-execution-dispatch-v0.1.js'
      - 'test/reality-governed-upgrade-execution-dispatch-v0.1.test.js'
      - 'src/reality-governed-work-runtime-v0.1.js'
      - 'src/reality-governed-autonomous-upgrade-orchestrator-v0.1.js'
      - 'test/reality-governed-autonomous-upgrade-orchestrator-v0.1.test.js'
      - 'test/reality-governed-github-upgrade-provider-v0.1.test.js'
      - '.github/workflows/reality-governed-autonomous-upgrade-v01.yml'
permissions:
  contents: read
jobs:
  governed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact owner-authorized bounded upgrade candidate and independent GitHub readback
        run: node --test test/reality-governed-github-upgrade-provider-v0.1.test.js test/reality-recovery-v1-linkage.test.js test/reality-governed-autonomous-upgrade-orchestrator-v0.1.test.js test/reality-governed-upgrade-execution-dispatch-v0.1.test.js test/reality-upgrade-discovery-v0.1.test.js test/reality-upgrade-discovery-category-v0.1.test.js test/reality-upgrade-evidence-warrant-v0.1.test.js

  real-model-pilot-synthesis:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[run-model-pilot]')
    needs: governed-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ask configured OpenAI model to GENERATE a missing capability, no fallback
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_OPENAI_MODEL: ${{ vars.REALITY_OPENAI_MODEL }}
          REALITY_PILOT_OUTPUT: pilot
        run: node scripts/reality-live-self-upgrade-pilot-v0.1.mjs
      - name: Require actual source from real model and exact SHA
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('pilot/generation-evidence.json','utf8'));
          if(!p.model_generated||!p.model_response_id||!fs.existsSync('pilot/candidate.mjs')){
            console.error('REAL_MODEL_NOT_GENERATED: '+p.status+' '+(p.blocker||''));
            process.exit(13);
          }
          const sha=createHash('sha256').update(fs.readFileSync('pilot/candidate.mjs')).digest('hex');
          if(p.source_sha256!==sha)throw Error('GENERATION_SOURCE_HASH_CHANGED');
          console.log('REAL_MODEL_CANDIDATE_SHA256='+sha);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-real-model-candidate-provenance
          path: pilot/
          retention-days: 14

  real-model-pilot-independent-sandbox:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[run-model-pilot]')
    needs: real-model-pilot-synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: reality-real-model-candidate-provenance
          path: pilot
      - name: Check model candidate matches its recorded hash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('pilot/generation-evidence.json','utf8'));
          const sha=createHash('sha256').update(fs.readFileSync('pilot/candidate.mjs')).digest('hex');
          if(p.model_generated!==true||p.source_sha256!==sha)
            throw Error('GENERATION_ARTIFACT_NOT_AUTHENTICATED');
          JS
      - name: Isolated container tests with zero network or secrets
        run: |
          set -euo pipefail
          timeout 70s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -v "${{ github.workspace }}/pilot:/work:ro" \
            -v "${{ github.workspace }}/scripts:/tools:ro" \
            node:22-alpine node /tools/reality-live-upgrade-independent-grader-v0.1.mjs \
            /work/candidate.mjs > pilot/independent-verification.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const gen=JSON.parse(fs.readFileSync('pilot/generation-evidence.json','utf8'));
          const v=JSON.parse(fs.readFileSync('pilot/independent-verification.json','utf8'));
          if(v.status!=='INDEPENDENT_SANDBOX_VERIFIED'||
             v.frozen?.passed!==true||v.holdout?.passed!==true||
             v.passed!==v.total||v.isolation?.network_permitted!==false)
            throw Error('REAL_CANDIDATE_DID_NOT_PASS_INDEPENDENT_SANDBOX');
          const evidence={version:'reality-isolated-upgrade-proof-v0.1',
           original_work_id:gen.original_work_id,
           model_response_id:gen.model_response_id,
           candidate_sha256:gen.source_sha256,
           holdout_result_sha256:v.holdout.result_sha256,
           total:v.total,passed:v.passed,
           independent_verifier_output_sha256:createHash('sha256')
             .update(fs.readFileSync('pilot/independent-verification.json')).digest('hex'),
           state:'REAL_MODEL_CANDIDATE_INDEPENDENTLY_VERIFIED_NOT_INSTALLED',
           github_write_authorized:false,
           original_job_completed:false};
          fs.writeFileSync('pilot/independent-proof.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-independent-model-upgrade-proof
          path: pilot/
          retention-days: 14
