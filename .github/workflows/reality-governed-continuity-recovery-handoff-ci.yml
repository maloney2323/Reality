name: Reality governed Continuity recovery handoff
on:
  push:
    paths:
      - 'src/reality-governed-continuity-evidence-classifier-v1.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'test/reality-governed-continuity-recovery-handoff-v1.test.js'
      - '.github/workflows/reality-governed-continuity-recovery-handoff-ci.yml'
  pull_request:
    paths:
      - 'src/reality-governed-continuity-evidence-classifier-v1.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'test/reality-governed-continuity-recovery-handoff-v1.test.js'
      - 'test/reality-governed-continuity-evidence-classifier-v1.test.js'
      - '.github/workflows/reality-governed-continuity-recovery-handoff-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classified-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify complete modules parse
        run: |
          node --check src/reality-governed-continuity-evidence-classifier-v1.js
          node --check api/reality/governed-employee-shift-worker.js
          node --check test/reality-governed-continuity-recovery-handoff-v1.test.js
      - name: Run independent classifier and recovery handoff contract regressions
        run: |
          node --test test/reality-governed-continuity-recovery-handoff-v1.test.js
          node --test test/reality-governed-continuity-evidence-classifier-v1.test.js
