name: Reality Governed Execution Engine v0.1
on:
  push:
    paths:
      - 'src/reality-governed-execution-engine-v0.1.js'
      - 'test/reality-governed-execution-engine-v0.1.test.js'
      - 'api/reality/execute.js'
      - '.github/workflows/reality-governed-execution-engine-v0.1.yml'
  pull_request:
    paths:
      - 'src/reality-governed-execution-engine-v0.1.js'
      - 'test/reality-governed-execution-engine-v0.1.test.js'
      - 'api/reality/execute.js'
      - '.github/workflows/reality-governed-execution-engine-v0.1.yml'
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 22}
   - run: node --test test/reality-governed-execution-engine-v0.1.test.js
