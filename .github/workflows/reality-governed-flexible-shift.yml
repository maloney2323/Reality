  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  verify-duration-and-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all existing and flexible employee shift contracts
        run: node --test test/reality-governed-flexible-shift-v2.test.js test/reality-governed-employee-shift-v1.test.js test/reality-owner-chat-shift-command-v1.test.js test/reality-workday-team-assessment-v1.test.js test/reality-named-employee-roster-v1.test.js test/reality-employee-recovery-route-v1.test.js test/reality-riley-engineering-pilot-v1.test.js test/reality-riley-pilot-provider-proof-v1.test.js test/reality-riley-governed-original-job-v1.test.js test/reality-employee-shared-capability-wake-v1.test.js test/reality-employee-edge-governed-wake-v1.test.js test/reality-riley-live-loop-readiness-v1.test.js test/reality-riley-existing-backlog-v1.test.js test/reality-riley-existing-shift-source-priority-v1.test.js

  riley-live-investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Riley verifies a real tracked engineering problem
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RILEY_SOURCE_ISSUE: '143'
          RILEY_TARGET_WORKFLOW_NAME: Reality Governed Execution Engine v0.1
        run: node scripts/reality-riley-engineering-pilot-v1.mjs
      - name: Archive source observation
        uses: actions/upload-artifact@v4
        with:
          name: riley-verifiable-engineering-investigation
          path: riley-pilot-evidence/investigation.json
          if-no-files-found: error
          retention-days: 14
  riley-independent-verification:
    needs: riley-live-investigation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: riley-verifiable-engineering-investigation
          path: riley-pilot-evidence
      - name: Verify the original provider evidence independently
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reality-riley-verify-audit-v1.mjs
