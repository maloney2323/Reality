name: Reality flexible governed employee shifts
on:
  push:
    branches: [fix/reality-chat-fullscreen-verified-cycle-20261105]
    paths:
      - src/reality-eight-hour-shift-plan-v1.js
      - src/reality-governed-shift-boundary-v1.js
      - src/reality-shift-conversation-brief-v1.js
      - api/reality/personal-governed-employee-shift.js
      - test/reality-governed-flexible-shift-v2.test.js
      - reality-owner-chat-shift-command-v1.js
      - reality-chat-simple.html
      - test/reality-owner-chat-shift-command-v1.test.js
      - src/reality-workday-team-assessment-v1.js
      - src/reality-employee-shift-chat-context-v1.js
      - test/reality-workday-team-assessment-v1.test.js
      - src/reality-employee-identity-roster-v1.js
      - api/reality/personal-employee-roster.js
      - test/reality-named-employee-roster-v1.test.js
      - .github/workflows/reality-governed-flexible-shift.yml
  pull_request:
    paths:
      - src/reality-eight-hour-shift-plan-v1.js
      - src/reality-governed-shift-boundary-v1.js
      - src/reality-shift-conversation-brief-v1.js
      - api/reality/personal-governed-employee-shift.js
      - test/reality-governed-flexible-shift-v2.test.js
      - reality-owner-chat-shift-command-v1.js
      - reality-chat-simple.html
      - test/reality-owner-chat-shift-command-v1.test.js
      - src/reality-workday-team-assessment-v1.js
      - src/reality-employee-shift-chat-context-v1.js
      - test/reality-workday-team-assessment-v1.test.js
      - src/reality-employee-identity-roster-v1.js
      - api/reality/personal-employee-roster.js
      - test/reality-named-employee-roster-v1.test.js
      - .github/workflows/reality-governed-flexible-shift.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-duration-and-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all existing and flexible employee shift contracts
        run: node --test test/reality-governed-flexible-shift-v2.test.js test/reality-governed-employee-shift-v1.test.js test/reality-owner-chat-shift-command-v1.test.js test/reality-workday-team-assessment-v1.test.js test/reality-named-employee-roster-v1.test.js
