name: Reality Governed Fragmented Signal Cleaner v0.1
on:
  push:
    branches: [main, governed-fragmented-signal-cleaner-v0.1]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test/reality-governed-fragmented-signal-cleaner-v0.1.test.js
      - run: node test/reality-chat-governed-brief-v0.1.test.js
