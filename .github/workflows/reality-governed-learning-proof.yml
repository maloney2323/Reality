name: Reality Governed Learning Proof

on:
  workflow_run:
    workflows: ["Reality Cognitive Evolution Benchmarks"]
    types: [completed]

jobs:
  governed-learning-proof:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4

      - name: Run governed learning proof
        run: |
          set -euo pipefail
          node --test \
            test/reality-gsi-training-ground-v1.0.test.js \
            test/reality-learning-proof-v1.0.test.js

      - name: Emit learning verification receipt
        if: success()
        run: |
          mkdir -p verification-receipt
          node -e '
            const fs = require("fs");
            const receipt = {
              schema: "reality-governed-learning-verification-v1.0",
              status: "VERIFIED",
              upstream_workflow: process.env.GITHUB_WORKFLOW,
              upstream_run_id: process.env.GITHUB_RUN_ID,
              verified_commit: process.env.GITHUB_SHA,
              verified_at: new Date().toISOString(),
              authority_granted: false,
              production_graph_written: false
            };
            fs.writeFileSync("verification-receipt/learning-verification.json", JSON.stringify(receipt, null, 2));
            console.log(JSON.stringify(receipt));
          '

      - name: Preserve verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-learning-verification-${{ github.run_id }}
          path: verification-receipt/
          if-no-files-found: ignore
