name: Reality — Isolated governed OpenAI gateway proof
on:
  push:
    branches:
      - reality/isolated-openai-governance-gateway-20261108
  pull_request:
    paths:
      - src/reality-governed-openai-gateway-v1.js
      - src/reality-one-openai-combined-role-handoff-v1.js
      - src/reality-governed-tool-session-v1.js
      - src/reality-riley-authorized-pr-review-job-v1.js
      - src/reality-riley-trusted-original-driver-bridge-v1.js
      - test/reality-riley-trusted-original-driver-bridge-v1.test.js
      - src/reality-governed-shift-boundary-v1.js
      - supabase/migrations/20261108_governed_original_pr_review_model_scope_v1.sql
      - api/reality/governed-employee-shift-worker.js
      - test/reality-governed-openai-gateway-v1.test.js
      - test/reality-governed-openai-continuity-capability-v1.test.js
      - test/reality-one-openai-combined-role-handoff-v1.test.js
      - test/reality-riley-authorized-pr-review-job-v1.test.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Reality model boundary and original tool-continuation regressions
        run: |
          node --check src/reality-governed-openai-gateway-v1.js
          node --check src/reality-one-openai-combined-role-handoff-v1.js
          node --check src/reality-governed-tool-session-v1.js
          node --check src/reality-riley-authorized-pr-review-job-v1.js
          node --check src/reality-riley-trusted-original-driver-bridge-v1.js
          node --check api/reality/governed-employee-shift-worker.js
          node --test test/reality-model-gateway-v0.1.test.js test/reality-riley-service-original-runtime-v1.test.js test/reality-riley-full-execution-path-v1.test.js test/reality-riley-trusted-original-driver-bridge-v1.test.js test/reality-riley-original-driver-security-v1.test.js test/reality-frozen-regressions/riley-pr-credential-preflight.test.js test/reality-riley-authorized-pr-review-job-v1.test.js test/reality-governed-openai-continuity-capability-v1.test.js test/reality-governed-late-bound-tool-adapter-v1.test.js test/reality-universal-governed-recovery-handoff-v1.test.js test/reality-governed-openai-gateway-v1.test.js test/reality-one-openai-combined-role-handoff-v1.test.js test/reality-governed-tool-session-v1.test.js
