name: Reality governed wake single-flight #351
on:
  pull_request:
    paths:
      - 'api/reality/governed-employee-shift-worker.js'
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'supabase/migrations/*bounded_preview_shift_worker_wake.sql'
      - 'supabase/migrations/*remove_idle_standing_discovery_wake.sql'
      - 'test/reality-governed-wake-singleflight-351.test.js'
      - '.github/workflows/reality-governed-wake-351-ci.yml'
permissions:
  contents: read
jobs:
  preview-wake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify changed worker module syntax
        run: node --check api/reality/governed-employee-shift-worker.js
      - name: Test preview wake claim and scheduler safety contracts
        run: node --test test/reality-governed-wake-singleflight-351.test.js
