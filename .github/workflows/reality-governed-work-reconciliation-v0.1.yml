name: Governed Workflow Reconciliation v0.1
on:
  push:
    branches: [main, governed-workflow-reconciliation-v0.1]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test/reality-governed-work-reconciliation-v0.1.test.js
