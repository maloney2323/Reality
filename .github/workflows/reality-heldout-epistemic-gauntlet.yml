name: Reality Held-out Epistemic Gauntlet — No Cost
on:
  push:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run 32 fixed held-out positive and negative examples
        run: |
          node scripts/reality-blind-epistemic-gauntlet-v0.1.mjs
          node scripts/reality-independent-confirmation-v0.1.mjs
          echo 'This job reports actual misses and false positives but does not invent a drift rate.'
      - name: No external effects
        run: echo 'No providers, no database, no credentials, no customer effects.'
