name: Reality exact owner-approved install to settlement contract
on:
  push:
    branches: [feature/reality-install-to-settlement-20261031]
    paths:
      - 'test/reality-live-approved-install-to-settlement-v1.0.test.js'
      - 'supabase/migrations/20261031_general_repair_settlement_marker_v1.sql'
      - 'src/reality-live-approved-install-to-settlement-v1.0.js'
      - 'src/reality-general-approved-repair-continuation-v1.0.js'
      - 'api/reality/personal-real-repair-install.js'
      - 'index.html'
      - 'supabase/migrations/20261031_general_repair_verified_installation_bridge_v2.sql'
      - 'src/reality-general-installed-work-verifier-v1.0.js'
      - 'test/reality-general-installed-work-verifier-v1.0.test.js'
      - '.github/workflows/reality-real-gap-acceptance-before-model-v1.yml'
      - '.github/workflows/reality-install-to-settlement-v1.yml'
  pull_request:
    paths:
      - 'test/reality-live-approved-install-to-settlement-v1.0.test.js'
      - 'supabase/migrations/20261031_general_repair_settlement_marker_v1.sql'
      - 'src/reality-live-approved-install-to-settlement-v1.0.js'
      - 'src/reality-general-approved-repair-continuation-v1.0.js'
      - 'api/reality/personal-real-repair-install.js'
      - 'index.html'
      - 'supabase/migrations/20261031_general_repair_verified_installation_bridge_v2.sql'
      - 'src/reality-general-installed-work-verifier-v1.0.js'
      - 'test/reality-general-installed-work-verifier-v1.0.test.js'
      - '.github/workflows/reality-real-gap-acceptance-before-model-v1.yml'
      - '.github/workflows/reality-install-to-settlement-v1.yml'
permissions: {contents: read}
jobs:
  inspect-real-original-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node --check src/reality-live-approved-install-to-settlement-v1.0.js
      - run: node --test test/reality-live-approved-install-to-settlement-v1.0.test.js
      - run: node --check src/reality-general-approved-repair-continuation-v1.0.js
      - run: node --check api/reality/personal-real-repair-install.js
      - run: node --check src/reality-general-installed-work-verifier-v1.0.js
      - run: node --test test/reality-general-installed-work-verifier-v1.0.test.js
      - name: Real GitHub provider negative control — original failing job cannot count as completed
        env:
          REALITY_BUILDER_DISPATCH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            import {createIndependentInstalledWorkVerifier} from "./src/reality-general-installed-work-verifier-v1.0.js";
            const v=createIndependentInstalledWorkVerifier();
            let refused=false;
            try {
              const out=await v.observeOriginalRun({
                installedCommitSha:"8c6cd6c3891e98aaf30520bba2f47ee604d10d69",
                installedBranch:"feature/reality-live-general-repair-bridge-20261031",
                originalWorkId:"work:"+"c".repeat(32),
                expectedFrozenTestPath:"test/reality-frozen-regressions/reality-general-execution-receipt-v1.test.js",
                expectedFrozenSha:"f59216f72a63c612279959138877a4243d33a8e15f731e049e40be05dd07ac71",
              });
              if(out.complete!==false)throw Error("UNVERIFIED_GREEN_WORK");
              refused=true;
            } catch (err) {
              if(err?.message!=="REAL_INSTALLED_WORK_INSTALLED_ORIGINAL_ACCEPTANCE_NOT_SUCCESSFUL")throw err;
              refused=true;
            }
            if(!refused)process.exit(1);
            console.log("Original failed provider CI could not be promoted to settlement.");
          '
      - run: node --test test/reality-general-isolated-install-v1.0.test.js
      - run: node --test test/reality-general-original-work-settlement-v1.0.test.js
      - run: node --test test/reality-general-approved-repair-continuation-v1.0.test.js
      - run: node --test test/reality-work-center-owner-approval-ui-v1.test.js
      - run: node --test test/reality-owner-repair-candidate-admission-v1.0.test.js
      - run: node --test test/reality-general-constitutional-checkpoint-v1.0.test.js
      - run: echo 'Contract tests, no real owner approval or installation.'
