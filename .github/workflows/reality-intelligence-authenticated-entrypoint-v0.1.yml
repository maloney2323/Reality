name: Reality Authenticated Continuity Entry v0.1 (synthetic)
on:
  push:
    branches:
      - repair/authenticated-continuity-entrypoint-20261022
    paths:
      - api/reality/intelligence.js
      - index.html
      - test/reality-intelligence-authenticated-entrypoint-v0.1.test.js
      - .github/workflows/reality-intelligence-authenticated-entrypoint-v0.1.yml
  pull_request:
    paths:
      - api/reality/intelligence.js
      - index.html
      - test/reality-intelligence-authenticated-entrypoint-v0.1.test.js
      - .github/workflows/reality-intelligence-authenticated-entrypoint-v0.1.yml
permissions:
  contents: read
jobs:
  authenticated-project-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify live-route authentication and truthful readback status (all providers mocked)
        run: node --test test/reality-intelligence-authenticated-entrypoint-v0.1.test.js
      - name: Protect existing authenticated chat continuity contract
        run: node --test test/reality-authenticated-chat-continuity-v0.1.test.js
      - name: Protect existing Reality Impact honesty contract
        run: node --test test/reality-impact-ui-v0.1.test.js
      - name: Explain scope
        run: |
          echo "Only synthetic providers were exercised"
          echo "Cross-session persistence, production deployment and natural-language hallucination detection remain UNPROVEN"
