name: Reality Intelligence Gain Measurement

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/reality-intelligence-gain-runner-v1.0.js'
      - 'src/reality-intelligence-gain-test-v1.0.js'
      - '.github/workflows/reality-intelligence-gain-measurement.yml'

jobs:
  measure-intelligence-gain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4

      - name: Run held-out four-condition experiment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_OPENAI_MODEL: ${{ vars.REALITY_OPENAI_MODEL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { runIntelligenceGainExperiment } from './src/reality-intelligence-gain-runner-v1.0.js';
          const result = await runIntelligenceGainExperiment();
          console.log(JSON.stringify(result, null, 2));
          if (result.status !== 'MEASURED') process.exit(1);
          NODE
