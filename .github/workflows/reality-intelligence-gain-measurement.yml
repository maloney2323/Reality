name: Reality Intelligence Gain Measurement

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/reality-intelligence-gain-runner-v1.0.js'
      - 'src/reality-intelligence-gain-test-v1.0.test.js'
      - 'api/reality/intelligence-gain.js'
      - '.github/workflows/reality-intelligence-gain-measurement.yml'

jobs:
  measure-intelligence-gain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Reality
        uses: actions/checkout@v4

      - name: Run actual held-out four-condition experiment
        run: |
          set -euo pipefail
          curl -fsS -X POST             -H 'content-type: application/json'             https://reality-blond.vercel.app/api/reality/intelligence-gain             -o intelligence-gain-result.json
          cat intelligence-gain-result.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('intelligence-gain-result.json', 'utf8'));
          if (result.status !== 'MEASURED') process.exit(1);
          NODE

      - name: Persist result to repository
        run: |
          set -euo pipefail
          mkdir -p artifacts/intelligence-gain
          cp intelligence-gain-result.json artifacts/intelligence-gain/latest.json
          cp intelligence-gain-result.json "artifacts/intelligence-gain/run-${{ github.run_id }}.json"
          git config user.name "reality-measurement-bot"
          git config user.email "reality-measurement-bot@users.noreply.github.com"
          git add artifacts/intelligence-gain/
          git commit -m "Record intelligence gain measurement run ${{ github.run_id }}" || exit 0
          git push
