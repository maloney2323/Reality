name: Reality Live Intelligence Orchestration v0.1
on:
  push:
    branches: [main, feat/continuity-spine-v2, fix/continuity-stage-gate-v1]
  pull_request:
    branches: [main, feat/continuity-spine-v2]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/reality-live-intelligence-orchestration-v0.1.test.js test/reality-continuity-stage-gate-v1.0.test.js test/reality-continuity-spine-runtime-v0.1.test.js test/reality-continuity-runtime-v0.1.test.js test/reality-universe-postgres-continuity-v0.2.test.js test/reality-governed-fragmented-signal-cleaner-v0.1.test.js
