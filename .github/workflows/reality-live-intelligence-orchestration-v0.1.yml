name: Reality Live Intelligence Orchestration v0.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  focused-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused continuity and orchestration tests
        run: node --test test/reality-live-intelligence-orchestration-v0.1.test.js test/reality-continuity-stage-gate-v1.0.test.js test/reality-continuity-spine-runtime-v0.1.test.js test/reality-continuity-runtime-v0.1.test.js test/reality-continuity-legacy-disposition-v1.test.js test/reality-universe-postgres-continuity-v0.2.test.js test/reality-governed-fragmented-signal-cleaner-v0.1.test.js

  atomic-postgres-append:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reality_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reality_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify migration and concurrent writer behavior against PostgreSQL
        run: bash supabase/tests/atomic-continuity-append-v1.sh

  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full repository regression suite (raw result retained)
        run: npm test > /tmp/pr.tap 2>&1
        continue-on-error: true
      - name: Preserve raw full-regression TAP output
        if: always()
        run: cp /tmp/pr.tap pr-full-regression.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-full-regression-${{ github.run_id }}
          path: pr-full-regression.tap
          if-no-files-found: warn

  baseline-regression-comparison:
    runs-on: ubuntu-latest
    needs: full-regression
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate base SHA
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid base SHA supplied; cannot compare regressions safely."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full regression suite against exact base and PR commits
        run: |
          (cd baseline && node --test test/*.test.js) > /tmp/base.tap 2>&1 || true
          npm test > /tmp/pr.tap 2>&1 || true
      - name: Compare failure signatures; fail only for newly introduced failures
        run: node scripts/compare-ci-baseline.mjs /tmp/base.tap /tmp/pr.tap | tee ci-regression-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-regression-comparison-${{ github.run_id }}
          path: ci-regression-comparison.json
          if-no-files-found: error
