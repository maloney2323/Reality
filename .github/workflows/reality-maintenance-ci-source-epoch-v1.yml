name: Reality signed maintenance source epoch
on:
  pull_request:
    paths:
      - 'src/reality-signed-maintenance-ci-source-epoch-v1.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'supabase/migrations/20261119173000_signed_maintenance_ci_source_epoch_v1.sql'
      - 'test/reality-maintenance-ci-source-epoch-v1.test.js'
      - '.github/workflows/reality-maintenance-ci-source-epoch-v1.yml'
permissions:
  contents: read
jobs:
  independent-source-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test independently verified maintenance source epoch
        run: node --test test/reality-maintenance-ci-source-epoch-v1.test.js
