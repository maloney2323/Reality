name: Reality — bounded competitive research (preview only)
on:
  push:
    branches:
      - feature/reality-market-intelligence-preview-20261103
  pull_request:
    branches:
      - feature/reality-general-capability-engine-20261101
permissions:
  contents: read
jobs:
  bounded-strategy-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify source syntax
        run: |
          node --check src/reality-autonomous-market-intelligence-v1.js
          node --check api/reality/personal-market-research.js
      - name: Verify bounded research and no unauthorized side effects
        run: node --test test/reality-autonomous-market-intelligence-v1.test.js test/reality-market-research-restoration-v1.test.js
