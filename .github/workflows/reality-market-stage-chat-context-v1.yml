name: Reality — source-backed self-repair evidence in Chat (Preview)
on:
  pull_request:
    branches:
      - feature/reality-general-capability-engine-20261101
  push:
    branches:
      - feature/reality-chat-knows-stage-evidence-20261103
permissions:
  contents: read
jobs:
  chat-stage-context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate conversation source and stage API syntax
        run: |
          node --check api/reality/personal-chat.js
          node --check src/reality-market-stage-chat-context-v1.js
      - name: Reproduce owner-scoped stage self-diagnosis without grants
        run: |
          node --test test/reality-market-stage-chat-context-v1.test.js
          node --test test/reality-market-handoff-chat-v1.test.js
          node --test test/reality-private-chat-preview-v0.1.test.js
          node --test test/reality-final-chat-publication-proof-v0.1.test.js
