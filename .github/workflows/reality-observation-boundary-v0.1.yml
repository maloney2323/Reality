name: Reality Observation Boundary v0.1
on:
  push:
    branches: [main, reality-governance-before-generation-v0.1]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test/reality-observation-boundary-v0.1.test.js
      - run: node test/reality-self-inspection-trace-v0.1.test.js
