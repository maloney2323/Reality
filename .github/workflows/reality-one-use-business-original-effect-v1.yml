name: Reality exact business effect approval and single-use reservation
on:
  pull_request:
    branches:
      - repair/maintenance-artifact-to-same-shift-review-20261120
    paths:
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'api/reality/personal-exact-business-effect-approval.js'
      - 'reality-chat-continuous-qualification-v1.js'
      - 'supabase/migrations/20261122002000_one_use_business_effect_approval_reservation_v1.sql'
      - 'supabase/migrations/20261122003000_business_effect_exact_payload_persistence_v1.sql'
      - 'supabase/migrations/20261122004000_signed_worker_next_approved_business_effect_v1.sql'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'test/reality-one-use-business-original-effect-approval-v1.test.js'
      - '.github/workflows/reality-one-use-business-original-effect-v1.yml'
permissions:
  contents: read
concurrency:
  group: business-one-use-effect-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-replay-and-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Negative authority and one-use source tests
        run: node --test test/reality-one-use-business-original-effect-approval-v1.test.js
      - name: Verify source parses without invoking providers
        run: |
          node --check api/reality/personal-exact-business-effect-approval.js
          node --check reality-chat-continuous-qualification-v1.js
          node --check src/reality-governed-shift-boundary-v1.js
          node --check api/reality/governed-employee-shift-worker.js
