name: Reality Operational ROI — lifecycle and source evidence v2
on:
  push:
    branches: [feature/reality-general-capability-engine-20261101]
    paths:
      - 'src/reality-operational-roi-v2.js'
      - 'api/reality/personal-operational-roi-v2.js'
      - 'test/reality-operational-roi-v2.test.js'
      - '.github/workflows/reality-operational-roi-v2.yml'
permissions:
  contents: read
jobs:
  verify-independent-lifecycle-and-economic-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Source integrity, owner isolation and non-fabricated financial reporting
        run: |
          node --check src/reality-operational-roi-v2.js
          node --check api/reality/personal-operational-roi-v2.js
          node --test test/reality-operational-roi-v2.test.js
