# Reality-generated source is NOT trusted. The model runs only in secret-bearing
# generation jobs, and its output executes ONLY in separate no-secret Docker jobs.
# Each failed model candidate and the independent test report become the next
# model attempt's exact evidence packet. 3 rounds max, no auto-installation.
name: Reality Original #143 — Evidence-Led Self-Correction
on:
  push:
    branches:
      - reality/orchestrate/original-143-model-full-loop-20261028
    paths:
      - '.github/workflows/reality-original-143-model-full-loop.yml'
      - 'scripts/reality-original-143-self-correct.mjs'
      - 'test/reality-original-143-independent-contract.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:

  generate-1:
    
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REALITY_OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reality model generates or repairs round 1 from evidence
        run: |
          node --check scripts/reality-original-143-self-correct.mjs
          node scripts/reality-original-143-self-correct.mjs generate 1
      - name: Preserve original response and every rejected/generated source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-143-model-round-1
          path: reality-generated-original-143/round-1/
          if-no-files-found: warn
          retention-days: 14

  verify-1:
    needs: generate-1
    if: ${{ always() && needs.generate-1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.sandbox.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-143-model-round-1
          path: reality-generated-original-143/round-1
      - name: Independently test candidate with no network, credentials or writes
        id: sandbox
        continue-on-error: true
        shell: bash
        run: |
          set -u
          d="reality-generated-original-143/round-1"
          status=0
          if [ ! -f "$d/candidate.json" ] || [ ! -f "$d/src/reality-extensions/reality-original-full-loop-integration.mjs" ] || [ ! -f "$d/api/reality/personal-original-full-loop.js" ] || [ ! -f "$d/test/reality-extensions/reality-original-full-loop-integration.test.js" ]; then
            echo "REALITY_REJECTED_CANDIDATE_CONTRACT_OR_INVALID_MODEL_OUTPUT" > reality-test-output.txt
            status=30
          else
            cp "$d/src/reality-extensions/reality-original-full-loop-integration.mjs" src/reality-extensions/
            cp "$d/api/reality/personal-original-full-loop.js" api/reality/
            cp "$d/test/reality-extensions/reality-original-full-loop-integration.test.js" test/reality-extensions/
            timeout 210s docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 80 --memory 512m --cpus 2 \
              --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
              -v "${{ github.workspace }}/src:/work/src:ro" \
              -v "${{ github.workspace }}/api:/work/api:ro" \
              -v "${{ github.workspace }}/test:/work/test:ro" \
              -v "${{ github.workspace }}/package.json:/work/package.json:ro" \
              -w /work node:22-alpine sh -c 'node --check src/reality-extensions/reality-original-full-loop-integration.mjs && node --check api/reality/personal-original-full-loop.js && node --check test/reality-extensions/reality-original-full-loop-integration.test.js && node --test test/reality-extensions/reality-original-full-loop-integration.test.js test/reality-original-143-independent-contract.test.js' > reality-test-output.txt 2>&1 || status=$?
          fi
          node scripts/reality-original-143-self-correct.mjs feedback 1 "$status"
          cat reality-test-output.txt | tail -55
          exit "$status"
      - name: Persist independent failed tests as evidence for Reality's next correction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-143-feedback-round-1
          path: reality-feedback/
          if-no-files-found: error
          retention-days: 14

  generate-2:
    needs: verify-1
    if: ${{ always() && needs.verify-1.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REALITY_OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-143-model-round-1
          path: reality-previous
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-143-feedback-round-1
          path: reality-previous
      - name: Reality model generates or repairs round 2 from evidence
        run: |
          node --check scripts/reality-original-143-self-correct.mjs
          node scripts/reality-original-143-self-correct.mjs generate 2
      - name: Preserve original response and every rejected/generated source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-143-model-round-2
          path: reality-generated-original-143/round-2/
          if-no-files-found: warn
          retention-days: 14

  verify-2:
    needs: generate-2
    if: ${{ always() && needs.generate-2.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.sandbox.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-143-model-round-2
          path: reality-generated-original-143/round-2
      - name: Independently test candidate with no network, credentials or writes
        id: sandbox
        continue-on-error: true
        shell: bash
        run: |
          set -u
          d="reality-generated-original-143/round-2"
          status=0
          if [ ! -f "$d/candidate.json" ] || [ ! -f "$d/src/reality-extensions/reality-original-full-loop-integration.mjs" ] || [ ! -f "$d/api/reality/personal-original-full-loop.js" ] || [ ! -f "$d/test/reality-extensions/reality-original-full-loop-integration.test.js" ]; then
            echo "REALITY_REJECTED_CANDIDATE_CONTRACT_OR_INVALID_MODEL_OUTPUT" > reality-test-output.txt
            status=30
          else
            cp "$d/src/reality-extensions/reality-original-full-loop-integration.mjs" src/reality-extensions/
            cp "$d/api/reality/personal-original-full-loop.js" api/reality/
            cp "$d/test/reality-extensions/reality-original-full-loop-integration.test.js" test/reality-extensions/
            timeout 210s docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 80 --memory 512m --cpus 2 \
              --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
              -v "${{ github.workspace }}/src:/work/src:ro" \
              -v "${{ github.workspace }}/api:/work/api:ro" \
              -v "${{ github.workspace }}/test:/work/test:ro" \
              -v "${{ github.workspace }}/package.json:/work/package.json:ro" \
              -w /work node:22-alpine sh -c 'node --check src/reality-extensions/reality-original-full-loop-integration.mjs && node --check api/reality/personal-original-full-loop.js && node --check test/reality-extensions/reality-original-full-loop-integration.test.js && node --test test/reality-extensions/reality-original-full-loop-integration.test.js test/reality-original-143-independent-contract.test.js' > reality-test-output.txt 2>&1 || status=$?
          fi
          node scripts/reality-original-143-self-correct.mjs feedback 2 "$status"
          cat reality-test-output.txt | tail -55
          exit "$status"
      - name: Persist independent failed tests as evidence for Reality's next correction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-143-feedback-round-2
          path: reality-feedback/
          if-no-files-found: error
          retention-days: 14

  generate-3:
    needs: verify-2
    if: ${{ always() && needs.verify-2.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REALITY_OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-143-model-round-2
          path: reality-previous
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-143-feedback-round-2
          path: reality-previous
      - name: Reality model generates or repairs round 3 from evidence
        run: |
          node --check scripts/reality-original-143-self-correct.mjs
          node scripts/reality-original-143-self-correct.mjs generate 3
      - name: Preserve original response and every rejected/generated source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-143-model-round-3
          path: reality-generated-original-143/round-3/
          if-no-files-found: warn
          retention-days: 14

  verify-3:
    needs: generate-3
    if: ${{ always() && needs.generate-3.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.sandbox.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-143-model-round-3
          path: reality-generated-original-143/round-3
      - name: Independently test candidate with no network, credentials or writes
        id: sandbox
        continue-on-error: true
        shell: bash
        run: |
          set -u
          d="reality-generated-original-143/round-3"
          status=0
          if [ ! -f "$d/candidate.json" ] || [ ! -f "$d/src/reality-extensions/reality-original-full-loop-integration.mjs" ] || [ ! -f "$d/api/reality/personal-original-full-loop.js" ] || [ ! -f "$d/test/reality-extensions/reality-original-full-loop-integration.test.js" ]; then
            echo "REALITY_REJECTED_CANDIDATE_CONTRACT_OR_INVALID_MODEL_OUTPUT" > reality-test-output.txt
            status=30
          else
            cp "$d/src/reality-extensions/reality-original-full-loop-integration.mjs" src/reality-extensions/
            cp "$d/api/reality/personal-original-full-loop.js" api/reality/
            cp "$d/test/reality-extensions/reality-original-full-loop-integration.test.js" test/reality-extensions/
            timeout 210s docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 80 --memory 512m --cpus 2 \
              --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
              -v "${{ github.workspace }}/src:/work/src:ro" \
              -v "${{ github.workspace }}/api:/work/api:ro" \
              -v "${{ github.workspace }}/test:/work/test:ro" \
              -v "${{ github.workspace }}/package.json:/work/package.json:ro" \
              -w /work node:22-alpine sh -c 'node --check src/reality-extensions/reality-original-full-loop-integration.mjs && node --check api/reality/personal-original-full-loop.js && node --check test/reality-extensions/reality-original-full-loop-integration.test.js && node --test test/reality-extensions/reality-original-full-loop-integration.test.js test/reality-original-143-independent-contract.test.js' > reality-test-output.txt 2>&1 || status=$?
          fi
          node scripts/reality-original-143-self-correct.mjs feedback 3 "$status"
          cat reality-test-output.txt | tail -55
          exit "$status"
      - name: Persist independent failed tests as evidence for Reality's next correction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-143-feedback-round-3
          path: reality-feedback/
          if-no-files-found: error
          retention-days: 14

  stage-verified-reality-candidate:
    needs: [verify-1, verify-2, verify-3]
    if: ${{ always() && (needs.verify-1.outputs.passed == 'true' || needs.verify-2.outputs.passed == 'true' || needs.verify-3.outputs.passed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.verify-1.outputs.passed == 'true' && 'reality-original-143-model-round-1' || (needs.verify-2.outputs.passed == 'true' && 'reality-original-143-model-round-2' || 'reality-original-143-model-round-3') }}
          path: reality-selected
      - name: Stage only independently verified Reality model files in separate branch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "reality/orchestrate/original-143-model-full-loop-20261028"
          test -f reality-selected/generation-receipt.json
          branch="reality/model-generated/original-143-full-loop-evidence-repair-v1"
          git switch -c "$branch"
          cp reality-selected/src/reality-extensions/reality-original-full-loop-integration.mjs src/reality-extensions/
          cp reality-selected/test/reality-extensions/reality-original-full-loop-integration.test.js test/reality-extensions/
          cp reality-selected/api/reality/personal-original-full-loop.js api/reality/
          git add src/reality-extensions/reality-original-full-loop-integration.mjs test/reality-extensions/reality-original-full-loop-integration.test.js api/reality/personal-original-full-loop.js
          git -c user.name='Reality Model Candidate Bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Reality verified full-loop candidate for original #143 (no installation)"
          git push origin "HEAD:refs/heads/$branch"
          echo "Source staged only; owner approval and production deployment remain disabled."
