name: Reality #143 — Actual read-only original executor
on:
  push:
    branches:
      - reality/proof/original-143-real-readonly-resume-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-original-executor-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REALITY_ORIGINAL_143_LIVE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute REAL original Reality #143 source evaluation, no writes or secret
        run: node --test test/reality-original-143-public-readonly-executor.test.js
