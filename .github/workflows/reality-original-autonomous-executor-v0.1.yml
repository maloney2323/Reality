name: Reality ORIGINAL Autonomous Executor Synthesis v0.1
on:
  push:
    branches:
      - feature/governed-autonomous-self-upgrading-v01-20261027
    paths:
      - '.github/workflows/reality-original-autonomous-executor-v0.1.yml'
      - 'scripts/reality-original-executor-autonomous-generate-v0.1.mjs'
      - 'scripts/reality-original-executor-autonomous-correct-v0.1.mjs'
      - 'test/reality-original-executor-autonomous-grader-v0.1.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: reality-original-autonomous-executor-v01
  cancel-in-progress: false
jobs:
  reality-model-generates-original-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify original work and actual model source bytes
        run: |
          node --check scripts/reality-original-executor-autonomous-generate-v0.1.mjs
          test "$(sha256sum src/reality-extensions/reality-original-maintenance-repair-proposal.mjs | cut -d' ' -f1)" = "6b82acd60baa9055bfc57a70f551bac44f783fc431814ad2555927eb50f5ca16"
      - name: Reality model generates the actual original-job executor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_OPENAI_MODEL: ${{ vars.REALITY_OPENAI_MODEL }}
          REALITY_ORIGINAL_REPAIR_OUTPUT: owner-original-repair-executor
        run: node scripts/reality-original-executor-autonomous-generate-v0.1.mjs
      - name: Preserve immutable model candidate and separate provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-autonomous-executor-model-candidate
          path: owner-original-repair-executor/
          retention-days: 14
  independent-secretless-executor-verifier:
    needs: reality-model-generates-original-executor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-autonomous-executor-model-candidate
          path: owner-original-repair-executor
      - name: Ensure verified original proposal and model provenance match
        run: |
          test "$(sha256sum src/reality-extensions/reality-original-maintenance-repair-proposal.mjs | cut -d' ' -f1)" = "6b82acd60baa9055bfc57a70f551bac44f783fc431814ad2555927eb50f5ca16"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('owner-original-repair-executor/generation-evidence.json','utf8'));
          const b=fs.readFileSync('owner-original-repair-executor/candidate.mjs');
          const sha=createHash('sha256').update(b).digest('hex');
          if(p.original_work_id!=='work:24cda9611404e9bcb47909976067605c'||
            p.model_generated!==true||!p.model_response_id||
            p.status!=='MODEL_ORIGINAL_EXECUTOR_GENERATED_UNTRUSTED_AWAITING_ISOLATED_VERIFICATION'||
            p.candidate_sha256!==sha||
            p.github_provider_write_performed!==false||
            p.original_job_completed!==false)
           throw Error('REALITY_AUTONOMOUS_ORIGINAL_EXECUTOR_PROVENANCE_REJECTED');
          console.log('AUTHENTIC_ORIGINAL_WORK_MODEL_CANDIDATE_UNTRUSTED');
          JS
          cp src/reality-extensions/reality-original-maintenance-repair-proposal.mjs owner-original-repair-executor/
      - name: Independently test model code without network, credentials, writable root, or provider access
        run: |
          set +e
          timeout 130s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -e REALITY_ORIGINAL_EXECUTOR_CANDIDATE=/work/owner-original-repair-executor/candidate.mjs \
            -v "${{ github.workspace }}:/work:ro" -w /work node:22-alpine \
            node --test test/reality-original-executor-autonomous-grader-v0.1.test.mjs \
            > owner-original-repair-executor/independent-feedback.txt 2>&1
          status=$?
          set -e
          tail -n 120 owner-original-repair-executor/independent-feedback.txt
          exit "$status"
      - name: Preserve exact independent failures for Reality's own corrective model call
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-original-executor-frozen-independent-feedback
          path: owner-original-repair-executor/
          retention-days: 14
      - name: Record explicit bounds of independent pass
        run: |
          echo 'ORIGINAL_WORK_ID=work:24cda9611404e9bcb47909976067605c'
          echo 'REALITY_GENERATED_EXECUTOR_INDEPENDENT_TESTS_PASSED'
          echo 'OWNER_SCOPED_WARRANT_ISSUED=false'
          echo 'UPGRADE_INSTALLED=false'
          echo 'ORIGINAL_JOB_COMPLETED=false'

  reality-model-corrects-failed-original-executor:
    needs: [reality-model-generates-original-executor, independent-secretless-executor-verifier]
    if: ${{ always() && needs.reality-model-generates-original-executor.result == 'success' && needs.independent-secretless-executor-verifier.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-executor-frozen-independent-feedback
          path: original-executor-failed
      - name: Reality autonomously corrects its OWN failed executor using independent failures
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALITY_OPENAI_MODEL: ${{ vars.REALITY_OPENAI_MODEL }}
          REALITY_PREVIOUS_EXECUTOR_SOURCE: original-executor-failed/candidate.mjs
          REALITY_PREVIOUS_EXECUTOR_FEEDBACK: original-executor-failed/independent-feedback.txt
          REALITY_ORIGINAL_REPAIR_OUTPUT: owner-original-executor-corrected
        run: |
          node --check scripts/reality-original-executor-autonomous-correct-v0.1.mjs
          node scripts/reality-original-executor-autonomous-correct-v0.1.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reality-original-executor-model-self-correction
          path: owner-original-executor-corrected/
          retention-days: 14
  independent-secretless-correction-retest:
    needs: reality-model-corrects-failed-original-executor
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reality-original-executor-model-self-correction
          path: owner-original-executor-corrected
      - name: Independently check same original work, actual model correction and source SHA
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=JSON.parse(fs.readFileSync('owner-original-executor-corrected/generation-evidence.json','utf8'));
          const b=fs.readFileSync('owner-original-executor-corrected/candidate.mjs');
          if(p.original_work_id!=='work:24cda9611404e9bcb47909976067605c'||
           p.model_generated!==true||!p.model_response_id||
           p.status!=='MODEL_ORIGINAL_EXECUTOR_CORRECTED_AWAITING_INDEPENDENT_RETEST'||
           p.candidate_sha256!==createHash('sha256').update(b).digest('hex')||
           p.original_job_completed!==false||p.github_provider_write_performed!==false)
           throw Error('ORIGINAL_SELF_CORRECTION_SOURCE_NOT_PROVEN');
          JS
          test "$(sha256sum src/reality-extensions/reality-original-maintenance-repair-proposal.mjs | cut -d' ' -f1)" = "6b82acd60baa9055bfc57a70f551bac44f783fc431814ad2555927eb50f5ca16"
          cp src/reality-extensions/reality-original-maintenance-repair-proposal.mjs owner-original-executor-corrected/
      - name: Independently retest corrected model code in a DIFFERENT secretless sandbox
        run: |
          set +e
          timeout 130s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -e REALITY_ORIGINAL_EXECUTOR_CANDIDATE=/work/owner-original-repair-executor/candidate.mjs \
            -v "${{ github.workspace }}/owner-original-executor-corrected:/work/owner-original-repair-executor:ro" \
            -v "${{ github.workspace }}/test:/work/test:ro" -w /work node:22-alpine \
            node --test test/reality-original-executor-autonomous-grader-v0.1.test.mjs \
            > owner-original-executor-corrected/independent-retest.txt 2>&1
          status=$?
          set -e
          tail -n 120 owner-original-executor-corrected/independent-retest.txt
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reality-original-executor-corrected-independent-proof
          path: owner-original-executor-corrected/
          retention-days: 14
