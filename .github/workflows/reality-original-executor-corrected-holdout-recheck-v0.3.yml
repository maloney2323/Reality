name: Reality Corrected Original Executor Frozen and Holdout Verification v0.3
on:
  push:
    branches:
      - feature/governed-autonomous-self-upgrading-v01-20261027
    paths:
      - '.github/workflows/reality-original-executor-corrected-holdout-recheck-v0.3.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-original-model-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 40762691706
          name: reality-original-executor-security-corrected-frozen-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Recompute actual model response, both frozen source bytes and governed package fingerprint
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const base='original-executor-security-corrected-package/';
          const proof=JSON.parse(readFileSync('model-security-corrected/generation-evidence.json','utf8'));
          const manifest=JSON.parse(readFileSync(base+'manifest.json','utf8'));
          const packageFile=JSON.parse(readFileSync(base+'package.json','utf8'));
          const sha=x=>createHash('sha256').update(x).digest('hex');
          const a=readFileSync(base+'reality-original-maintenance-repair-proposal.mjs','utf8');
          const b=readFileSync(base+'reality-original-maintenance-executor.mjs','utf8');
          const files=packageFile.files;
          const candidateHash=sha(JSON.stringify(files.map(f=>({path:f.path,content:f.content,mode:f.mode||'100644'}))));
          if(proof.original_work_id!=='work:24cda9611404e9bcb47909976067605c'||
             proof.model_generated!==true||!String(proof.model_response_id).startsWith('resp_')||
             proof.status!=='MODEL_ORIGINAL_EXECUTOR_CORRECTED_AWAITING_INDEPENDENT_RETEST'||
             proof.candidate_sha256!=='61df9fc02b2cc342b19fb61a82b961d773499628caf47b9b1647ea3675299d17'||
             manifest.governed_install_candidate_sha256!=='88d4bba7f2ddf0c7331ddfcc0621b4a13739326451cb53d41ad807c97bceb9b2'||
             candidateHash!==manifest.governed_install_candidate_sha256||
             sha(b)!==proof.candidate_sha256||
             sha(a)!=='6b82acd60baa9055bfc57a70f551bac44f783fc431814ad2555927eb50f5ca16'||
             files.length!==2||
             files[0].path!=='src/reality-extensions/reality-original-maintenance-repair-proposal.mjs'||
             files[1].path!=='src/reality-extensions/reality-original-maintenance-executor.mjs'||
             files[0].content!==a||files[1].content!==b||
             proof.original_job_completed!==false||manifest.owner_warrant_issued!==false||manifest.installed!==false)
           throw Error('REALITY_ORIGINAL_EXECUTOR_PACKAGE_MISMATCH');
          console.log(JSON.stringify({result:'MODEL_PACKAGE_SOURCE_IMMUTABLY_PINNED',
           model_response_id:proof.model_response_id,executor_source_sha256:proof.candidate_sha256,
           installable_package_fingerprint:candidateHash,work_id:proof.original_work_id,
           original_job_completed:false,warrant_issued:false,installed:false}));
          JS
          mkdir -p owner-original-repair-executor
          cp original-executor-security-corrected-package/reality-original-maintenance-executor.mjs owner-original-repair-executor/candidate.mjs
          cp original-executor-security-corrected-package/reality-original-maintenance-repair-proposal.mjs owner-original-repair-executor/
      - name: Run unchanged ten-case frozen acceptance in isolated secretless container
        run: |
          set +e
          timeout 140s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -e REALITY_ORIGINAL_EXECUTOR_CANDIDATE=/work/owner-original-repair-executor/candidate.mjs \
            -v "${{ github.workspace }}:/work:ro" -w /work node:22-alpine \
            node --test test/reality-original-executor-autonomous-grader-v0.1.test.mjs \
            > original-executor-security-corrected-package/independent-frozen-verification.txt 2>&1
          state=$?
          set -e
          grep -E '^# (tests|pass|fail)' original-executor-security-corrected-package/independent-frozen-verification.txt || true
          exit "$state"
      - name: Run all four independent security holdouts against SAME model bytes in networkless Docker
        run: |
          set +e
          timeout 140s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -e REALITY_EXECUTOR_HOLDOUT_PACKAGE=original-executor-security-corrected-package \
            -v "${{ github.workspace }}:/work:ro" -w /work node:22-alpine \
            node --test test/reality-original-executor-security-holdout-v0.1.test.mjs \
            > original-executor-security-corrected-package/independent-security-verification.txt 2>&1
          state=$?
          set -e
          grep -E '(ok [0-9]+ -|# (tests|pass|fail)|not ok )' original-executor-security-corrected-package/independent-security-verification.txt || true
          exit "$state"
      - name: Verification is not installation authority
        run: |
          echo 'MODEL_GENERATED_EXECUTOR_FROZEN_REGRESSION_AND_SECURITY_HOLDOUT_VERIFIED'
          echo 'EXACT_PACKAGE_VERIFIED_NOT_SIGNED'
          echo 'OWNER_WARRANT_ISSUED=false'
          echo 'INSTALL_AUTHORIZED=false'
          echo 'ORIGINAL_JOB_SETTLED=false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reality-original-executor-corrected-independent-holdout-proof
          path: original-executor-security-corrected-package/
          retention-days: 14
