name: Reality ORIGINAL Installed Executor Live Github Reconciliation v0.1
on:
  push:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
    paths:
      - '.github/workflows/reality-original-installed-executor-live-reconcile-v0.1.yml'
      - 'src/reality-extensions/reality-original-maintenance-executor.mjs'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  actual-installed-original-job-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reality installed executor independently reconciles original job against actual GitHub branch, issue and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          import {ORIGINAL_REPAIR_WORK,prepareOriginalMaintenanceRepair,executeOriginalMaintenanceRepair}
           from './src/reality-extensions/reality-original-maintenance-executor.mjs';
          const work='work:24cda9611404e9bcb47909976067605c';
          const branch='experiment/reality-live-durable-adversarial-20261025';
          const path='test/reality-personal-discovered-work-handoff-v0.1.test.js';
          const root='/repos/maloney2323/Reality';
          assert.equal(ORIGINAL_REPAIR_WORK,work);
          const headers={accept:'application/vnd.github+json',
           authorization:'Bearer '+process.env.GH_TOKEN,'x-github-api-version':'2022-11-28'};
          async function observe(path){
           const response=await fetch('https://api.github.com'+path,{headers,redirect:'error'});
           if(response.status!==200)throw Error('REAL_ORIGINAL_GITHUB_OBSERVATION_FAILED_'+response.status);
           return response.json();
          }
          const ref=await observe(root+'/git/ref/heads/'+branch);
          assert.equal(ref.ref,'refs/heads/'+branch);
          assert.match(ref.object.sha,/^[a-f0-9]{40}$/);
          const issue=await observe(root+'/issues/143');
          assert.equal(issue.number,143);
          assert.equal(issue.state,'open');
          assert.equal(issue.title,'Reality recurring work: repair repeated Reality Governed Execution Engine v0.1 failures');
          assert.equal(issue.html_url,'https://github.com/maloney2323/Reality/issues/143');
          const file=await observe(root+'/contents/'+path+'?ref='+ref.object.sha);
          assert.equal(file.type,'file');
          assert.equal(file.path,path);
          assert.equal(file.encoding,'base64');
          const bytes=Buffer.from(file.content.replace(/\s/g,''),'base64');
          const blob=createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
          assert.equal(file.sha,blob);
          const observed=new Map([
           [root+'/git/ref/heads/'+branch,ref],
           [root+'/issues/143',issue],
           [root+'/contents/'+path+'?ref='+ref.object.sha,file]
          ]);
          let reads=0,writes=0,grants=0;
          const get=async path=>{
           reads++;assert.ok(observed.has(path),'original executor attempted untrusted provider path');
           return observed.get(path);
          };
          const write=async()=>{writes++;throw Error('NO_OWNER_AUTHORITY_TO_WRITE_ORIGINAL_SOURCE')};
          const consumeVerifiedGrant=async()=>{grants++;throw Error('NO_OWNER_INSTALL_OR_RESUME_GRANT')};
          const prepared=await prepareOriginalMaintenanceRepair({get});
          assert.equal(prepared.state,'PREEXISTING_FIX_OBSERVED_NO_WRITE');
          assert.equal(prepared.model_upgrade_installed,false);
          const resumed=await executeOriginalMaintenanceRepair({
           session:{user_id:'11111111-1111-4111-8111-111111111111'},
           conversationId:'22222222-2222-4222-8222-222222222222',
           get,write,consumeVerifiedGrant,
          });
          assert.equal(resumed.status,'PREEXISTING_FIX_NOT_EXECUTED_BY_REALITY');
          assert.equal(resumed.repair_executed_by_reality,false);
          assert.equal(resumed.external_write_performed,false);
          assert.equal(resumed.original_job_completed,false);
          assert.equal(writes,0);assert.equal(grants,0);assert.equal(reads,6);
          const receipt={
           outcome:'ORIGINAL_JOB_HISTORICAL_FIX_RECONCILED_NOT_NEWLY_REPAIRED',
           original_work_id:work,installed_extension_present:true,
           installed_branch_head_sha:ref.object.sha,
           real_original_issue_number:issue.number,real_original_issue_state:issue.state,
           original_source_blob_sha:file.sha,real_github_reads:reads,
           real_github_writes:0,owner_grants_consumed:0,
           original_source_already_fixed_before_this_model_upgrade:true,
           runtime_capability_registered_in_owner_registry:false,
           original_job_completed:false,final_continuity_settlement:false,
          };
          writeFileSync('reality-original-installed-executor-live-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reality-original-installed-live-github-reconciliation
          path: reality-original-installed-executor-live-receipt.json
          retention-days: 30
