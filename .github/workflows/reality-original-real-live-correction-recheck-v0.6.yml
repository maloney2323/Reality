name: Reality Original Real-Live Model Correction Independent Recheck v0.6
on:
  push:
    branches:
      - feature/governed-autonomous-self-upgrading-v01-20261027
    paths:
      - '.github/workflows/reality-original-real-live-correction-recheck-v0.6.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-original-model-sandbox-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 40776339603
          name: reality-original-real-live-model-self-correction-verified
          github-token: ${{ github.token }}
          path: .
      - name: Independently pin EXACT Realty model response, frozen bytes and earlier real live red failure
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=JSON.parse(readFileSync('original-live-model-corrected/generation-evidence.json','utf8'));
          const b=readFileSync('original-live-model-corrected/candidate.mjs');
          const raw=readFileSync('original-live-red.txt','utf8');
          const sha=createHash('sha256').update(b).digest('hex');
          if(p.original_work_id!=='work:24cda9611404e9bcb47909976067605c'||
             p.model_generated!==true||
             p.model_response_id!=='resp_035645a615e57f6b006ae2702baa6887d0865bb1af5c6e501b'||
             sha!=='7ba3cc3273c2301c6902b6b3b3d6d0247e8b6abe0398467656e5e2ca93648128'||
             p.candidate_sha256!==sha||
             !raw.includes('# fail 2')||!raw.includes('actual GitHub REST issue has body text')||
             p.original_job_completed!==false||p.github_provider_write_performed!==false)
           throw Error('UNVERIFIED_REAL_LIVE_MODEL_CORRECTION_PROVENANCE');
          console.log(JSON.stringify({model_response_id:p.model_response_id,
           source_sha256:sha,real_previous_live_holdout_failures:2,
           owner_install_authorized:false,original_job_completed:false}));
          JS
          test "$(sha256sum src/reality-extensions/reality-original-maintenance-repair-proposal.mjs | cut -d' ' -f1)" = "6b82acd60baa9055bfc57a70f551bac44f783fc431814ad2555927eb50f5ca16"
          mkdir -p owner-original-repair-executor original-executor-security-corrected-package
          cp original-live-model-corrected/candidate.mjs owner-original-repair-executor/candidate.mjs
          cp src/reality-extensions/reality-original-maintenance-repair-proposal.mjs owner-original-repair-executor/
          cp original-live-model-corrected/candidate.mjs original-executor-security-corrected-package/reality-original-maintenance-executor.mjs
          cp src/reality-extensions/reality-original-maintenance-repair-proposal.mjs original-executor-security-corrected-package/
          chmod 644 owner-original-repair-executor/*.mjs original-executor-security-corrected-package/*.mjs
          node --check owner-original-repair-executor/candidate.mjs
      - name: Verify 10 frozen historical cases in no-network nonroot read-only Docker
        run: |
          set +e
          timeout 140s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -e REALITY_ORIGINAL_EXECUTOR_CANDIDATE=/work/owner-original-repair-executor/candidate.mjs \
            -v "${{ github.workspace }}:/work:ro" -w /work node:22-alpine \
            node --test test/reality-original-executor-autonomous-grader-v0.1.test.mjs \
            > original-live-model-corrected/independent-frozen-results.txt 2>&1
          s=$?
          set -e
          grep -E '(^# (tests|pass|fail)|^not ok )' original-live-model-corrected/independent-frozen-results.txt || true
          exit "$s"
      - name: Verify 4 original independent security holdout cases on SAME candidate
        run: |
          set +e
          timeout 140s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -e REALITY_EXECUTOR_HOLDOUT_PACKAGE=original-executor-security-corrected-package \
            -v "${{ github.workspace }}:/work:ro" -w /work node:22-alpine \
            node --test test/reality-original-executor-security-holdout-v0.1.test.mjs \
            > original-live-model-corrected/independent-security-results.txt 2>&1
          s=$?
          set -e
          grep -E '(^# (tests|pass|fail)|^not ok )' original-live-model-corrected/independent-security-results.txt || true
          exit "$s"
      - name: Verify 4 NEW original real issue-body API response cases on SAME source, secretless
        run: |
          set +e
          timeout 140s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 48 --memory 384m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            -e REALITY_ORIGINAL_EXECUTOR_CANDIDATE=/work/owner-original-repair-executor/candidate.mjs \
            -v "${{ github.workspace }}:/work:ro" -w /work node:22-alpine \
            node --test test/reality-original-executor-real-issue-body-holdout-v0.1.test.mjs \
            > original-live-model-corrected/independent-real-github-body-results.txt 2>&1
          s=$?
          set -e
          grep -E '(^# (tests|pass|fail)|^not ok )' original-live-model-corrected/independent-real-github-body-results.txt || true
          exit "$s"
      - name: Candidate independently verified but NOT installed
        run: |
          echo 'REAL_MODEL_SOURCE_INDEPENDENTLY_VERIFIED=true'
          echo 'REVIEWED_FROZEN_CASES=10'
          echo 'INDEPENDENT_SECURITY_HOLDOUT=4'
          echo 'NEW_REAL_GITHUB_BODY_HOLDOUT=4'
          echo 'ORIGINAL_MODEL_REPAIR_INSTALL=not-yet'
          echo 'ORIGINAL_JOB_SETTLED=false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reality-original-real-live-model-corrected-independent-18-case-proof
          path: original-live-model-corrected/
          retention-days: 30
