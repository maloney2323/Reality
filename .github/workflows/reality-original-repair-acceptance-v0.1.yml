name: Reality Original Repair Acceptance v0.1
on:
  push:
    branches:
      - feature/reality-original-work-acceptance-20261027
  pull_request:
    paths:
      - 'src/reality-original-job-acceptance-v0.1.js'
      - 'api/reality/personal-repair-acceptance.js'
      - 'test/reality-real-recovery-coordinator-v0.1.test.js'
      - '.github/workflows/reality-original-repair-acceptance-v0.1.yml'
permissions:
  contents: read
jobs:
  real-source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original source-root-cause and pending settlement
        run: node --test test/reality-real-recovery-coordinator-v0.1.test.js test/reality-recovery-v1-linkage.test.js
