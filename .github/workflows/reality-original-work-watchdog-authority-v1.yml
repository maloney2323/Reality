name: Reality original-work stall watchdog authority correction
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261119194000_watchdog_exact_original_authority_v1.sql'
      - 'test/reality-original-work-watchdog-authority-v1.test.js'
      - '.github/workflows/reality-original-work-watchdog-authority-v1.yml'
permissions:
  contents: read
jobs:
  independent-watchdog-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original-work authorization diagnosis never mislabels research or maintenance
        run: node --test test/reality-original-work-watchdog-authority-v1.test.js
