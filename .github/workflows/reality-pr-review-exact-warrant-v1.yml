name: Reality original PR review warrant and draft gate
on:
  pull_request:
    paths:
      - 'src/reality-governed-employee-shift-worker-v1.js'
      - 'supabase/migrations/20261119185000_pr_review_exact_original_warrant_v1.sql'
      - 'test/reality-pr-review-exact-warrant-v1.test.js'
      - '.github/workflows/reality-pr-review-exact-warrant-v1.yml'
permissions:
  contents: read
jobs:
  original-pr-warrant-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # TEST-ONLY: ensure the frozen case runs on unrepaired source, not PR merge.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify original authorization and complete provider source
        run: node --test test/reality-pr-review-exact-warrant-v1.test.js
