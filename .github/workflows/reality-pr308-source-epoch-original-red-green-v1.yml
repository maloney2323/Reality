name: Reality PR308 signed source epoch original RED GREEN proof
on:
  push:
    branches:
      - 'repair/maintenance-warrant-scope-handoff-20261119'
    paths:
      - '.github/workflows/reality-pr308-source-epoch-original-red-green-v1.yml'
      - 'test/reality-frozen-regressions/reality-pr308-source-epoch-double-read-v1.test.js'
      - 'src/reality-qualified-source-requalification-v1.js'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/reality-pr308-source-epoch-original-red-green-v1.yml'
      - 'test/reality-frozen-regressions/reality-pr308-source-epoch-double-read-v1.test.js'
      - 'src/reality-qualified-source-requalification-v1.js'
permissions:
  contents: read
concurrency:
  group: reality-pr308-original-source-epoch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-original-source-before-after:
    name: Original PR308 epoch mismatch historical RED corrected GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HISTORICAL: cfb7373b3103ee72164923cb999c234d192ba507
      FROZEN: test/reality-frozen-regressions/reality-pr308-source-epoch-double-read-v1.test.js
    steps:
      - name: Checkout exact repaired source with no retained write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Node test runner
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Freeze test SHA and verify historical source is the exact unpatched one
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "${HISTORICAL}^{commit}"
          test -f "$FROZEN"
          cp "$FROZEN" "$RUNNER_TEMP/pr308-frozen.test.js"
          sha256sum "$RUNNER_TEMP/pr308-frozen.test.js" |
            tee "$RUNNER_TEMP/pr308-frozen-sha256.txt"
          git show "${HISTORICAL}:src/reality-qualified-source-requalification-v1.js" |
            grep -Fq "let source;"
          if git show "${HISTORICAL}:src/reality-qualified-source-requalification-v1.js" |
             grep -Fq "first.provider_proof_sha256!==claim.changed_review_sha256"; then
            echo 'HISTORICAL_SOURCE_ALREADY_CONTAINS_REPAIR'; exit 1
          fi
          grep -Fq "first.provider_proof_sha256!==claim.changed_review_sha256"             src/reality-qualified-source-requalification-v1.js
      - name: Run immutable original source epoch regression on historical code (must fail for exact reason)
        run: |
          set -eu
          git checkout --detach "$HISTORICAL"
          mkdir -p test/reality-frozen-regressions
          cp "$RUNNER_TEMP/pr308-frozen.test.js" "$FROZEN"
          set +e
          node --test "$FROZEN" >"$RUNNER_TEMP/pr308-historical-original-red.tap" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/pr308-historical-original-red.tap"
          if test "$result" -eq 0; then
            echo HISTORICAL_SOURCE_UNEXPECTEDLY_GREEN; exit 1
          fi
          grep -Fq 'not ok 1 - PR308 frozen RED: changed signed source'             "$RUNNER_TEMP/pr308-historical-original-red.tap" || {
            echo 'HISTORICAL_FAILED_FOR_UNRELATED_REASON'; exit 1;
          }
          grep -Eq 'AssertionError|ERR_ASSERTION'             "$RUNNER_TEMP/pr308-historical-original-red.tap" || {
            echo 'HISTORICAL_RED_NOT_AN_INDEPENDENT_ASSERTION'; exit 1;
          }
          echo "EXPECTED_ORIGINAL_SOURCE_EPOCH_RED=$HISTORICAL"
          rm -f "$FROZEN"
      - name: Run the SAME frozen tests on the corrected source (must pass all)
        run: |
          set -eu
          git checkout --detach "$SOURCE_SHA"
          cmp "$RUNNER_TEMP/pr308-frozen.test.js" "$FROZEN"
          node --test "$FROZEN" 2>&1 |
            tee "$RUNNER_TEMP/pr308-corrected-green.tap"
          grep -q '^# pass 3$' "$RUNNER_TEMP/pr308-corrected-green.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/pr308-corrected-green.tap"
          node --test test/reality-qualified-source-change-requalification-v1.test.js             2>&1 | tee "$RUNNER_TEMP/pr308-existing-requalification-tests.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/pr308-existing-requalification-tests.tap"
          echo "EXPECTED_REPAIRED_SOURCE_EPOCH_GREEN=$SOURCE_SHA"
      - name: Preserve both signed CI observations for independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-pr308-original-source-epoch-red-green-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pr308-frozen-sha256.txt
            ${{ runner.temp }}/pr308-historical-original-red.tap
            ${{ runner.temp }}/pr308-corrected-green.tap
            ${{ runner.temp }}/pr308-existing-requalification-tests.tap
      - name: Never treat isolated regression as original-job settlement
        run: |
          echo 'EXACT_MAINTENANCE_SOURCE=https://github.com/maloney2323/Reality/pull/308'
          echo 'EXISTING_AUTHORIZED_SHIFT=ee80b4d8-0546-4269-9cfc-7bf6cb2b97ce'
          echo 'FROZEN_SOURCE_EPOCH_CODE_RED_GREEN_VERIFIED'
          echo 'NOT_AN_ORIGINAL_SIGNED_JOB_EXECUTION_RECEIPT'
          echo 'NOT_INSTALLATION_AUTHORITY'
          echo 'NOT_AN_ORIGINAL_JOB_FINAL_SETTLEMENT'
