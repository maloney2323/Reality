name: Reality Home Command Center — original readbacks preserved
on:
  pull_request:
    paths:
      - 'index.html'
      - 'reality-home-command-v1.js'
      - 'reality-home-command-v1.css'
      - 'reality-unified-shell-v1.js'
      - 'reality-unified-shell-v1.css'
      - 'reality-shift-conversation-v1.js'
      - 'reality-eight-hour-shift-plan-v1.js'
      - 'reality-value-verification-v1.js'
      - 'src/reality-private-chat-auth-v0.1.js'
      - 'vercel.json'
      - 'test/reality-unified-shell-v1.test.js'
      - 'test/reality-chat-session-continuity-v2.test.js'
      - 'reality-home-employee-brief-v1.js'
      - 'reality-chat-workspace-v1.js'
      - 'api/reality/personal-employee-roster.js'
      - 'api/reality/personal-chat.js'
      - 'src/reality-employee-shift-chat-context-v1.js'
      - 'src/reality-weekly-workload-insight-v1.js'
      - 'test/reality-weekly-workload-insight-v1.test.js'
      - 'test/reality-home-command-v1.test.js'
      - '.github/workflows/reality-premium-home-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-command-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check new Home presentation and existing source safety
        run: |
          node --check reality-home-command-v1.js
          node --check reality-unified-shell-v1.js
          node --test test/reality-unified-shell-v1.test.js
          node --test test/reality-chat-session-continuity-v2.test.js
          node --test test/reality-chat-premium-design1-v1.test.js
          node --test test/reality-home-command-v1.test.js
          node --test test/reality-weekly-workload-insight-v1.test.js
          node --test test/reality-next-week-employee-plan-v1.test.js
          node --test test/reality-chat-universe-cognitive-projection-v1.test.js
          node --test test/reality-home-live-employees-v1.test.js
          node --test test/reality-home-value-first-v1.test.js
          node --test test/reality-economic-evidence-dashboard-v1.test.js
          node --test test/reality-simple-customer-home-v1.test.js
          node --test test/reality-eight-hour-shift-plan-v1.test.js
