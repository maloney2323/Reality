name: Reality Universe — proactive operational Chat
on:
  push:
    branches: ['reality/**']
    paths:
      - 'api/reality/personal-chat-operational-update.js'
      - 'reality-chat-proactive-operational-v1.js'
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'supabase/migrations/20261118_proactive_owner_operational_chat_v25.sql'
      - 'index.html'
      - 'test/reality-proactive-operational-chat-v1.test.js'
      - '.github/workflows/reality-proactive-operational-chat-v1.yml'
  pull_request:
    types: [opened,reopened,synchronize]
    branches: ['reality/**']
    paths:
      - 'api/reality/personal-chat-operational-update.js'
      - 'reality-chat-proactive-operational-v1.js'
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'supabase/migrations/20261118_proactive_owner_operational_chat_v25.sql'
      - 'index.html'
      - 'test/reality-proactive-operational-chat-v1.test.js'
      - '.github/workflows/reality-proactive-operational-chat-v1.yml'
permissions:
  contents: read
jobs:
  prove-signed-owner-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prove owner-scoped proactive Chat events and existing safety gates
        shell: bash
        run: |
          set -euo pipefail
          node --check reality-chat-proactive-operational-v1.js
          node --check api/reality/personal-chat-operational-update.js
          node --test \
            test/reality-proactive-operational-chat-v1.test.js \
            test/reality-universe-chat-first-contact-v1.test.js \
            test/reality-universe-chat-first-contact-home-v1.test.js \
            test/reality-unified-chat-maintenance-continuation-v1.test.js \
            test/reality-maintenance-owner-chat-dialogue-v1.test.js \
            test/reality-chat-mobile-usable-v3.test.js
