name: Reality Production Control Plane v1.1

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reality-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERCEL_PRODUCTION_BRANCH: reality/canonical-migration-v01
  PRODUCTION_URL: https://reality-blond.vercel.app

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert checkout is the triggering commit
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${GITHUB_SHA}"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "DEPLOYMENT_GATE_FAILED: checkout=$ACTUAL expected=$EXPECTED"
            exit 1
          }

      - name: Run local production tests
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci --ignore-scripts
            else
              npm install --ignore-scripts --no-audit --no-fund
            fi
            npm test --if-present
          fi

      - name: Promote exact verified commit to Vercel production branch
        run: |
          set -euo pipefail
          git config user.name "Reality Production Control Plane"
          git config user.email "reality-production@users.noreply.github.com"
          git fetch origin "${VERCEL_PRODUCTION_BRANCH}" || true
          git push origin "${GITHUB_SHA}:refs/heads/${VERCEL_PRODUCTION_BRANCH}" --force-with-lease
          echo "PROMOTED_SHA=${GITHUB_SHA}"

      - name: Verify production is serving the promoted commit
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_SHA}"
          for i in $(seq 1 60); do
            HTTP="$(curl -sS -o /tmp/deployment-proof.json -w '%{http_code}' "${PRODUCTION_URL}/api/reality/deployment-proof")" || true
            echo "proof_http=$HTTP"
            if [ "$HTTP" = "200" ]; then
              cat /tmp/deployment-proof.json
              SERVING="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/deployment-proof.json","utf8")); process.stdout.write(x.commit_sha || "")')"
              echo "serving_sha=$SERVING"
              if [ "$SERVING" = "$EXPECTED" ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "DEPLOYMENT_GATE_FAILED: production did not independently attest commit ${EXPECTED}"
          exit 1

      - name: Emit deployment receipt
        if: always()
        run: |
          mkdir -p verification-receipt
          cat > verification-receipt/reality-production-receipt.json <<EOF
          {
            "schema": "reality-production-deployment-receipt-v1.1",
            "source_commit_sha": "${GITHUB_SHA}",
            "production_branch": "${VERCEL_PRODUCTION_BRANCH}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "repository": "${GITHUB_REPOSITORY}",
            "production_url": "${PRODUCTION_URL}",
            "verification": "production-endpoint-must-attest-exact-source-commit",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat verification-receipt/reality-production-receipt.json

      - name: Preserve deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-production-receipt-${{ github.run_id }}
          path: verification-receipt/
          if-no-files-found: ignore
