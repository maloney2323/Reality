name: Reality Production Control Plane v1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reality-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_5A3b0WG9IuvzyEUBw9tD9v8jcha8
  VERCEL_SCOPE: team_PorNAPmuRfcBHlWnYFf1a3T7
  PRODUCTION_URL: https://reality-blond.vercel.app

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assert checkout is the triggering commit
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${GITHUB_SHA}"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "DEPLOYMENT_GATE_FAILED: checkout=$ACTUAL expected=$EXPECTED"
            exit 1
          }

      - name: Run local production tests
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --ignore-scripts
            npm test --if-present
          fi

      - name: Require deployment authority
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || {
            echo "DEPLOYMENT_GATE_BLOCKED: GitHub secret VERCEL_TOKEN is not configured."
            echo "Reality will not claim deployment authority without an explicit deployment credential."
            exit 1
          }

      - name: Deploy exact commit to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          DEPLOYMENT_URL="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" --name reality)"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL"

      - name: Wait for deployment readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATE="$(vercel inspect "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" --json | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d).on("end",()=>{
                const x=JSON.parse(s);
                console.log(x.readyState || x.state || x.status || "");
              });
            ')"
            echo "deployment_state=$STATE"
            case "$STATE" in
              READY) exit 0 ;;
              ERROR|CANCELED|CANCELLED) exit 1 ;;
            esac
            sleep 5
          done
          echo "DEPLOYMENT_GATE_FAILED: deployment did not become READY"
          exit 1

      - name: Verify live production
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o /tmp/reality-response.txt -w '%{http_code}' "$DEPLOYMENT_URL")"
          echo "deployment_http=$HTTP"
          test "$HTTP" -ge 200
          test "$HTTP" -lt 500

          PROD_HTTP="$(curl -sS -o /tmp/reality-production-response.txt -w '%{http_code}' "$PRODUCTION_URL")"
          echo "production_http=$PROD_HTTP"
          test "$PROD_HTTP" -ge 200
          test "$PROD_HTTP" -lt 500

      - name: Emit deployment receipt
        if: always()
        run: |
          mkdir -p verification-receipt
          cat > verification-receipt/reality-production-receipt.json <<EOF
          {
            "schema": "reality-production-deployment-receipt-v1.0",
            "commit_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "repository": "${GITHUB_REPOSITORY}",
            "production_url": "${PRODUCTION_URL}",
            "deployment_url": "${{ steps.deploy.outputs.deployment_url || '' }}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat verification-receipt/reality-production-receipt.json

      - name: Preserve deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-production-receipt-${{ github.run_id }}
          path: verification-receipt/
          if-no-files-found: ignore
