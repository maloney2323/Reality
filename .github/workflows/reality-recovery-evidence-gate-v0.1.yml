name: Reality Original Work Recovery Evidence v0.1
on:
  push:
    branches:
      - feature/reality-recovery-evidence-gate-20261027
    paths:
      - 'src/reality-recovery-evidence-gate-v0.1.js'
      - 'api/reality/personal-recovery-evidence.js'
      - 'test/reality-recovery-evidence-gate-v0.1.test.js'
      - 'index.html'
      - '.github/workflows/reality-recovery-evidence-gate-v0.1.yml'
  pull_request:
    paths:
      - 'src/reality-recovery-evidence-gate-v0.1.js'
      - 'api/reality/personal-recovery-evidence.js'
      - 'test/reality-recovery-evidence-gate-v0.1.test.js'
      - 'index.html'
      - '.github/workflows/reality-recovery-evidence-gate-v0.1.yml'
permissions:
  contents: read
jobs:
  recovery-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-observe failure and later success without authorizing upgrade
        run: node --test test/reality-recovery-evidence-gate-v0.1.test.js test/reality-personal-unfinished-work-v0.1.test.js test/reality-personal-recovery-checkpoint-v0.1.test.js
