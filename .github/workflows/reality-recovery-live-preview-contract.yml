name: Reality Recovery Live Preview Contract
on:
  push:
    branches:
      - experiment/reality-live-durable-adversarial-20261025
    paths:
      - 'src/reality-personal-recovery-checkpoint-v0.1.js'
      - 'src/reality-autonomous-capability-loop-v1.0.js'
      - 'src/reality-autonomous-closure-orchestrator-v1.0.js'
      - 'test/reality-recovery-v1-linkage.test.js'
      - 'src/reality-recovery-evidence-gate-v0.1.js'
      - 'api/reality/personal-recovery-evidence.js'
      - 'test/reality-recovery-evidence-gate-v0.1.test.js'
      - 'src/reality-personal-unfinished-work-v0.1.js'
      - 'api/reality/personal-unfinished-work.js'
      - 'test/reality-personal-unfinished-work-v0.1.test.js'
      - 'api/reality/personal-recovery.js'
      - 'api/reality/personal-completion-reports.js'
      - 'test/reality-completion-report-v0.1.test.js'
      - 'test/reality-personal-recovery-checkpoint-v0.1.test.js'
      - 'index.html'
      - '.github/workflows/reality-recovery-live-preview-contract.yml'
  pull_request:
    paths:
      - 'src/reality-personal-recovery-checkpoint-v0.1.js'
      - 'src/reality-autonomous-capability-loop-v1.0.js'
      - 'src/reality-autonomous-closure-orchestrator-v1.0.js'
      - 'test/reality-recovery-v1-linkage.test.js'
      - 'src/reality-recovery-evidence-gate-v0.1.js'
      - 'api/reality/personal-recovery-evidence.js'
      - 'test/reality-recovery-evidence-gate-v0.1.test.js'
      - 'src/reality-personal-unfinished-work-v0.1.js'
      - 'api/reality/personal-unfinished-work.js'
      - 'test/reality-personal-unfinished-work-v0.1.test.js'
      - 'api/reality/personal-recovery.js'
      - 'api/reality/personal-completion-reports.js'
      - 'test/reality-completion-report-v0.1.test.js'
      - 'test/reality-personal-recovery-checkpoint-v0.1.test.js'
      - 'index.html'
      - '.github/workflows/reality-recovery-live-preview-contract.yml'
permissions:
  contents: read
jobs:
  recovery-checkpoint-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Non-authorizing recovery checkpoint, route and UI tests
        run: node --test test/reality-personal-recovery-checkpoint-v0.1.test.js test/reality-completion-report-v0.1.test.js test/reality-personal-unfinished-work-v0.1.test.js test/reality-recovery-evidence-gate-v0.1.test.js test/reality-recovery-v1-linkage.test.js
