name: Reality Recovery v1 Contract
on:
  pull_request:
    paths:
      - 'src/reality-autonomous-capability-loop-v1.0.js'
      - 'src/reality-autonomous-closure-orchestrator-v1.0.js'
      - 'src/reality-personal-recovery-checkpoint-v0.1.js'
      - 'api/reality/personal-recovery.js'
      - 'test/reality-personal-recovery-checkpoint-v0.1.test.js'
      - 'test/reality-recovery-v1-linkage.test.js'
      - 'test/reality-full-loop-sandbox-proof-v0.1.test.js'
      - '.github/workflows/reality-recovery-v1-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-work recovery contract + existing full-loop sandbox regression
        run: node --test test/reality-recovery-v1-linkage.test.js test/reality-full-loop-sandbox-proof-v0.1.test.js test/reality-personal-recovery-checkpoint-v0.1.test.js
