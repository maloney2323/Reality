    paths:
      - 'api/reality/governed-employee-shift-worker.js'
      - 'src/reality-signed-maintenance-source-requalification-executor-v1.js'
      - 'src/reality-signed-maintenance-case-ci-executor-v1.js'
      - 'src/reality-signed-maintenance-repair-handoff-v1.js'
