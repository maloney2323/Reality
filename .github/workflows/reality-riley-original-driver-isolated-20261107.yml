on:
  push:
    branches:
      - fix/reality-governed-riley-original-driver-20261107
    paths:
      - src/reality-governed-employee-shift-worker-v1.js
      - src/reality-one-openai-combined-role-handoff-v1.js
      - scripts/reality-prove-one-openai-combined-role-v1.mjs
      - supabase/migrations/20261107_combined_employee_role_readback_v1.sql
      - supabase/migrations/20261107_riley_live_activity_model_error_readback_v1.sql
      - test/reality-riley-live-activity-visibility-v1.test.js
      - api/reality/governed-employee-shift-worker.js
