      - test/reality-riley-completion-based-shift-v1.test.js
      - test/reality-riley-preview-original-wake-v1.test.js
      - src/reality-riley-multi-job-shift-controller-v1.js
      - src/reality-riley-category-backlog-bridge-v1.js
      - src/reality-riley-taylor-combined-work-orders-v1.js
      - api/reality/personal-governed-employee-shift.js
      - test/reality-riley-taylor-combined-work-orders-v1.test.js
      - test/reality-chat-simple-v1.test.js
      - test/reality-full-shift-owner-control-and-recovery-v1.test.js
      - api/reality/personal-riley-existing-backlog.js
      - test/reality-riley-category-backlog-bridge-v1.test.js
      - src/reality-governed-shift-boundary-v1.js
      - src/reality-riley-authorized-pr-review-job-v1.js
      - supabase/migrations/20261107_riley_authorized_pr_review_original_v1.sql
      - test/reality-riley-authorized-pr-review-job-v1.test.js
      - test/reality-riley-service-original-runtime-v1.test.js
      - test/reality-riley-full-execution-path-v1.test.js
      - src/reality-first-shift-economic-scorecard-v1.js
      - src/reality-single-model-role-work-router-v1.js
      - src/reality-role-workforce-savings-scenario-v1.js
      - src/reality-role-workforce-evidence-v1.js
      - test/reality-role-workforce-evidence-v1.test.js
      - api/reality/personal-workforce-savings-scenario.js
      - api/reality/personal-employee-roster.js
      - reality-chat-simple.html
      - reality-owner-chat-shift-command-v1.js
      - src/reality-employee-shift-chat-context-v1.js
      - src/reality-model-gateway-v0.1.js
      - api/reality/personal-chat.js
      - test/reality-owner-chat-shift-command-v1.test.js
      - test/reality-signed-in-chat-no-duplicate-approval-v1.test.js
      - test/reality-riley-source-work-chat-v1.test.js
      - index.html
      - test/reality-role-workforce-savings-scenario-v1.test.js
      - test/reality-single-openai-role-and-staffing-ui-v1.test.js
      - test/reality-first-shift-economic-scorecard-v1.test.js
      - test/reality-riley-trusted-original-driver-bridge-v1.test.js
      - src/reality-universal-governed-recovery-handoff-v1.js
      - src/reality-governed-late-bound-tool-adapter-v1.js
      - src/reality-governed-tool-session-v1.js
      - scripts/reality-prove-live-tool-delivery-v1.mjs
      - scripts/reality-prove-real-source-openai-governance-v1.mjs
