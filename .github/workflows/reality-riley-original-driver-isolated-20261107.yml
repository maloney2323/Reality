name: Riley isolated original-job driver regression
on:
  push:
    branches:
      - fix/reality-governed-riley-original-driver-20261107
    paths:
      - src/reality-governed-employee-shift-worker-v1.js
      - test/reality-riley-original-driver-security-v1.test.js
      - test/reality-frozen-regressions/riley-live-original-shift-dispatch.test.js
      - .github/workflows/reality-riley-original-driver-isolated-20261107.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing worker and exact original handoff
        run: node --test test/reality-frozen-regressions/riley-live-original-shift-dispatch.test.js test/reality-riley-original-driver-security-v1.test.js test/reality-riley-existing-multi-job-wake-v1.test.js test/reality-riley-multi-job-and-self-audit-v1.test.js test/reality-governed-employee-shift-v1.test.js
      - name: Full top-level code regression
        run: npm test
