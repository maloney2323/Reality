name: Reality secret-preserving GitHub wake relay contract
on:
  push:
    branches:
      - feature/reality-secret-preserving-github-wake-relay-20261103
    paths:
      - 'api/reality/governed-wake-relay.js'
      - 'test/reality-governed-production-wake-relay-v1.test.js'
      - '.github/workflows/reality-secret-preserving-wake-relay-v1.yml'
  pull_request:
    paths:
      - 'api/reality/governed-wake-relay.js'
      - 'test/reality-governed-production-wake-relay-v1.test.js'
      - '.github/workflows/reality-secret-preserving-wake-relay-v1.yml'
permissions:
  contents: read
jobs:
  no-authority-relay-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Authenticate no-run and exact preview-only delivery scope
        run: |
          node --check api/reality/governed-wake-relay.js
          node --test test/reality-governed-production-wake-relay-v1.test.js
