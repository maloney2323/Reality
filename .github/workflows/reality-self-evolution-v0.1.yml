name: Reality Self-Evolution v0.1

on:
  push:
    branches:
      - universe-self-evolution-v0.1
    paths:
      - 'src/reality-self-evolution-v0.1.js'
      - 'test/run-reality-self-evolution-v0.1.mjs'
      - '.github/workflows/reality-self-evolution-v0.1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/reality-self-evolution-v0.1.js'
      - 'test/run-reality-self-evolution-v0.1.mjs'
      - '.github/workflows/reality-self-evolution-v0.1.yml'

jobs:
  self-evolution-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-default-type=module test/run-reality-self-evolution-v0.1.mjs
