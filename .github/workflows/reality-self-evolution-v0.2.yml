name: Reality Self-Evolution v0.2
on:
  push:
    branches: [universe-self-evolution-v0.2]
    paths: ['src/reality-*.js','test/run-reality-self-directed-selection-v0.2.mjs','test/run-reality-anti-gaming-v0.2.mjs','test/run-reality-promotion-safety-v0.2.mjs','test/run-reality-rollback-v0.2.mjs','.github/workflows/reality-self-evolution-v0.2.yml']
  pull_request:
    branches: [main]
jobs:
  self-directed-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --experimental-default-type=module test/run-reality-self-directed-selection-v0.2.mjs
      - run: node --experimental-default-type=module test/run-reality-anti-gaming-v0.2.mjs
      - run: node --experimental-default-type=module test/run-reality-promotion-safety-v0.2.mjs
      - run: node --experimental-default-type=module test/run-reality-rollback-v0.2.mjs
