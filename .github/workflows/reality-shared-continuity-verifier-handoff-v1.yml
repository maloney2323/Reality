name: Reality shared Continuity and independent verifier handoff acceptance
on:
  push:
    branches:
      - feature/final-loop-governed-qualification-handoff-20261123
    paths:
      - 'src/reality-final-loop-*.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'api/reality/personal-time-horizon.js'
      - 'api/reality/personal-chat.js'
      - 'test/reality-final-loop-*.test.js'
      - 'test/reality-frozen-regressions/reality-final-loop-*.test.js'
      - 'reality-final-loop-recovery-case-specs/**'
      - 'scripts/reality-final-loop-technical-frozen-case-ci-v1.mjs'
      - 'supabase/migrations/20261124005000_final_loop_shared_continuity_verifier_guard_v1.sql'
      - 'supabase/migrations/20261124012000_final_loop_continuity_first_signal_worldline_guard_v1.sql'
      - 'supabase/migrations/20261124013500_final_loop_original_source_identity_guard_v1.sql'
      - 'supabase/migrations/20261124015100_final_loop_shift_genesis_root_partition_v1.sql'
      - 'supabase/migrations/20261124015200_final_loop_independent_parent_universe_return_v1.sql'
      - 'supabase/migrations/20261124015300_final_loop_cross_worldline_return_shared_guard_v1.sql'
      - 'supabase/migrations/20261124015400_final_loop_evidence_checkpoint_atomic_resume_rebind_v1.sql'
      - 'supabase/migrations/20261124033000_final_loop_proof_carrying_recovery_ledger_v1.sql'
      - 'test/reality-final-loop-proof-recovery-ledger-smoke-v1.sql'
      - 'src/reality-governed-shift-boundary-v1.js'
      - '.github/workflows/reality-shared-continuity-verifier-handoff-v1.yml'
  pull_request:
    paths:
      - 'src/reality-final-loop-*.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'api/reality/personal-time-horizon.js'
      - 'api/reality/personal-chat.js'
      - 'test/reality-final-loop-*.test.js'
      - 'test/reality-frozen-regressions/reality-final-loop-*.test.js'
      - 'reality-final-loop-recovery-case-specs/**'
      - 'scripts/reality-final-loop-technical-frozen-case-ci-v1.mjs'
      - 'supabase/migrations/20261124005000_final_loop_shared_continuity_verifier_guard_v1.sql'
      - 'supabase/migrations/20261124012000_final_loop_continuity_first_signal_worldline_guard_v1.sql'
      - 'supabase/migrations/20261124013500_final_loop_original_source_identity_guard_v1.sql'
      - 'supabase/migrations/20261124015100_final_loop_shift_genesis_root_partition_v1.sql'
      - 'supabase/migrations/20261124015200_final_loop_independent_parent_universe_return_v1.sql'
      - 'supabase/migrations/20261124015300_final_loop_cross_worldline_return_shared_guard_v1.sql'
      - 'supabase/migrations/20261124015400_final_loop_evidence_checkpoint_atomic_resume_rebind_v1.sql'
      - 'supabase/migrations/20261124033000_final_loop_proof_carrying_recovery_ledger_v1.sql'
      - 'test/reality-final-loop-proof-recovery-ledger-smoke-v1.sql'
      - 'src/reality-governed-shift-boundary-v1.js'
      - '.github/workflows/reality-shared-continuity-verifier-handoff-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-cross-layer-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Parse signed worker and continuity projections
        run: |
          node --check api/reality/governed-employee-shift-worker.js
          node --check api/reality/personal-time-horizon.js
          node --check api/reality/personal-chat.js
          node --check src/reality-final-loop-signed-worker-bridge-v1.js
          node --check src/reality-final-loop-universe-feedback-v1.js
          node --check src/reality-final-loop-executive-brief-v1.js
      - name: Verify source identity, Continuity head, verifier and Universe fences
        run: |
          node --test test/reality-final-loop-signed-worker-bridge-v1.test.js
          node --test test/reality-final-loop-shared-owner-packet-v1.test.js
          node --test test/reality-final-loop-whole-cycle-acceptance-v1.test.js
          node --test test/reality-final-loop-proof-carrying-recovery-v1.test.js
          node --test test/reality-final-loop-pr307-recovery-harness-v1.test.js
          node --test test/reality-final-loop-signed-proof-recovery-v1.test.js
          node --test test/reality-final-loop-existing-case-ci-bridge-v1.test.js
          node --test test/reality-final-loop-blocker-liveness-v1.test.js
          node --test test/reality-final-loop-technical-ci-evidence-verifier-v1.test.js
          node --test test/reality-final-loop-staged-plan-action-router-v1.test.js
          node --test test/reality-final-loop-universe-feedback-v1.test.js
          node --test test/reality-final-loop-executive-brief-v1.test.js

      - name: Execute genuine historical RED and corrected GREEN for source-bound technical blocker
        env:
          GITHUB_ACTIONS: "true"
        run: |
          node --check scripts/reality-final-loop-technical-frozen-case-ci-v1.mjs
          node scripts/reality-final-loop-technical-frozen-case-ci-v1.mjs reality-final-loop-recovery-case-specs/pr307-uncertain-provider-technical-recovery-v1.json
      - name: Preserve case-specific RED and GREEN proof as CI artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reality-final-loop-technical-recovery-frozen-red-green
          path: artifact/reality-final-loop-technical-frozen-case-*.json
          if-no-files-found: error
          retention-days: 14


  prove-recovery-ledger-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: recovery-smoke-only
          POSTGRES_DB: reality_recovery_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate service-only proof recovery migration in ephemeral PostgreSQL 17
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: recovery-smoke-only
          PGDATABASE: reality_recovery_smoke
        run: |
          psql -v ON_ERROR_STOP=1 -f test/reality-final-loop-proof-recovery-ledger-smoke-v1.sql
