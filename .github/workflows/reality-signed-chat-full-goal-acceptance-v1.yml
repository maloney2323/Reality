name: Reality signed Chat original full-goal functional acceptance
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['repair/**', 'reality/**']
    paths: ['src/**', 'api/reality/**', 'evidence/reality-chat-recovery/**']
  push:
    branches: ['reality/chat-recovery/**', 'repair/**', 'reality/**']
    paths: ['src/**', 'api/reality/**', 'evidence/reality-chat-recovery/**']
permissions:
  contents: read
jobs:
  independent-chat-full-goal:
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'reality/chat-recovery/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate or installed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Prepare isolated Node runtime
        run: docker pull node:22.14.0-bookworm-slim
      - name: Independently execute full-goal functional contract without secrets or network
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 1g --cpus 2 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,size=64m --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" -w /work node:22.14.0-bookworm-slim node --test test/reality-signed-chat-full-goal-functional-v1.test.js test/reality-signed-chat-recovery-claim-to-quarantine-v1.test.js test/reality-signed-chat-recovery-spec-target-review-v1.test.js test/reality-signed-chat-original-goal-gap-continuation-v1.test.js test/reality-generalized-original-install-review-v1.test.js test/reality-signed-chat-full-goal-adapter-v1.test.js
      - name: Confirm acceptance grants no installation or completion authority
        run: echo 'FUNCTIONAL_ACCEPTANCE_ONLY; NO_OWNER_APPROVAL; NO_LIVE_SETTLEMENT'
