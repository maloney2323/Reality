name: Reality signed blocker to existing capability quarantine contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/*signed_chat_gap_existing_capability_queue_v1.sql'
      - 'src/reality-chat-new-development-worker-v1.js'
      - 'src/reality-chat-recovery-quarantine-publisher-v1.js'
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'supabase/functions/reality-chat-recovery-quarantine-broker-v1/index.ts'
      - 'test/reality-signed-chat-recovery-claim-to-quarantine-v1.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-claim-quarantine-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --check api/reality/governed-employee-shift-worker.js
      - run: node --check src/reality-chat-new-development-worker-v1.js
      - run: node --check src/reality-chat-recovery-quarantine-publisher-v1.js
      - run: node --test test/reality-signed-chat-recovery-claim-to-quarantine-v1.test.js test/reality-signed-chat-original-goal-gap-continuation-v1.test.js
