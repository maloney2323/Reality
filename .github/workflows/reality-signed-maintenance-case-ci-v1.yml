name: Reality signed maintenance case CI diagnostic
on:
  push:
    branches: ['repair/maintenance-warrant-scope-handoff-20261119']
    paths:
      - 'reality-maintenance-ci-triggers/**'
      - 'scripts/reality-maintenance-signed-case-ci-runner-v1.mjs'
      - 'test/reality-maintenance-case-ci-broker-contract-v1.test.js'
      - '.github/workflows/reality-signed-maintenance-case-ci-v1.yml'
permissions:
  contents: read
concurrency:
  group: reality-maintenance-case-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run-signed-case-ci-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out exact isolated maintenance branch without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use independently provisioned Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate signed broker and no fabricated CI RED
        run: |
          set -euo pipefail
          node --check scripts/reality-maintenance-signed-case-ci-runner-v1.mjs
          node --test test/reality-maintenance-case-ci-broker-contract-v1.test.js
      - name: Run owner-warranted source diagnostics on exact new GitHub trigger
        run: node scripts/reality-maintenance-signed-case-ci-runner-v1.mjs
      - name: Preserve only execution diagnostics, never an owner repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-maintenance-case-ci-diagnostic-${{ github.run_id }}
          path: artifact/maintenance-case-ci-diagnostic.json
          if-no-files-found: ignore
