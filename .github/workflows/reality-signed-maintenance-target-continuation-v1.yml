name: Reality signed maintenance artifact-to-shift continuation proof
on:
  pull_request:
    paths:
      - 'src/reality-signed-maintenance-verified-artifact-handoff-v1.js'
      - 'api/reality/governed-employee-shift-worker.js'
      - 'supabase/migrations/20261120202000_signed_maintenance_artifact_install_target_review_v1.sql'
      - 'test/reality-signed-maintenance-install-target-review-v1.test.js'
      - 'src/reality-governed-continuity-evidence-classifier-v1.js'
      - 'test/reality-governed-continuity-evidence-classifier-v1.test.js'
      - 'reality-chat-maintenance-continuation-v1.js'
      - '.github/workflows/reality-signed-maintenance-target-continuation-v1.yml'
      - 'src/reality-signed-maintenance-continuity-enforcement-v1.js'
      - 'src/reality-governed-auto-trigger-v1.0.js'
      - 'src/reality-signed-maintenance-original-return-handoff-v1.js'
      - 'test/reality-signed-maintenance-original-return-handoff-v1.test.js'
      - 'test/reality-signed-maintenance-governed-auto-trigger-v1.test.js'
      - 'test/reality-signed-maintenance-continuity-enforcement-v1.test.js'
      - 'supabase/migrations/20261120222500_signed_maintenance_postinstall_universe_readback_v1.sql'
      - 'src/reality-signed-maintenance-approved-install-bridge-v1.js'
      - 'src/reality-signed-maintenance-postinstall-verification-bridge-v1.js'
      - 'api/reality/signed-maintenance-exact-install-approval.js'
      - 'api/reality/personal-governed-employee-shift.js'
      - 'supabase/functions/reality-governed-general-original-installer-v1/**'
      - 'supabase/functions/reality-governed-general-original-postinstall-verifier-v1/**'
      - 'supabase/migrations/20261120214500_signed_existing_maintenance_exact_owner_install_v1.sql'
      - 'supabase/migrations/20261120215000_signed_existing_maintenance_independent_postinstall_v1.sql'
      - 'supabase/migrations/20261120215200_signed_install_continue_next_maintenance_v2.sql'
      - 'supabase/migrations/20261120215300_signed_owner_next_ready_repair_priority_v3.sql'
      - 'test/reality-signed-maintenance-exact-full-loop-v1.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-owner-shift-target-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact frozen repair target and original-shift continuation boundary
        run: |
          set -euo pipefail
          node --check src/reality-signed-maintenance-verified-artifact-handoff-v1.js
          node --check api/reality/governed-employee-shift-worker.js
          node --check src/reality-governed-continuity-evidence-classifier-v1.js
          node --check reality-chat-maintenance-continuation-v1.js
          node --check src/reality-signed-maintenance-continuity-enforcement-v1.js
          node --check src/reality-governed-auto-trigger-v1.0.js
          node --check src/reality-signed-maintenance-approved-install-bridge-v1.js
          node --check src/reality-signed-maintenance-postinstall-verification-bridge-v1.js
          node --check api/reality/signed-maintenance-exact-install-approval.js
          node --check api/reality/personal-governed-employee-shift.js
          node --test test/reality-signed-maintenance-install-target-review-v1.test.js
          node --test test/reality-governed-continuity-evidence-classifier-v1.test.js
          node --test test/reality-unified-chat-maintenance-continuation-v1.test.js
          node --test test/reality-signed-maintenance-exact-full-loop-v1.test.js
          node --test test/reality-signed-maintenance-continuity-enforcement-v1.test.js
          node --test test/reality-signed-maintenance-governed-auto-trigger-v1.test.js
          node --check src/reality-signed-maintenance-original-return-handoff-v1.js
          node --test test/reality-signed-maintenance-original-return-handoff-v1.test.js
          node --test test/reality-signed-maintenance-verified-artifact-handoff-v1.test.js
          node --test test/reality-signed-maintenance-original-lineage-boundary-v1.test.js
