name: Reality Spine Live Model Output Continuity v0.2
on:
  push:
    branches:
      - foundation/continuous-integrity-spine-live-model-output-v02-20261022
  pull_request:
    paths:
      - src/reality-model-output-integrity-v0.1.js
      - src/reality-live-intelligence-orchestration-v0.1.js
      - src/reality-continuous-integrity-spine-v0.1.js
      - api/reality/intelligence.js
      - test/reality-conversation-drift-spine-v0.3.test.js
      - test/reality-model-output-integrity-v0.1.test.js
      - test/reality-live-model-output-integrity-v0.1.test.js
      - index.html
      - .github/workflows/reality-spine-live-model-integrity-v0.2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Model output to Continuity Spine contract
        run: |
          node --test test/reality-model-output-integrity-v0.1.test.js test/reality-conversation-drift-spine-v0.3.test.js test/reality-continuous-integrity-spine-v0.1.test.js test/reality-epistemic-difference-detector-v0.1.test.js
      - name: Live orchestration and receipt regression
        run: |
          node --test test/reality-live-intelligence-orchestration-v0.1.test.js test/reality-live-epistemic-diagnostics-v0.1.test.js test/reality-live-model-output-integrity-v0.1.test.js test/reality-impact-ui-v0.1.test.js
      - name: Interpretation and authority regressions
        run: |
          node --test test/reality-signal-interpretation-v0.2.test.js test/reality-governed-execution-engine-v0.1.test.js
      - name: Benchmark disclosure
        run: |
          echo "Source-level synthetic checks only; no independent semantic drift accuracy measured."
          echo "No live customer ROI, complete coverage, or 100-turn drift escape performance proven."
