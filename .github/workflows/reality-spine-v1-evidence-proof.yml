name: Reality Spine V1 Factual Provenance and Completion Regression
on:
  push:
    branches:
      - feature/spine-v1-source-completion-20261023
  pull_request:
    paths:
      - src/reality-evidence-boundary-v1.0.js
      - src/reality-intelligence-spine-v1.0.js
      - src/reality-native-judge-v1.0.js
      - src/reality-live-intelligence-orchestration-v0.1.js
      - src/reality-cognitive-runtime-v1.0.js
      - src/reality-model-gateway-v0.1.js
      - test/reality-evidence-boundary-v1.0.test.js
      - .github/workflows/reality-spine-v1-evidence-proof.yml
permissions:
  contents: read
jobs:
  native-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/reality-evidence-boundary-v1.0.js
          node --check src/reality-intelligence-spine-v1.0.js
          node --check src/reality-model-gateway-v0.1.js
          node --check src/reality-cognitive-runtime-v1.0.js
          node --check src/reality-live-intelligence-orchestration-v0.1.js
          node --check test/run-workers-comp-native-12-v1.mjs
      - name: Real OpenAI answer regression and native judge
        run: node --test test/reality-evidence-boundary-v1.0.test.js test/reality-intelligence-spine-v1.0.test.js test/reality-consequential-trust-native-judge-v1.test.js
      - name: Existing live intelligence orchestration and gateway regressions
        run: node --test test/reality-live-intelligence-orchestration-v0.1.test.js test/reality-model-gateway-v0.1.test.js
      - name: Truthfulness disclosure
        run: echo 'Offline checks prove specified bounded detection, not comprehensive semantic hallucination recall or production deployment.'
