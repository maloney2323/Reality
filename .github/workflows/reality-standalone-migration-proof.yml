name: Reality Standalone Migration Proof
on:
  push:
    branches:
      - migration/vercel-independent-chat-proof-20261022
  pull_request:
    paths:
      - src/reality-standalone-auth-v0.1.js
      - src/reality-standalone-chat-v0.1.js
      - src/reality-live-intelligence-orchestration-v0.1.js
      - api/reality/standalone-chat.js
      - api/reality/standalone-config.js
      - standalone.html
      - test/reality-standalone-chat-v0.1.test.js
      - .github/workflows/reality-standalone-migration-proof.yml
permissions:
  contents: read
jobs:
  no-cost-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static import and syntax gate
        run: |
          node --check src/reality-standalone-auth-v0.1.js
          node --check src/reality-standalone-chat-v0.1.js
          node --check api/reality/standalone-chat.js
          node --check api/reality/standalone-config.js
      - name: Independent Auth and owner-root continuity
        run: node --test test/reality-standalone-chat-v0.1.test.js
      - name: Existing live cognition and Integrity Spine regressions
        run: |
          node --test test/reality-live-model-output-integrity-v0.1.test.js test/reality-conversation-drift-spine-v0.3.test.js test/reality-trajectory-replay-continuity-v0.4.test.js
      - name: Proven limitations
        run: |
          echo "Auth and DB are mocked. No real Supabase customer account was accessed."
          echo "Real Base44 history not migrated. No live paid model call."
          echo "Only draft source. Not a customer-facing or production release."
