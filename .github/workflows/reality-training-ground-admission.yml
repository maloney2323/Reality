name: Reality Training Ground Admission

on:
  pull_request:
    paths:
      - 'src/reality-gsi-training-ground-v0.1.js'
      - 'src/reality-gsi-three-arm-admission-v0.1.js'
      - 'src/reality-owner-consent-boundary-v0.1.js'
      - 'test/reality-gsi-training-ground-v0.1.test.js'
      - 'test/reality-gsi-training-ground-v1.0.test.js'
      - 'test/reality-gsi-three-arm-admission.test.js'
      - '.github/workflows/reality-training-ground-admission.yml'
  workflow_dispatch:

jobs:
  training-ground-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Show Node runtime
        run: node --version
      - name: Enforce both historic suites and independent A/B/C admission
        run: node --test test/reality-gsi-training-ground-v0.1.test.js test/reality-gsi-training-ground-v1.0.test.js test/reality-gsi-three-arm-admission.test.js
