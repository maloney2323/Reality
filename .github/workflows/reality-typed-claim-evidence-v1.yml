name: Reality Spine V1 Generic Claim Evidence Contract
on:
  push:
    branches:
      - feature/spine-v1-generic-claim-evidence-20261023
  pull_request:
    paths:
      - src/reality-typed-claim-evidence-v1.0.js
      - src/reality-intelligence-spine-v1.0.js
      - src/reality-native-judge-v1.0.js
      - src/reality-live-intelligence-orchestration-v0.1.js
      - test/reality-typed-claim-evidence-v1.0.test.js
      - .github/workflows/reality-typed-claim-evidence-v1.yml
permissions:
  contents: read
jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generic source and model syntax
        run: |
          node --check src/reality-typed-claim-evidence-v1.0.js
          node --check src/reality-intelligence-spine-v1.0.js
          node --check src/reality-native-judge-v1.0.js
          node --check src/reality-live-intelligence-orchestration-v0.1.js
      - name: Source-bound WC, inventory, provenance and native judge contracts
        run: node --test test/reality-typed-claim-evidence-v1.0.test.js test/reality-intelligence-spine-v1.0.test.js test/reality-evidence-boundary-v1.0.test.js
      - name: Existing orchestration plus authenticated causal readback
        run: node --test test/reality-live-intelligence-orchestration-v0.1.test.js test/reality-causal-turn-commit-v0.1.test.js
      - name: Disclosure
        run: |
          echo 'This CI verifies explicit typed claim evidence only.'
          echo 'No general semantic extraction, live provider evaluation, model accuracy, or automatic business action is proven.'
