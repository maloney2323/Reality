name: Reality Universe — Chat-first business onboarding
on:
  push:
    branches: ['reality/**']
    paths:
      - 'api/reality/personal-chat-first-contact.js'
      - 'api/reality/personal-chat.js'
      - 'reality-chat-first-contact-v1.js'
      - 'index.html'
      - 'reality-unified-shell-v1.js'
      - 'vercel.json'
      - 'src/reality-governed-shift-boundary-v1.js'
      - 'supabase/migrations/20261118_owner_first_proactive_business_chat_v23.sql'
      - 'test/reality-universe-chat-first-contact-home-v1.test.js'
      - '.github/workflows/reality-universe-chat-first-contact-home-v1.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['reality/**']
permissions:
  contents: read
jobs:
  source-bound-chat-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prove first-contact owner scope, zero duplicates and intact existing Chat
        run: |
          set -euo pipefail
          node --check reality-chat-first-contact-v1.js
          node --check api/reality/personal-chat-first-contact.js
          node --check api/reality/personal-chat.js
          node --test \
            test/reality-universe-chat-first-contact-home-v1.test.js \
            test/reality-chat-mobile-usable-v3.test.js \
            test/reality-unified-chat-maintenance-continuation-v1.test.js \
            test/reality-owner-maintenance-exact-continuation-v1.test.js \
            test/reality-chat-workspace-v1.test.js \
            test/reality-chat-fullscreen-v2.test.js
