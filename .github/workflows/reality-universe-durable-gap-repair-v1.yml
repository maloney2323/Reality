name: Reality Universe Durable Gap and Sandbox Repair Proof
on:
  push:
    branches:
      - feature/universe-ignorance-durable-repair-v1-20261023
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  universe-gap-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Source and contract syntax
        run: |
          node --check src/reality-universe-ignorance-durable-reconciliation-v1.0.js
          node --check src/reality-sandbox-repair-proposal-v1.0.js
          node --check scripts/replay-construction-25-capability-gaps-v1.mjs
      - name: Boundary regression and repair proposal tests
        run: |
          node --test \
            test/reality-universe-ignorance-durable-reconciliation-v1.0.test.js \
            test/reality-sandbox-repair-proposal-v1.0.test.js \
            test/reality-universe-ignorance-manifest-v1.0.test.js \
            test/reality-universe-persistence-contract-v1.0.test.js \
            test/reality-trusted-observation-admission-v0.1.test.js \
            test/reality-typed-claim-evidence-v1.0.test.js \
            test/reality-intelligence-spine-v1.0.test.js \
            test/reality-construction-messy-signal-pilot-v1.0.test.js
      - name: Download original frozen 25-turn GitHub Actions proof
        uses: actions/download-artifact@v4
        with:
          name: construction-25turn-openai-reality-evidence
          run-id: 40030861231
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmark-results
      - name: Generate sandbox capability-gap receipts without new model calls
        run: node scripts/replay-construction-25-capability-gaps-v1.mjs
      - name: Upload proof and mobile UI artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-25turn-universe-capability-gaps
          path: |
            benchmark-results/construction-25-competence-gaps.json
            benchmark-results/construction-25-epistemic-learning.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Explicit bounded-release statement
        run: |
          echo 'No live model calls, production deployment, customer Universe writes, permissions, or proven autonomous repair.'
