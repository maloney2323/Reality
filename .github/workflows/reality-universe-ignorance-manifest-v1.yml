name: Reality Universe Ignorance Manifest V1 Proof
on:
  push:
    branches:
      - feature/universe-ignorance-manifest-v1-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ignorance-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Module syntax
        run: |
          node --check src/reality-universe-ignorance-manifest-v1.0.js
          node --check test/reality-universe-ignorance-manifest-v1.0.test.js
      - name: Universe source and epistemic receipts plus construction controls
        run: |
          node --test             test/reality-universe-ignorance-manifest-v1.0.test.js             test/reality-universe-persistence-contract-v1.0.test.js             test/reality-trusted-observation-admission-v0.1.test.js             test/reality-epistemic-difference-detector-v0.1.test.js             test/reality-typed-claim-evidence-v1.0.test.js             test/reality-intelligence-spine-v1.0.test.js             test/reality-construction-messy-signal-pilot-v1.0.test.js
      - name: Truth and action boundary declaration
        run: |
          echo 'Readback is not real-world truth; manifest is advisory.'
          echo 'No autonomously granted authority, model upgrade, or customer action tested.'
