name: Reality Universe Intelligence Forms V1 Proof
on:
  push:
    branches:
      - feature/universe-intelligence-forms-v1-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intelligence-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax — Universe Form architecture
        run: |
          node --check src/reality-universe-intelligence-forms-v1.0.js
          node --check test/reality-universe-intelligence-forms-v1.0.test.js
      - name: Full closed-loop learning candidate generation, independent gate and harmless-task regressions
        run: |
          node --test \
            test/reality-universe-intelligence-forms-v1.0.test.js \
            test/reality-universe-closed-loop-v1.0.test.js \
            test/reality-universe-correction-verifier-v1.0.test.js \
            test/reality-universe-persistence-contract-v1.0.test.js \
            test/reality-universe-ignorance-manifest-v1.0.test.js \
            test/reality-typed-claim-evidence-v1.0.test.js
      - name: Provenance note
        run: |
          echo 'Test fixtures simulate independent evaluation only to verify gate logic.'
          echo 'No genuine held-out improvement has been proven or promoted.'
          echo 'No model retrained and no production or customer Universe mutated.'
