name: Reality Universe Memory Retrieval v0.1

on:
  push:
    paths:
      - 'src/reality-universe-memory-retrieval-v0.1.js'
      - 'src/reality-universe-bitemporal-ledger-v0.1.js'
      - 'test/reality-universe-memory-retrieval-v0.1.test.js'
      - '.github/workflows/reality-universe-memory-retrieval-v0.1.yml'
  pull_request:
    paths:
      - 'src/reality-universe-memory-retrieval-v0.1.js'
      - 'src/reality-universe-bitemporal-ledger-v0.1.js'
      - 'test/reality-universe-memory-retrieval-v0.1.test.js'
      - '.github/workflows/reality-universe-memory-retrieval-v0.1.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/reality-universe-memory-retrieval-v0.1.test.js
