name: Reality V1 Workers Comp 12 LIVE OpenAI Retest
on:
  push:
    branches:
      - feature/spine-v1-source-completion-20261023
    paths:
      - .github/workflows/reality-v1-wc12-live-retest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-workers-comp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WC_BENCHMARK_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Native source/provenance test gate
        run: node --test test/reality-evidence-boundary-v1.0.test.js
      - name: LIVE OpenAI 12 workers compensation cases and Reality judge
        run: node test/run-workers-comp-native-12-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workers-comp-12-after-spine-v1-upgrade
          path: benchmark-results/wc12-openai-reality.json
          if-no-files-found: ignore
          retention-days: 3
