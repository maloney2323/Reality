name: Reality V1 Evidence/Completion Live WC Regression
on:
  push:
    branches:
      - fix/intelligence-spine-v1-evidence-claims-and-completion-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-v1-live-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WC_BENCHMARK_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Static native judge and V1 completion regression
        run: |
          node --check src/reality-evidence-provenance-v1.0.js
          node --check src/reality-intelligence-spine-v1.0.js
          node --check src/reality-model-gateway-v0.1.js
          node --check src/reality-cognitive-runtime-v1.0.js
          node --check src/reality-live-intelligence-orchestration-v0.1.js
          node --check test/run-workers-comp-native-12-v1.mjs
          node --test test/reality-evidence-provenance-v1.0.test.js test/reality-intelligence-spine-v1.0.test.js test/reality-consequential-trust-native-judge-v1.test.js test/reality-live-intelligence-orchestration-v0.1.test.js
      - name: LIVE OpenAI WC 12-turn retest using upgraded Reality native V1
        run: node test/run-workers-comp-native-12-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-v1-workers-comp-12-openai
          path: benchmark-results/wc12-openai-reality.json
          retention-days: 5
          if-no-files-found: ignore
