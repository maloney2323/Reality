name: Reality Zero Intervention Benchmark v0.1
on:
  pull_request:
    paths:
      - 'src/reality-epistemic-difference-detector-v0.1.js'
      - 'src/reality-universe-reconstruction-v0.1.js'
      - 'test/reality-epistemic-difference-detector-v0.1.test.js'
      - 'test/reality-zero-intervention-benchmark-v0.1.test.js'
      - '.github/workflows/reality-zero-intervention-benchmark-v0.1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epistemic-precision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify typed detection accuracy, provenance, and positive controls
        run: node --test test/reality-epistemic-difference-detector-v0.1.test.js
      - name: Require 100 percent non-intervention on mandatory ZIB cases
        run: node --test test/reality-zero-intervention-benchmark-v0.1.test.js
