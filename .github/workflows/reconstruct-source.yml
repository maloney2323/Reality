name: Reconstruct Base44 source
on:
  push:
    branches: [migration/source-capture]
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.event.head_commit.message != 'Reconstruct canonical Base44 source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        run: |
          set -euo pipefail
          test -f SOURCE_TRANSFER/part-000.b64
          mkdir -p /tmp/reality-transfer
          cat SOURCE_TRANSFER/part-*.b64 > /tmp/reality-source.b64
          base64 -d /tmp/reality-source.b64 > /tmp/reality-source.tar.gz
          sha256sum /tmp/reality-source.tar.gz
          test `sha256sum /tmp/reality-source.tar.gz | awk '{print $1}'` = d4d16c95976de65603118eb0ac91f36e7ab4834f80197126d00db09c2217fd73
          tar -xzf /tmp/reality-source.tar.gz -C .
          rm -rf SOURCE_TRANSFER
          rm -f tmp/source-transfer.mjs tmp/reality-source.tar.gz
      - name: Commit reconstructed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct canonical Base44 source" || exit 0
          git push origin HEAD:migration/source-capture
