name: Schema Gate Live Integration

on:
  push:
    branches:
      - integration/schema-gate-python-v0.1
  pull_request:
    paths:
      - "benchmarks/schema_gate/**"
      - ".github/workflows/schema-gate-integration.yml"

permissions:
  contents: read

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reality_test
          POSTGRES_PASSWORD: reality_test_only
          POSTGRES_DB: reality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reality_test -d reality_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REALITY_TEST_POSTGRES_DSN: postgresql://reality_test:reality_test_only@localhost:5432/reality_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        working-directory: benchmarks/schema_gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "psycopg[binary]==3.2.9"
      - name: Run replay, JWKS rotation, and OIDC regression tests
        working-directory: benchmarks/schema_gate
        run: |
          python -m unittest -v \
            test_postgres_replay_store_integration \
            test_jwks_rotation_integration \
            test_jwks_fetcher \
            test_replay_store \
            test_oidc_identity \
            test_evaluation_context \
            test_policy_authority
