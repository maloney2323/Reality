name: Reality Schema Gate Python v0.1

on:
  pull_request:
    paths:
      - "benchmarks/schema_gate/**"
      - ".github/workflows/schema-gate-python-v0.1.yml"
  push:
    branches:
      - "integration/schema-gate-python-v0.1"
    paths:
      - "benchmarks/schema_gate/**"
      - ".github/workflows/schema-gate-python-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: benchmarks/schema_gate/requirements.txt
      - name: Install pinned dependency
        run: python -m pip install -r benchmarks/schema_gate/requirements.txt
      - name: Run isolated integrity tests
        run: python -m unittest discover -s benchmarks/schema_gate -p 'test_*.py' -v
